var Q=[{"type": "mcq", "q": "'\"Sit down!\" the teacher said to the students.' Reported command:", "options": ["The teacher said the students sat down.", "The teacher told the students to sit down.", "The teacher asked the students if they sit down.", "The teacher told the students sitting down."], "answer": 1, "explanation": "'The teacher TOLD the students TO SIT DOWN.' COMMANDS in reported speech use: tell/order/command + person + TO + base verb. The imperative form is replaced by 'to + infinitive'. No tense backshift on the infinitive itself."}, {"type": "mcq", "q": "'\"Don't touch that!\" she warned him.' Reported:", "options": ["She warned him not touching that.", "She warned him that he didn't touch that.", "She warned him not to touch that.", "She warned him to not touch that."], "answer": 2, "explanation": "'She warned him NOT TO TOUCH that.' NEGATIVE COMMANDS: tell/warn/order + person + NOT TO + base verb. 'Not to' is placed before the infinitive. 'Warned him not to touch' — warned signals the warning tone of the original command."}, {"type": "tf", "q": "Reported commands and requests both use the structure: reporting verb + person + (not) to + base verb.", "answer": true, "explanation": "True. Both COMMANDS ('told me to go') and REQUESTS ('asked me to help') use: reporting verb + person + (not) to + infinitive. The reporting verb changes (tell for commands, ask for requests) but the infinitive structure is the same."}, {"type": "mcq", "q": "'\"Please help me,\" she asked him.' Reported request:", "options": ["She asked him helping her.", "She asked him to help her.", "She asked him that he helped her.", "She requested him helping her."], "answer": 1, "explanation": "'She asked him TO HELP HER.' REQUESTS use ASK + person + TO + infinitive. 'Please' is dropped in reported speech (the politeness is implied by 'asked'). Pronoun: 'me' → 'her'. The infinitive 'to help' replaces the imperative + please."}, {"type": "fill", "q": "'\"Don't be late,\" his mother told him.' Reported: 'His mother told him ________ late.'", "answer": "not to be", "hint": "Tell + person + not to + base verb...", "explanation": "'His mother told him NOT TO BE late.' Negative reported command: told + person + NOT TO + base verb (be). 'Don't be' → 'not to be'. The 'not to' structure replaces 'don't'."}, {"type": "mcq", "q": "'\"Why don't we go for a walk?\" she suggested.' Reported suggestion:", "options": ["She suggested going for a walk.", "She suggested that they went for a walk.", "She suggested to go for a walk.", "She suggested going for a walk OR that they go for a walk."], "answer": 3, "explanation": "REPORTED SUGGESTIONS with 'suggest': (1) 'She suggested GOING for a walk' (gerund); (2) 'She suggested THAT they GO for a walk' (that + subject + base verb/should + verb). BOTH are correct. 'Suggest' NEVER takes 'to + infinitive'."}, {"type": "mcq", "q": "'\"Stop talking!\" the librarian ordered them.' Reported:", "options": ["The librarian ordered them stopping talking.", "The librarian ordered them to stop talking.", "The librarian ordered that they stopped talking.", "The librarian ordered them stop talking."], "answer": 1, "explanation": "'The librarian ORDERED them TO STOP TALKING.' ORDER + person + TO + infinitive. 'Stop' in the command becomes 'to stop' in reported speech. 'Talking' remains as a gerund (object of 'stop')."}, {"type": "tf", "q": "'He suggested that they should leave early' is a correct reported suggestion.", "answer": true, "explanation": "True. 'SUGGEST + that + subject + SHOULD + base verb' is correct: 'He suggested that they SHOULD LEAVE early.' 'Should' is often used in the reported clause after 'suggest': 'I suggest that you should try again.' Alternatively: 'He suggested leaving early.'"}, {"type": "mcq", "q": "'\"Could you pass the salt, please?\" she asked.' Reported:", "options": ["She asked him to pass the salt.", "She asked him if he could pass the salt.", "She asked him passing the salt.", "She asked him that he passed the salt."], "answer": 0, "explanation": "'She asked him TO PASS the salt.' Polite requests with 'could you...?' → simply ASK + person + TO + infinitive. 'Please' is dropped (implied). 'Could you...?' is a polite request form — in reported speech, it becomes a simple 'asked to' structure."}, {"type": "mcq", "q": "'\"Let's meet at the café,\" he suggested.' Reported:", "options": ["He suggested meeting at the café.", "He suggested them to meet at the café.", "He suggested that I meet at the café.", "He suggested to meet at the café."], "answer": 0, "explanation": "'He suggested MEETING at the café.' 'Let's + verb' = suggestion for a shared activity. Reported with gerund: 'suggested + gerund'. 'Suggested to meet' is WRONG — 'suggest' never takes 'to + infinitive'. 'Suggested meeting' or 'suggested that they meet' are correct."}, {"type": "mcq", "q": "Which reporting verb is correct for: '\"You should see a doctor,\" she said.'", "options": ["She told him to see a doctor.", "She advised him to see a doctor.", "She ordered him to see a doctor.", "She suggested him to see a doctor."], "answer": 1, "explanation": "'She ADVISED him to see a doctor.' 'Should see' = advice → use ADVISE + person + to + infinitive. 'Tell' is for commands (neutral). 'Order' is too strong. 'Suggest' cannot be followed by 'to + infinitive' directly."}, {"type": "fill", "q": "'\"Don't open the window,\" he asked her.' Reported: 'He asked her ________ the window.'", "answer": "not to open", "hint": "Ask + person + not to + base verb...", "explanation": "'He asked her NOT TO OPEN the window.' Negative request: asked + person + NOT TO + base verb. 'Don't open' → 'not to open'. Whether it's a command or request depends on the reporting verb (told vs asked)."}, {"type": "tf", "q": "'Suggest + to + infinitive' is correct in reported speech: 'She suggested to go.'", "answer": false, "explanation": "FALSE. 'SUGGEST' CANNOT BE FOLLOWED BY 'TO + INFINITIVE'. 'She suggested to go' is WRONG. Correct: 'She suggested GOING' (gerund) or 'She suggested THAT we go/should go' (that-clause). This is one of the most common errors with 'suggest'."}, {"type": "mcq", "q": "'\"Please don't leave yet,\" she begged him.' Reported:", "options": ["She begged him to not leave yet.", "She begged him not to leave yet.", "She begged him that he didn't leave yet.", "She begged him not leaving yet."], "answer": 1, "explanation": "'She begged him NOT TO LEAVE yet.' Negative request/plea: beg + person + NOT TO + infinitive. 'Not to' precedes the infinitive. 'Begged' captures the emotional intensity of the original plea."}, {"type": "mcq", "q": "What is the reported form of: '\"Make sure you lock the door,\" she reminded him.'", "options": ["She reminded him to lock the door.", "She reminded him locking the door.", "She reminded him that he locks the door.", "She reminded him if he locked the door."], "answer": 0, "explanation": "'She reminded him TO LOCK the door.' REMIND + person + TO + infinitive = reported reminder. 'Make sure you...' is an instruction/reminder → 'reminded to' captures the meaning. Negative: 'She reminded him NOT TO FORGET to lock it.'"}, {"type": "mcq", "q": "'\"Why not try the new restaurant?\" he suggested.' Reported:", "options": ["He suggested to try the new restaurant.", "He suggested that she try the new restaurant OR he suggested trying the new restaurant.", "He suggested her trying the new restaurant.", "He asked her why not to try."], "answer": 1, "explanation": "'He suggested TRYING the new restaurant' OR 'He suggested THAT she try the new restaurant.' 'Why not try?' is a suggestion. Both the gerund form and the that-clause are correct for reported suggestions. 'Suggested to try' is wrong."}, {"type": "mcq", "q": "Which sentence correctly reports: '\"Can you call me back?\" she asked.'", "options": ["She asked if I could call her back.", "She asked me to call her back.", "She asked me calling her back.", "Both A and B are acceptable"], "answer": 3, "explanation": "BOTH are acceptable: (1) 'She asked IF I COULD call her back' (reported question form); (2) 'She asked me TO CALL her back' (reported request form). 'Can you...?' functions as both a question and a polite request, so both reporting structures work."}, {"type": "tf", "q": "'He told me not to worry' correctly reports '\"Don't worry,\" he told me.'", "answer": true, "explanation": "True. 'He told me NOT TO WORRY' — correct negative reported command. 'Don't worry' → NOT TO WORRY. Tell + me + not to + base verb. The tone of reassurance might be better captured with 'reassured' but 'told...not to' is grammatically correct."}, {"type": "mcq", "q": "'\"You must submit the form today,\" she instructed.' Reported:", "options": ["She instructed submitting the form that day.", "She instructed me to submit the form that day.", "She instructed me submitting the form that day.", "She instructed that I submitted the form that day."], "answer": 1, "explanation": "'She instructed me TO SUBMIT the form THAT DAY.' INSTRUCT + person + TO + infinitive. 'Must' is replaced by 'to' (the obligation is conveyed by the reporting verb 'instructed'). 'Today' → 'that day' (time expression change)."}];
var SKEY="m7_l4",NEXT="q7-5.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
