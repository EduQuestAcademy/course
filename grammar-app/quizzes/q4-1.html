var Q=[{"type": "mcq", "q": "What is the primary function of tense in English grammar?", "options": ["To show the mood of the speaker", "To locate an action or state in time", "To indicate the number of subjects", "To show the formality of the sentence"], "answer": 1, "explanation": "TENSE locates an action or state in TIME — past, present, or future. It is a grammatical category expressed through verb forms that tells us WHEN something happens, happened, or will happen."}, {"type": "mcq", "q": "How many basic tense divisions does English have?", "options": ["Two — past and present", "Three — past, present, and future", "Four — past, present, future, and conditional", "Six — simple, continuous, perfect, perfect continuous for each time"], "answer": 0, "explanation": "Strictly speaking, English has only TWO grammatical tenses: PAST and PRESENT (marked by verb inflection). 'Future' is expressed through modal verbs, 'will/shall', or present forms — not a separate inflected tense."}, {"type": "tf", "q": "Tense and time are exactly the same concept in English grammar.", "answer": false, "explanation": "False. TENSE is a grammatical form (how the verb changes). TIME is a concept (past, present, future). They often correspond but not always: 'She leaves tomorrow' uses PRESENT tense to express FUTURE time."}, {"type": "mcq", "q": "In the sentence 'The train leaves at 6 tomorrow,' which tense is used to express future meaning?", "options": ["Future simple", "Present continuous", "Simple present", "Past simple"], "answer": 2, "explanation": "SIMPLE PRESENT ('leaves') is used here to express a scheduled future event. The present tense can express future time when referring to timetables, schedules, or fixed arrangements."}, {"type": "mcq", "q": "What are the four main ASPECTS of the English tense system?", "options": ["Simple, continuous, perfect, perfect continuous", "Past, present, future, conditional", "Active, passive, direct, indirect", "Affirmative, negative, interrogative, imperative"], "answer": 0, "explanation": "The four ASPECTS are: SIMPLE (basic action), CONTINUOUS/PROGRESSIVE (ongoing action), PERFECT (completed with relevance to another time), PERFECT CONTINUOUS (ongoing action with relevance to another time). Each combines with past/present/future."}, {"type": "fill", "q": "The verb form that shows ongoing or in-progress actions is called the ________ aspect.", "answer": "continuous|progressive", "hint": "Happening right now or around now...", "explanation": "The CONTINUOUS (or PROGRESSIVE) aspect uses 'be + -ing' to show actions in progress: 'She is writing', 'He was sleeping'. It emphasises the ongoing, incomplete nature of the action."}, {"type": "mcq", "q": "Which sentence uses the simple present to show a HABITUAL action?", "options": ["She is eating dinner now.", "She ate dinner at 7 last night.", "She eats dinner at 7 every evening.", "She will eat dinner later."], "answer": 2, "explanation": "'She EATS dinner at 7 every evening' — simple present expresses HABITUAL actions (routines, habits, regular events). Time expressions like 'every evening', 'always', 'usually' signal habitual use."}, {"type": "tf", "q": "The verb 'be' in English changes form to show both present and past tense.", "answer": true, "explanation": "True. 'Be' has the most irregular tense forms: AM/IS/ARE (present) and WAS/WERE (past). It is the only English verb with three distinct present tense forms (am, is, are)."}, {"type": "mcq", "q": "What does the PERFECT aspect express?", "options": ["Actions happening right now", "Actions completed before a reference point, with relevance to that point", "Actions that will happen in the future", "Actions that are habitual"], "answer": 1, "explanation": "The PERFECT aspect (have/had + past participle) connects two time points — a completed action and its RELEVANCE to a later reference point. 'She has finished' = completed, relevant to NOW. 'She had finished' = completed before another past time."}, {"type": "mcq", "q": "Which pair correctly shows the difference between simple past and present perfect?", "options": ["'I saw him yesterday' (recent) vs 'I have seen him' (distant past)", "'I saw him yesterday' (specific past time) vs 'I have seen him before' (unspecified past, relevant now)", "Both mean exactly the same thing", "'I saw him' (British) vs 'I have seen him' (American)"], "answer": 1, "explanation": "SIMPLE PAST ('I saw him yesterday') = specific point in the past, often with a time expression. PRESENT PERFECT ('I have seen him before') = past experience/action with present relevance, no specific time stated."}, {"type": "mcq", "q": "'By next year, she will have graduated.' What tense is this?", "options": ["Future simple", "Future continuous", "Future perfect", "Present perfect"], "answer": 2, "explanation": "FUTURE PERFECT ('will have + past participle') expresses an action that will be COMPLETED before a specific future time. 'By next year' is the reference point; 'graduated' will be complete before that point."}, {"type": "fill", "q": "In English, the simple present tense is formed using the base form of the verb, with ________ added for third person singular.", "answer": "-s|s|es|-es", "hint": "He/she/it + verb + ?", "explanation": "Third person singular (he/she/it) adds -S or -ES to the base verb: 'she runs', 'he watches', 'it goes'. All other persons use the base form: 'I run', 'you run', 'they run'."}, {"type": "tf", "q": "English verbs change form to show agreement with both the subject's person AND number.", "answer": true, "explanation": "True. English verbs show SUBJECT-VERB AGREEMENT. Simple present: 'I/you/we/they RUN' vs 'he/she/it RUNS'. The -s/-es ending marks third person singular. Past tense 'be': 'I/he/she WAS' vs 'you/we/they WERE'."}, {"type": "mcq", "q": "Which statement about the future in English is most accurate?", "options": ["English has a dedicated future tense inflection on verbs", "Future time is expressed through modal 'will', 'going to', or present tenses", "Future is expressed only with 'will'", "'Shall' is the only correct future form"], "answer": 1, "explanation": "English has NO dedicated future tense inflection. Future time is expressed through: WILL (predictions, decisions), GOING TO (intentions, predictions from evidence), PRESENT CONTINUOUS (arrangements), SIMPLE PRESENT (schedules)."}, {"type": "mcq", "q": "What is a 'stative verb' and how does it affect tense use?", "options": ["A verb that only exists in the past tense", "A verb describing a state rather than an action — rarely used in continuous tenses", "A verb used only in formal writing", "A verb that never changes form"], "answer": 1, "explanation": "STATIVE VERBS describe states, not actions: know, believe, want, love, have (possession), seem, contain. They are not normally used in continuous tenses: 'I know' (not 'I am knowing'), 'She wants' (not 'She is wanting')."}, {"type": "mcq", "q": "Which sentence incorrectly mixes tense and time?", "options": ["I will call you tomorrow.", "She was born in 1990.", "Yesterday, she will go to school.", "He has lived here for ten years."], "answer": 2, "explanation": "'Yesterday, she WILL go to school' — 'yesterday' is a past time marker but 'will go' is future. This tense/time mismatch is an error. Correct: 'Yesterday, she WENT to school.'"}, {"type": "tf", "q": "The present continuous tense can be used to express future plans and arrangements.", "answer": true, "explanation": "True. PRESENT CONTINUOUS can express future arrangements: 'She is meeting the doctor tomorrow.' (appointment already arranged). This is very common in informal British English for near-future plans."}, {"type": "mcq", "q": "What is the difference between a DYNAMIC verb and a STATIVE verb?", "options": ["Dynamic verbs describe states; stative verbs describe actions", "Dynamic verbs describe actions/events; stative verbs describe states/conditions", "Dynamic verbs are regular; stative verbs are irregular", "Dynamic verbs are transitive; stative verbs are intransitive"], "answer": 1, "explanation": "DYNAMIC verbs describe actions, events, or processes: run, eat, build, speak. STATIVE verbs describe states, conditions, or relationships: know, love, contain, belong. Dynamic verbs can use all tenses; stative verbs avoid continuous forms."}, {"type": "mcq", "q": "'She had been teaching for 20 years when she retired.' What does the tense sequence show?", "options": ["Two simultaneous past actions", "An ongoing past action (teaching) that preceded and led up to a specific past event (retirement)", "A future plan", "A present habit"], "answer": 1, "explanation": "PAST PERFECT CONTINUOUS ('had been teaching') + SIMPLE PAST ('retired') — the continuous action was ongoing in the past UP TO a specific past event. The 20-year teaching career preceded and ended at retirement."}, {"type": "mcq", "q": "Which time expression is most commonly used with the present perfect tense?", "options": ["Yesterday", "Last year", "In 1990", "Already"], "answer": 3, "explanation": "ALREADY is commonly used with PRESENT PERFECT: 'She has already finished.' Other present perfect time expressions: ever, never, just, yet, recently, since, for. 'Yesterday', 'last year', 'in 1990' specify a past time → use simple past."}, {"type": "mcq", "q": "Which sentence best demonstrates understanding of tense as a grammatical concept?", "options": ["'Will' always refers to the future.", "'The president opens the new hospital tomorrow' uses present tense with future meaning.", "Tense always matches time exactly.", "Past tense verbs always end in -ed."], "answer": 1, "explanation": "'The president opens the new hospital tomorrow' demonstrates that TENSE (present) and TIME (future) can differ. A scheduled/timetabled event uses the present tense for future meaning. This shows tense is a grammatical form, not just a time label."}];
var SKEY="m4_l1",NEXT="q4-2.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
