var Q=[{"type": "mcq", "q": "'People say that he is the best chef in the city.' Which passive reporting structure uses IT as subject?", "options": ["He is said to be the best chef.", "It is said that he is the best chef.", "He has been said to be the best chef.", "It says that he is the best chef."], "answer": 1, "explanation": "'IT IS SAID THAT he is the best chef' — IMPERSONAL PASSIVE REPORTING: 'It + passive reporting verb + that clause.' This attributes the statement to general opinion without specifying a source. Common: 'It is believed that...', 'It is reported that...'"}, {"type": "mcq", "q": "'People believe that she discovered the formula.' Which structure uses the PERSONAL passive?", "options": ["It is believed that she discovered the formula.", "She is believed to have discovered the formula.", "She believed to discover the formula.", "The formula is believed to have been discovered."], "answer": 1, "explanation": "'She IS BELIEVED TO HAVE DISCOVERED the formula' — PERSONAL PASSIVE REPORTING. The person (she) becomes the subject. Structure: subject + passive reporting verb + to-infinitive. When the reported event is in the past: to HAVE + past participle."}, {"type": "tf", "q": "Both 'It is said that...' and 'He is said to be...' are correct passive reporting structures.", "answer": true, "explanation": "True. TWO PASSIVE REPORTING STRUCTURES for the same idea: (1) IMPERSONAL: 'It IS SAID THAT he is the best.' (2) PERSONAL: 'He IS SAID TO BE the best.' Both are correct. Personal passive puts the topic person as the grammatical subject."}, {"type": "mcq", "q": "'Experts think that the volcano will erupt soon.' Personal passive form:", "options": ["The volcano is thought to erupt soon.", "The volcano is thought to be erupting soon.", "The volcano is thought to have erupted soon.", "The volcano is thought will erupt soon."], "answer": 0, "explanation": "'The volcano IS THOUGHT TO ERUPT soon' — personal passive with future reference. Since the eruption hasn't happened yet, we use 'to + base verb' (not 'to have + past participle' which is for past events)."}, {"type": "fill", "q": "'People report that three people were injured.' Impersonal passive: '________ that three people were injured.'", "answer": "It is reported", "hint": "It + is/was + reporting verb + that...", "explanation": "'IT IS REPORTED that three people were injured.' Impersonal passive reporting: It + is/was + past participle of reporting verb + that-clause. Common reporting verbs: said, believed, thought, reported, claimed, known, alleged."}, {"type": "mcq", "q": "'Scientists have found that the drug is effective.' Personal passive (focus on the drug):", "options": ["The drug is found effective.", "The drug has been found to be effective.", "The drug was found effective.", "The drug is found to be effective always."], "answer": 1, "explanation": "'The drug HAS BEEN FOUND TO BE effective' — personal passive preserving the present perfect. When the main verb is present perfect ('have found'), the passive uses 'has been found'. 'To be effective' = complement showing the finding."}, {"type": "mcq", "q": "Which reporting verbs commonly appear in impersonal passive structures?", "options": ["Run, jump, eat, sleep", "Say, believe, think, report, claim, know, allege", "Want, need, like, prefer", "Can, should, will, must"], "answer": 1, "explanation": "COMMON PASSIVE REPORTING VERBS: say, believe, think, report, claim, know, allege, understand, consider, expect, find. These are all reporting/mental verbs that describe what people communicate or believe collectively."}, {"type": "tf", "q": "'He is alleged to have stolen the money' uses the personal passive with 'to have + past participle' because the alleged theft happened BEFORE the present report.", "answer": true, "explanation": "True. PERSONAL PASSIVE + to HAVE + PAST PARTICIPLE: when the reported action happened BEFORE the reporting, use 'to have + past participle'. 'He IS ALLEGED TO HAVE STOLEN' (allegedly stole = past) vs 'He is alleged to be involved' (allegedly is = present/ongoing)."}, {"type": "mcq", "q": "'It was claimed that the company had falsified data.' When might the PAST passive be used?", "options": ["When reporting present facts", "When reporting something that was said/believed in the past (past context)", "Only in legal contexts", "When the claim is true"], "answer": 1, "explanation": "'IT WAS CLAIMED' = PAST IMPERSONAL PASSIVE — used when reporting what was said/believed at a PAST TIME. The past tense shifts the reporting into the past: 'It was said that...', 'It was believed that...' News reports about past events use this."}, {"type": "mcq", "q": "'She is known to be an expert in the field.' What is the active equivalent?", "options": ["People know she is an expert.", "She knows the field well.", "She has known the field.", "The field is known by her."], "answer": 0, "explanation": "'PEOPLE KNOW SHE IS AN EXPERT' = the active version. Passive: 'She IS KNOWN TO BE an expert' = 'People know she is an expert.' The personal passive replaces the general 'people/they/everyone' subject with a passive structure."}, {"type": "mcq", "q": "'It is understood that the CEO will resign.' Which version uses the PERSONAL passive?", "options": ["The CEO is understood to resign.", "The CEO is understood to be resigning.", "The CEO is understood will resign.", "The CEO understands to resign."], "answer": 1, "explanation": "'The CEO IS UNDERSTOOD TO BE RESIGNING' — personal passive. Since the resignation is ongoing/in progress (present continuous meaning), use 'to be + -ing'. 'Is understood to resign' (simple) vs 'is understood to be resigning' (continuous) — both possible depending on nuance."}, {"type": "fill", "q": "'People consider her to be the most talented architect.' Impersonal passive: 'It ________ she is the most talented architect.'", "answer": "is considered that", "hint": "It + is + past participle of reporting verb + that...", "explanation": "'It IS CONSIDERED THAT she is the most talented architect.' Impersonal: It + is considered + that-clause. Personal: 'She is considered to be the most talented architect.' Both forms are correct."}, {"type": "tf", "q": "'The suspect is alleged to have been in the building at the time of the robbery.' Uses passive reporting verb + passive infinitive.", "answer": true, "explanation": "True. 'IS ALLEGED TO HAVE BEEN' — this stacks two passives: (1) 'is alleged' (passive reporting verb) + (2) 'to have been in the building' (the alleged situation). The suspect 'being in the building' is itself passive positioning."}, {"type": "mcq", "q": "Which sentence correctly uses PASSIVE REPORTING in a news context?", "options": ["People are saying the elections were rigged.", "The elections are said to have been rigged.", "Someone says the elections were rigged.", "They say that elections rigged."], "answer": 1, "explanation": "'The elections ARE SAID TO HAVE BEEN RIGGED' — correct passive reporting. Uses personal passive + 'to have been + past participle' (rigged happened before the reporting). News media uses this structure to report claims without confirming them."}, {"type": "mcq", "q": "'It is expected that prices will rise.' What does the impersonal passive reporting express?", "options": ["One expert expects this", "A general expectation held by people/analysts in general", "A personal prediction", "A historical fact"], "answer": 1, "explanation": "'IT IS EXPECTED' = GENERAL EXPECTATION without a specific source. The passive removes 'analysts/economists/people' and presents the expectation as if it is widely shared. Common in financial news: 'It is expected that...', 'It is projected that...'"}, {"type": "mcq", "q": "'He is thought to be hiding in the mountains.' What tense is the infinitive, and why?", "options": ["Past infinitive — the hiding happened before the report", "Present/simple infinitive — the hiding is happening NOW (concurrent with the reporting)", "Future infinitive — he will hide", "Perfect infinitive — he has hidden"], "answer": 1, "explanation": "'TO BE HIDING' = PRESENT INFINITIVE (concurrent). The hiding is happening NOW, at the same time as the reporting. Compare: 'He is thought TO HAVE HIDDEN' (past — he hid before the reporting). The tense of the infinitive shows timing relative to the reporting verb."}, {"type": "tf", "q": "'It is believed that', 'it is thought that', and 'it is said that' can all introduce reported opinions without specifying a source.", "answer": true, "explanation": "True. All three are IMPERSONAL PASSIVE REPORTING structures that attribute a belief/opinion to general/unspecified sources. They are used when the source is 'people in general', 'experts', 'the media' etc. — too vague or numerous to specify."}, {"type": "mcq", "q": "'Witnesses claim that the vehicle was speeding.' Rewrite as personal passive focusing on 'the vehicle':", "options": ["The vehicle claims to be speeding.", "The vehicle is claimed to have been speeding.", "The vehicle was claiming to speed.", "It claims the vehicle was speeding."], "answer": 1, "explanation": "'The vehicle IS CLAIMED TO HAVE BEEN SPEEDING.' Personal passive with the vehicle as subject. 'To have been speeding' = past continuous equivalent (speeding was happening before/during the claim). 'Claimed' = passive of 'claim'."}, {"type": "mcq", "q": "Why are passive reporting structures particularly useful in journalism?", "options": ["They are shorter than active", "They allow reporters to convey information without confirming or taking responsibility for its accuracy", "They are more dramatic", "They always indicate the source"], "answer": 1, "explanation": "JOURNALISM uses passive reporting to convey UNVERIFIED INFORMATION without endorsing it: 'It is alleged...', 'It is reported...', 'The suspect is said to have...' This protects the publication legally and maintains journalistic neutrality on unconfirmed claims."}];
var SKEY="m6_l5",NEXT="q6-6.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
