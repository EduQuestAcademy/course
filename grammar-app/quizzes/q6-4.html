var Q=[{"type": "mcq", "q": "What is the structure of a MODAL PASSIVE?", "options": ["modal + have + past participle", "modal + be + past participle", "modal + being + past participle", "modal + been + past participle"], "answer": 1, "explanation": "MODAL PASSIVE = modal + BE + past participle. 'The report MUST BE SUBMITTED.' 'This CAN BE DONE.' 'Results WILL BE ANNOUNCED.' 'Be' stays in base form after the modal; the past participle follows."}, {"type": "mcq", "q": "'Someone must repair the bridge immediately.' What is the modal passive?", "options": ["The bridge must be repairing immediately.", "The bridge must be repaired immediately.", "The bridge must been repaired immediately.", "The bridge must have repaired immediately."], "answer": 1, "explanation": "'The bridge MUST BE REPAIRED immediately.' Modal passive: must + be + past participle (repaired). The agent ('someone') is dropped. The object ('the bridge') becomes the new subject."}, {"type": "tf", "q": "Modal passives with PERFECT aspect use the structure: modal + have + been + past participle.", "answer": true, "explanation": "True. MODAL PERFECT PASSIVE = modal + HAVE + BEEN + past participle: 'The letter MUST HAVE BEEN SENT already.' 'It SHOULD HAVE BEEN FINISHED by now.' 'The decision COULD HAVE BEEN MADE earlier.' Three words: have + been + past participle."}, {"type": "mcq", "q": "'You should submit the application before Friday.' Modal passive form:", "options": ["The application should submitted before Friday.", "The application should be submitted before Friday.", "The application should been submitted before Friday.", "The application should have submitted before Friday."], "answer": 1, "explanation": "'The application SHOULD BE SUBMITTED before Friday.' Modal passive: should + be + past participle (submitted). Standard modal passive for instructions and recommendations."}, {"type": "fill", "q": "'They will announce the results next week.' Modal passive: 'The results ________ next week.'", "answer": "will be announced", "hint": "Will + be + past participle...", "explanation": "'The results WILL BE ANNOUNCED next week.' Future modal passive: will + be + past participle. The agent ('they') is omitted. This is the standard future passive, with 'will' functioning as the modal."}, {"type": "mcq", "q": "'The mistake should have been caught earlier.' What does this modal perfect passive express?", "options": ["The mistake will be caught", "The mistake was caught — a statement of fact", "An expectation about the past that was not fulfilled — someone should have caught it but didn't", "A future obligation"], "answer": 2, "explanation": "'SHOULD HAVE BEEN CAUGHT' = UNFULFILLED PAST EXPECTATION in PASSIVE form. The mistake was NOT caught (passive of catching) when it should have been. Combines 'should have' (past criticism) + 'been caught' (passive)."}, {"type": "mcq", "q": "'This problem can be solved easily.' What does the modal passive express?", "options": ["Someone is solving the problem now", "It is possible to solve this problem (ability/possibility)", "The problem must be solved", "Someone solved it easily"], "answer": 1, "explanation": "'Can BE SOLVED' = POSSIBILITY / ABILITY in passive. 'Can' retains its meaning (it is possible/it is able to be done) in the passive form. The focus is on the problem (can it be solved?) rather than on who solves it."}, {"type": "tf", "q": "'The medicine must not be taken on an empty stomach' uses a modal passive for prohibition.", "answer": true, "explanation": "True. 'MUST NOT BE TAKEN' = PROHIBITION in PASSIVE form. Common in instructions, labels, and official notices: 'Smoking must not be permitted', 'Children must not be left unattended.' The passive gives impersonal authority to rules."}, {"type": "mcq", "q": "'Someone might have left the door unlocked.' Modal perfect passive form:", "options": ["The door might have been left unlocked.", "The door might be left unlocked.", "The door might have left unlocked.", "The door was might left unlocked."], "answer": 0, "explanation": "'The door MIGHT HAVE BEEN LEFT unlocked.' Modal perfect passive: might + have + been + past participle (left). Three words after 'might': 'have been left'. This expresses a past possibility in passive voice."}, {"type": "mcq", "q": "'Passengers are requested to fasten their seatbelts.' What type of passive is this?", "options": ["Modal passive", "Present simple passive used for formal instructions", "Future passive", "Past continuous passive"], "answer": 1, "explanation": "'ARE REQUESTED to fasten' = PRESENT SIMPLE PASSIVE for FORMAL INSTRUCTIONS. 'Requested' here functions like a modal (expressing obligation/instruction). This formal passive is common in notices, announcements, and official communications."}, {"type": "mcq", "q": "Which sentence correctly uses COULD HAVE BEEN + past participle?", "options": ["The accident could have been avoided with better planning.", "The accident could have avoided with better planning.", "The accident could been avoided with better planning.", "The accident could have been avoiding with better planning."], "answer": 0, "explanation": "'The accident COULD HAVE BEEN AVOIDED with better planning.' Structure: could + have + been + past participle (avoided). This expresses an unrealised past possibility in passive — the accident happened but it was preventable."}, {"type": "fill", "q": "'No shoes may be worn inside the temple.' What does the modal passive MAY express here?", "answer": "permission/prohibition", "hint": "May in rules = permission to do something...", "explanation": "'No shoes MAY BE WORN' = PROHIBITION using 'may' in a formal/official rule. In formal notices and religious/cultural rules, 'may' expresses what is/isn't permitted. Compare: 'Shoes may be stored at the entrance.'"}, {"type": "tf", "q": "'The bridge will be repaired' and 'The bridge is going to be repaired' are both future passives with similar meaning.", "answer": true, "explanation": "True. Both express FUTURE PASSIVE: 'WILL BE REPAIRED' (simple future passive) and 'IS GOING TO BE REPAIRED' (going to future passive). 'Going to be + past participle' is the 'going to' future in passive form."}, {"type": "mcq", "q": "'He ought to be informed about the changes.' What does OUGHT TO BE express?", "options": ["He has the ability to be informed", "It is morally appropriate/recommended that he be informed", "He is being informed right now", "He was informed in the past"], "answer": 1, "explanation": "'OUGHT TO BE INFORMED' = MORAL RECOMMENDATION in passive. 'Ought to' retains its meaning (moral duty/recommendation) in the passive form: 'ought to be + past participle.' The focus is on the recipient (he) needing to receive information."}, {"type": "mcq", "q": "'The contract needs to be signed by both parties.' NEEDS TO BE is:", "options": ["A modal passive (needs is a modal)", "A semi-modal passive — 'need to be + past participle' expressing necessity", "An error — 'needs' cannot form passives", "A future prediction"], "answer": 1, "explanation": "'NEEDS TO BE + past participle' = SEMI-MODAL PASSIVE. 'Need to' acts as a semi-modal expressing necessity. The passive form is 'needs to be + past participle': 'The form needs to be filled in', 'The problem needs to be addressed.'"}, {"type": "mcq", "q": "'This shouldn't be happening.' What tense/aspect is the modal passive here?", "options": ["Simple modal passive", "Modal continuous passive", "Modal perfect passive", "Future modal passive"], "answer": 1, "explanation": "'SHOULDN'T BE HAPPENING' = MODAL CONTINUOUS PASSIVE: shouldn't + be + being + past participle — wait, actually: 'be happening' = continuous. This is: should + not + be + -ing (modal + continuous). Expresses that an ongoing action is incorrect/unexpected."}, {"type": "mcq", "q": "Which sentence correctly uses MODAL PERFECT PASSIVE?", "options": ["The report must been submitted already.", "The report must have been submitted already.", "The report must have submitted already.", "The report must be have submitted already."], "answer": 1, "explanation": "'The report MUST HAVE BEEN SUBMITTED already.' Structure: must + have + been + past participle (submitted). The three words 'have been submitted' are the perfect passive portion. 'Must have' = strong past deduction in passive."}, {"type": "tf", "q": "'The issue can be dealt with tomorrow' is a correct modal passive with a phrasal verb.", "answer": true, "explanation": "True. 'Can BE DEALT WITH' — phrasal verb passive: 'deal with' → 'be dealt with'. Phrasal verbs keep their particles in passive: 'dealt WITH', 'looked after' → 'be looked after', 'put off' → 'be put off'. The particle stays attached."}, {"type": "mcq", "q": "'The meeting could be rescheduled.' What best describes this modal passive?", "options": ["The meeting was rescheduled", "It is possible to reschedule the meeting (possibility)", "The meeting must be rescheduled (obligation)", "The meeting has been rescheduled (completed action)"], "answer": 1, "explanation": "'Could BE RESCHEDULED' = POSSIBILITY. 'Could' retains its meaning in passive: it is possible for the meeting to be rescheduled. The passive shifts focus to the meeting (what can be done to it) rather than who would reschedule it."}];
var SKEY="m6_l4",NEXT="q6-5.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
