var Q=[{"type": "mcq", "q": "Which tense combination is MOST characteristic of literary narrative?", "options": ["Present simple + future simple", "Simple past (main events) + past continuous (background) + past perfect (backstory)", "Present perfect + past perfect", "Future perfect + present continuous"], "answer": 1, "explanation": "NARRATIVE TENSE SYSTEM: (1) SIMPLE PAST for main plot events: 'She entered the room'; (2) PAST CONTINUOUS for background/atmosphere: 'Rain was falling'; (3) PAST PERFECT for backstory: 'She had known him for years.' These three tenses work together to create temporal depth in narrative."}, {"type": "mcq", "q": "'Suddenly, the door burst open.' What narrative effect does 'suddenly' + simple past create?", "options": ["Slow, reflective narration", "DRAMATIC INTERRUPTION: 'suddenly' signals an unexpected, fast event; simple past makes it immediate and complete — a classic narrative shock device", "Background description", "Historical fact"], "answer": 1, "explanation": "'SUDDENLY + SIMPLE PAST' = narrative shock device. 'Suddenly, the door BURST OPEN.' The adverb signals unexpectedness; the simple past makes the event complete and immediate. Simple past with dramatic adverbs ('suddenly', 'at that moment', 'without warning') creates climactic narrative moments."}, {"type": "tf", "q": "The HISTORIC PRESENT (using present tense to narrate past events) creates vividness and immediacy in storytelling.", "answer": true, "explanation": "True. HISTORIC PRESENT: 'So she WALKS in, LOOKS around, and SAYS...' — past events narrated in present tense for dramatic effect. Spoken storytelling frequently uses this device. Literary prose also uses it for heightened immediacy. It brings the reader 'into' the moment, as if it is happening now."}, {"type": "mcq", "q": "'She had lived in the city for twenty years before she noticed the old building on the corner.' What does past perfect signal here?", "options": ["The noticing happened first", "Past perfect ('had lived') signals BACKSTORY — a longer period that preceded the main narrative moment ('she noticed')", "A conditional", "A regret"], "answer": 1, "explanation": "PAST PERFECT AS BACKSTORY: 'HAD LIVED for twenty years' = the long background period that preceded the narrative present moment ('noticed'). Past perfect reaches back behind the main story timeline to establish history, character context, or prior events that explain the current narrative situation."}, {"type": "fill", "q": "'She ________ (walk) through the forest when she ________ (hear) a strange sound.' Classic narrative tense combination.", "answer": "was walking / heard", "hint": "Background action + interrupting event...", "explanation": "'She WAS WALKING through the forest when she HEARD a strange sound.' PAST CONTINUOUS (background, ongoing action) + SIMPLE PAST (interrupting event). The classic narrative combination: continuous background + sudden interruption. Creates the sense of an ongoing peaceful state disrupted by an event."}, {"type": "mcq", "q": "'The old man smiled, his eyes crinkling at the corners.' The participial phrase 'his eyes crinkling' creates what narrative effect?", "options": ["A time sequence — his eyes crinkling then he smiled", "SIMULTANEOUS DETAIL: the participial absolute adds a simultaneous physical description, enriching the character portrait without a new sentence", "A conditional", "A contradiction"], "answer": 1, "explanation": "ABSOLUTE PARTICIPIAL for SIMULTANEOUS DETAIL: 'his eyes crinkling at the corners' = his eyes were crinkling at the same time as he smiled. This compact grammatical structure adds physical, characterising detail simultaneously with the main action. Narrative prose uses participials to layer detail efficiently."}, {"type": "mcq", "q": "'\"I've been waiting all day,\" she said, her voice barely above a whisper.' How many narrative elements combine here?", "options": ["One", "Two", "Three", "Four"], "answer": 2, "explanation": "THREE NARRATIVE ELEMENTS: (1) DIRECT SPEECH: '\"I've been waiting all day\"' (with present perfect continuous for emotional accumulation); (2) REPORTING VERB + PRONOUN: 'she said'; (3) PARTICIPIAL ABSOLUTE: 'her voice barely above a whisper' (simultaneous manner detail). Narrative prose combines dialogue, reporting, and physical description efficiently."}, {"type": "tf", "q": "Non-defining relative clauses are frequently used in narrative to add character or setting detail parenthetically.", "answer": true, "explanation": "True. NON-DEFINING RELATIVE CLAUSES IN NARRATIVE: 'She met James, WHO HAD BEEN HER CHILDHOOD FRIEND, at the station.' The relative clause adds character history without interrupting the narrative flow. 'The house, WHICH HAD STOOD FOR A HUNDRED YEARS, finally fell.' Parenthetical relative clauses enrich description economically."}, {"type": "mcq", "q": "'Looking back, she realised she had never truly understood him.' What is the narrative function of the past perfect here?", "options": ["It describes a habitual past action", "RETROSPECTIVE REALISATION: the narrative moves to a later viewpoint ('looking back') from which the narrator reflects on an earlier state ('had never truly understood') — past perfect as narrative retrospection", "A conditional", "A scientific fact"], "answer": 1, "explanation": "NARRATIVE RETROSPECTION with PAST PERFECT: 'SHE HAD NEVER TRULY UNDERSTOOD HIM' — from the later narrative viewpoint ('looking back'), the narrator realises something about the earlier period. Past perfect in narrative creates the sense of hindsight, allowing characters/narrators to reflect on past truths they only now recognise."}, {"type": "mcq", "q": "'It was a dark and stormy night. The rain lashed against the windows.' What register and grammatical features establish narrative atmosphere?", "options": ["Academic register with passive voice", "NARRATIVE REGISTER: simple past + sensory details + weather pathetic fallacy; 'lashed' is a vivid, dynamic verb; present setting is immediately established", "Future tense for anticipation", "Technical vocabulary"], "answer": 1, "explanation": "NARRATIVE ATMOSPHERE through GRAMMAR: (1) SIMPLE PAST establishes the story world; (2) VIVID DYNAMIC VERB: 'lashed' (more evocative than 'hit'); (3) PERSONIFICATION: weather as active agent; (4) SHORT DECLARATIVE SENTENCES: creates pace and directness. Grammar serves mood — dark, stormy language = foreboding."}, {"type": "mcq", "q": "'She would sit by the window every evening, watching the street below.' WOULD expresses:", "options": ["A conditional", "REPEATED PAST HABIT: 'would' + base verb for characteristic past behaviour — a habitual action that reveals character", "A future plan", "A command"], "answer": 1, "explanation": "NARRATIVE 'WOULD' for PAST HABIT: 'She WOULD SIT by the window every evening' = she habitually did this. This use of 'would' in narrative creates CHARACTER PORTRAIT through repeated behaviour. 'He would always hum while he cooked.' 'She would smile before answering.' Habitual 'would' reveals character routines."}, {"type": "mcq", "q": "'Having spent three weeks alone in the mountains, he returned a changed man.' The participial clause's function:", "options": ["Introduces a condition", "PRIOR EXPERIENCE as EXPLANATION: 'having spent three weeks' = the experience that preceded and explains his transformation ('returned a changed man'). Perfect participial = prior causal experience", "Contradicts the main clause", "Describes simultaneous action"], "answer": 1, "explanation": "PERFECT PARTICIPIAL = PRIOR CAUSE: 'HAVING SPENT three weeks alone' (past experience) → 'he returned a CHANGED MAN' (result of that experience). The participial clause efficiently communicates the backstory/cause that explains the character's transformation. A powerful narrative compression device."}, {"type": "fill", "q": "'She stood at the window, ________ (watch) the snow fall, ________ (think) of all that had been lost.' Complete with participials.", "answer": "watching / thinking", "hint": "Present participials for simultaneous ongoing actions...", "explanation": "'She stood at the window, WATCHING the snow fall, THINKING of all that had been lost.' SIMULTANEOUS PARTICIPIALS: 'watching' and 'thinking' are ongoing actions happening at the same time as 'stood.' This technique creates a rich, layered portrait of a character's simultaneous physical and mental state."}, {"type": "tf", "q": "Dialogue in narrative typically uses a mix of simple past reporting verbs ('said', 'asked') and present tense for the spoken words.", "answer": true, "explanation": "True. NARRATIVE DIALOGUE CONVENTION: (1) DIRECT SPEECH in present/future tense (as originally spoken): '\"I will come tomorrow,\" she said.' (2) REPORTING VERB in past tense: 'she SAID/ASKED/WHISPERED.' The contrast creates the sense of live speech within past narrative. The words are vivid/present; the reporting is past."}, {"type": "mcq", "q": "'The city, once vibrant and crowded, now lay silent and empty.' The past perfect is implied by 'once'. What narrative technique is this?", "options": ["Foreshadowing", "CONTRAST ACROSS TIME: 'once' signals the past state; 'now lay' signals the present narrative state. The juxtaposition of past vitality and present silence creates pathos. Grammar (tense contrast) serves the emotional/thematic purpose", "A flashback", "Dramatic irony"], "answer": 1, "explanation": "TEMPORAL CONTRAST: 'ONCE vibrant' (past state) vs 'NOW lay silent' (current state). 'Once' implies the past without explicit past perfect. The tense contrast (implied past vs narrative present) creates emotional impact. Grammar — the shift between then and now — carries the narrative's central meaning: loss, change, time."}, {"type": "mcq", "q": "'Not a word was spoken. Not a sound broke the silence.' The repeated fronted negative structure creates what effect?", "options": ["A question", "EMPHATIC ACCUMULATION: fronted negatives ('not a word', 'not a sound') + subject-auxiliary inversion creates a rhythmic, dramatic silence — the grammar mirrors the content (absolute quiet)", "A list of actions", "A conditional"], "answer": 1, "explanation": "RHETORICAL GRAMMAR PATTERN: fronted negatives ('NOT A WORD WAS SPOKEN') create inversion and emphasis. The parallel structure ('Not a word... Not a sound') creates rhythmic repetition that enacts the very silence being described. Grammar becomes rhetoric — the form mirrors the meaning. A powerful literary technique."}, {"type": "mcq", "q": "What distinguishes NARRATIVE register from ACADEMIC register in terms of grammar?", "options": ["Narrative uses passive; academic uses active", "NARRATIVE uses: simple/past continuous, direct speech, vivid verbs, participials for simultaneous detail, sensory language. ACADEMIC uses: passives, nominalisations, hedging modals, formal connectors, impersonal constructions", "Both registers use identical grammar", "Narrative uses present perfect; academic uses simple past"], "answer": 1, "explanation": "REGISTER DIFFERENCES: NARRATIVE GRAMMAR = simple past, past continuous, direct speech, vivid participials, dramatic tense shifts. ACADEMIC GRAMMAR = passive voice, nominalisation, hedging ('suggests', 'may'), impersonal 'it is...', complex subordination. These grammatical choices are not random — they serve the genre's communicative purpose."}, {"type": "tf", "q": "'She opened the door slowly, her heart hammering' uses an absolute clause effectively to combine physical action and emotional state.", "answer": true, "explanation": "True. ABSOLUTE CLAUSE: 'HER HEART HAMMERING' = independent noun phrase + participial. Her heart has its own subject ('her heart') different from the main clause subject ('she'). This absolute clause adds SIMULTANEOUS EMOTIONAL DETAIL to the physical action ('opened the door slowly'). Classic narrative combination of external action and internal state."}, {"type": "mcq", "q": "Why is grammar study important for narrative writers?", "options": ["It teaches them to avoid all complex sentences", "Grammar mastery enables writers to control PACE (short sentences for tension, long for reflection), PERSPECTIVE (tense and aspect), VOICE (active/passive), and TEXTURE (participials, absolutes) — grammar IS the craft of narrative", "Grammar is irrelevant to creative writing", "Only vocabulary matters in narrative"], "answer": 1, "explanation": "GRAMMAR AS NARRATIVE CRAFT: (1) PACE: short sentences create tension; long complex sentences slow reflection; (2) TENSE: controls timeline and perspective; (3) VOICE: active for energy, passive for mystery; (4) PARTICIPIALS: add simultaneous detail; (5) DIALOGUE: creates character voice. Every grammatical choice shapes the reader's experience."}];
var SKEY="m11_l5",NEXT="q11-6.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
