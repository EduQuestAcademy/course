var Q=[{"type": "mcq", "q": "'She was so tired. She fell asleep.' Error: 'She was so tired that she felt asleep.' Identify the error:", "options": ["'So tired' is wrong", "'Fell asleep' should be 'felt asleep' — ERROR: 'fell asleep' is correct; 'felt asleep' does not exist", "The two sentences should not be combined", "'That' should be removed"], "answer": 1, "explanation": "ERROR: 'FELT ASLEEP' does not exist in English. The correct phrasal expression is 'FELL ASLEEP.' 'Feel + adjective' (feel tired, feel happy) is different from 'fall asleep' (a phrasal verb). A common mistake is confusing 'felt' and 'fell' in this expression."}, {"type": "mcq", "q": "'Despite she worked hard, she didn't succeed.' Identify the error:", "options": ["'Despite' is wrong here", "'She worked hard' should be 'working hard' — 'despite' is a preposition, not a conjunction", "'Didn't succeed' should be 'hasn't succeeded'", "No error"], "answer": 1, "explanation": "ERROR: 'DESPITE + CLAUSE' is wrong. 'Despite' is a PREPOSITION — it must be followed by a NOUN PHRASE or GERUND, not a full clause. Correct: 'Despite WORKING HARD, she didn't succeed' OR 'Although she worked hard, she didn't succeed.' 'Despite the fact that she worked hard' is also correct."}, {"type": "tf", "q": "'Hardly he had sat down when the phone rang' contains a word order error.", "answer": true, "explanation": "True. ERROR: 'HARDLY HE HAD sat down' — after 'hardly' at the beginning, SUBJECT-AUXILIARY INVERSION is required. Correct: 'Hardly HAD HE SAT DOWN when the phone rang.' Fronted negative adverbs (hardly, scarcely, rarely, never) always trigger subject-auxiliary inversion."}, {"type": "mcq", "q": "'He suggested me to apply for the position.' Identify the error:", "options": ["'Suggested' is wrong — use 'told'", "'Suggested me to apply' — 'suggest' cannot take person + to-infinitive. Correct: 'He suggested that I apply' or 'He suggested applying'", "'For the position' should be 'to the position'", "No error"], "answer": 1, "explanation": "ERROR: 'SUGGESTED ME TO APPLY' — 'suggest' NEVER takes person + to-infinitive. Correct: 'He SUGGESTED THAT I APPLY for the position' OR 'He SUGGESTED APPLYING for the position.' This is one of the most common errors in reported speech and sentence combination tasks."}, {"type": "fill", "q": "Correct the error: 'Not only she failed the exam but also she lost her notes.' Corrected: 'Not only ________ the exam but she also lost her notes.'", "answer": "did she fail", "hint": "Not only at start = subject-auxiliary inversion required...", "explanation": "'Not only DID SHE FAIL the exam but she also lost her notes.' ERROR: after fronted 'not only', INVERSION IS REQUIRED: did + she + base verb. 'Not only she failed' uses normal word order (wrong). 'Did she fail' = correct inverted form."}, {"type": "mcq", "q": "'She said me she was coming.' Identify the error:", "options": ["'Was coming' should be 'is coming'", "'Said me' — 'say' never takes a person object. Correct: 'She TOLD me' or 'She SAID (that) she was coming'", "'She' should be 'Her'", "No error"], "answer": 1, "explanation": "ERROR: 'SAID ME' — 'say' CANNOT take a personal object directly. Use 'TOLD ME': 'She told me she was coming.' Or use 'said' without a person: 'She said she was coming.' This say/tell confusion is the most common reported speech transformation error."}, {"type": "mcq", "q": "'He is the most talented person which I have ever met.' Identify the error:", "options": ["'Most talented' should be 'more talented'", "'Which' should be 'who' or 'that' — 'which' is not used for people", "'Have ever met' should be 'ever met'", "No error"], "answer": 1, "explanation": "ERROR: 'WHICH' FOR A PERSON — use 'WHO' or 'THAT': 'He is the most talented person WHO/THAT I have ever met.' 'Which' is used for things, not people. This who/which confusion in relative clauses is very common in transformation tasks."}, {"type": "tf", "q": "'Although she was tired but she continued' contains a double conjunction error.", "answer": true, "explanation": "True. DOUBLE CONJUNCTION ERROR: 'Although...but' — two adversative conjunctions for one contrast. Use ONE: 'Although she was tired, she continued' OR 'She was tired, but she continued.' 'Although...but' is a calque from many languages but incorrect in English."}, {"type": "mcq", "q": "'The book was written by a famous author has been translated into 20 languages.' Identify the error:", "options": ["'Was written' is wrong", "MISSING RELATIVE PRONOUN/CONJUNCTION: 'which/that' needed: 'The book that/which was written by a famous author has been translated' OR 'Written by a famous author, the book has been translated'", "'Has been translated' is wrong", "No error"], "answer": 1, "explanation": "ERROR: MISSING RELATIVE PRONOUN. 'The book WAS WRITTEN by a famous author HAS BEEN translated' — two main verbs without a connector. Fix: 'The book THAT/WHICH WAS WRITTEN by a famous author HAS BEEN translated' (relative clause) OR 'WRITTEN by a famous author, the book HAS BEEN translated' (participial)."}, {"type": "mcq", "q": "'She was too tired to not continue working.' Identify the error:", "options": ["'Too tired' is wrong", "'To not continue' — the double negative is wrong. 'Too tired to continue' already implies she stopped. Correct: 'She was too tired to continue working'", "'Working' should be removed", "No error"], "answer": 1, "explanation": "ERROR: 'TOO...TO NOT' creates a confusing double negative. 'Too tired to not continue' would mean she WAS able to continue (the double negative cancels). Correct: 'She was TOO TIRED TO CONTINUE working' (too tired = she stopped). 'Too + adjective + to-infinitive' already implies inability."}, {"type": "mcq", "q": "'Running to the bus, my phone dropped.' Identify the error:", "options": ["'Running' is wrong", "DANGLING PARTICIPLE — 'my phone' isn't running. Correct: 'Running to the bus, I dropped my phone'", "'To the bus' is wrong", "No error"], "answer": 1, "explanation": "DANGLING PARTICIPLE ERROR: 'Running to the bus' implies the subject of 'running' = main clause subject ('my phone'). Phones don't run! Correct: 'Running to the bus, I DROPPED my phone.' The participial clause subject must match the main clause subject."}, {"type": "fill", "q": "Correct: 'Not until she arrived we could begin.' Corrected: 'Not until she arrived ________ begin.'", "answer": "could we", "hint": "Inversion after 'not until'...", "explanation": "'Not until she arrived COULD WE begin.' After fronted 'NOT UNTIL', SUBJECT-AUXILIARY INVERSION is required: could + we. 'We could begin' (normal order) → 'COULD WE begin' (inverted). This inversion is obligatory with fronted negative adverbials."}, {"type": "tf", "q": "'Despite of the rain, we continued' contains an error — the correct form is 'despite the rain' (no 'of').", "answer": true, "explanation": "True. ERROR: 'DESPITE OF' — 'despite' NEVER takes 'of.' Correct: 'DESPITE THE RAIN, we continued.' 'In spite of the rain' (with 'of') is correct. 'Despite' and 'in spite of' both mean the same thing, but 'despite' uses no preposition; 'in spite' uses 'of.' Confusing them causes 'despite of' error."}, {"type": "mcq", "q": "'She has never been to Paris before now.' Transformation error: 'Never she has been to Paris before now.' Correct the word order:", "options": ["She never has been to Paris before now.", "Never has she been to Paris before now.", "She has never been to Paris before now. (original was already correct)", "Has never she been to Paris before now."], "answer": 1, "explanation": "'NEVER HAS SHE BEEN to Paris before now.' INVERSION: after fronted 'never', the auxiliary 'has' moves before the subject 'she.' The original ('She has never been') is correct standard order; the fronted version ('Never HAS SHE BEEN') requires inversion. Both are correct in different emphatic contexts."}, {"type": "mcq", "q": "'She admitted to steal the money.' Identify the error:", "options": ["'Admitted' is wrong", "'To steal' should be 'stealing' — 'admit' takes gerund, not to-infinitive", "'The money' should come first", "No error"], "answer": 1, "explanation": "ERROR: 'ADMITTED TO STEAL' — 'admit' takes GERUND: 'She admitted STEALING the money.' 'To steal' (to-infinitive) is wrong after 'admit.' 'Admit to doing' is also used informally: 'She admitted to stealing.' But 'admitted to steal' is always wrong. Common transformation error."}, {"type": "mcq", "q": "'Having finished the exam, the students were allowed to leave.' Is this correct?", "options": ["No — dangling participle", "Yes — 'having finished' correctly refers to 'the students' (the main clause subject)", "No — 'having finished' should be 'finished'", "No — passive is required"], "answer": 1, "explanation": "CORRECT: 'HAVING FINISHED the exam' correctly refers to 'THE STUDENTS' — the main clause subject. The students finished the exam, then were allowed to leave. Perfect participial clause with matching subject. No error."}, {"type": "mcq", "q": "'The teacher explained the students the rules.' Identify the error:", "options": ["'Explained' needs 'to': 'explained the rules TO the students'", "'The students' should come after 'rules'", "'The rules' should be omitted", "No error"], "answer": 0, "explanation": "ERROR: 'EXPLAINED THE STUDENTS' — 'explain' CANNOT take a person as indirect object without 'to.' Correct: 'The teacher explained the rules TO THE STUDENTS.' Unlike 'tell' and 'show' ('I told him / showed him'), 'explain' always uses 'to + person': 'explained to the students.'"}, {"type": "mcq", "q": "'She works hard in order to not fail.' Is this correct?", "options": ["Yes — to not fail is standard", "No — the infinitive negative should be 'in order not to fail' or 'so as not to fail'", "No — 'so that' must be used", "Yes but only in informal English"], "answer": 1, "explanation": "'IN ORDER NOT TO FAIL' is the correct form. 'NOT' precedes 'to' in negative to-infinitive purpose clauses: 'in order NOT TO fail', 'so as NOT TO make a mistake.' 'In order to not fail' (split infinitive with 'not') is sometimes used informally but 'in order not to' is the standard form."}, {"type": "tf", "q": "'No sooner had she spoken than she regretted it' is correctly formed with subject-auxiliary inversion.", "answer": true, "explanation": "True. 'NO SOONER HAD SHE SPOKEN THAN she regretted it.' CORRECT: 'No sooner' at the beginning triggers INVERSION: had + she + past participle (spoken). 'No sooner' uses 'than' (not 'when'). Compare: 'Hardly had she spoken WHEN...' Both structures require inversion; only the connecting word differs."}, {"type": "mcq", "q": "Which sentence is FREE OF transformation errors?", "options": ["Despite she was tired, she continued.", "Not until she arrived we could start.", "Having studied all night, the exam was passed by her.", "Although she was tired, she continued working."], "answer": 3, "explanation": "'ALTHOUGH SHE WAS TIRED, she continued working' = CORRECT. The others: 'Despite she was tired' (despite + clause = wrong); 'Not until she arrived WE could start' (missing inversion — should be 'could we start'); 'Having studied all night, THE EXAM was passed by her' (dangling participle — the exam didn't study!)."}];
var SKEY="m10_l7",NEXT="q10-8.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
