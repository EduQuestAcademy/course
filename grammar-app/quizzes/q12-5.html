var Q=[{"type": "mcq", "q": "In American English, the 'Oxford comma' (serial comma) is standard. What is the British convention?", "options": ["Always use the Oxford comma", "British English traditionally OMITS the Oxford comma — 'She bought apples, oranges and bananas' (no comma before 'and'). AmE: 'apples, oranges, and bananas' (Oxford comma before 'and'). However, Oxford University Press style uses the Oxford comma in BrE.", "Both always use Oxford comma", "Both always omit it"], "answer": 1, "explanation": "OXFORD COMMA: AmE standard = include comma before final 'and/or' in a list: 'red, white, AND blue.' Traditional BrE = omit it: 'red, white and blue.' Ironically, it's called the Oxford comma because Oxford University Press advocates it — but most British publishers don't use it. The comma can prevent ambiguity."}, {"type": "mcq", "q": "When writing dates, how does BrE differ from AmE?", "options": ["No difference", "BrE: DAY/MONTH/YEAR — '25 December 2025' or '25/12/2025'. AmE: MONTH/DAY/YEAR — 'December 25, 2025' or '12/25/2025'. This difference is critical: '01/02/2025' = 1 February (BrE) or January 2nd (AmE).", "BrE uses year/month/day", "AmE uses day/month/year"], "answer": 1, "explanation": "DATE FORMAT: BrE = DAY/MONTH/YEAR: '25 December 2025' / '25/12/2025'. AmE = MONTH/DAY/YEAR: 'December 25, 2025' / '12/25/2025.' This causes REAL CONFUSION: '04/05/2025' = 4 May (BrE) or April 5 (AmE). Always write the month in full or use ISO format (2025-04-05) in international communication to avoid ambiguity."}, {"type": "tf", "q": "British English places punctuation OUTSIDE quotation marks in most cases, while American English places it INSIDE.", "answer": true, "explanation": "True. PUNCTUATION + QUOTATION MARKS: AmE: INSIDE — 'She said, \"hello.\"' (period inside quotes). BrE: OUTSIDE (for non-quoted punctuation) — 'She said \"hello\".'' (period outside, unless the punctuation is part of the quotation). This is a consistent and important difference in formal writing conventions."}, {"type": "mcq", "q": "BrE uses 'single quotation marks' as the primary style, while AmE uses:", "options": ["Single quotation marks — the same", "DOUBLE QUOTATION MARKS as primary style. BrE: 'He said \"she is coming.\"' (single outside, double for nested quotes). AmE: \"He said 'she is coming.'\" (double outside, single for nested quotes). The hierarchy is REVERSED.", "Both use double marks", "Neither uses quotation marks"], "answer": 1, "explanation": "QUOTATION MARKS CONVENTION: BrE PRIMARY = 'single quotation marks.' AmE PRIMARY = \"double quotation marks.\" BrE nested quote: 'She said \"I agree.\"' AmE nested quote: \"She said 'I agree.'\" The styles are mirror images of each other. This affects academic papers, journalism, and formal writing."}, {"type": "fill", "q": "In American English, the period in 'Dr.' and 'Mr.' is kept. In British English, these abbreviations are written as ________ (without period).", "answer": "Dr / Mr", "hint": "BrE omits the full stop after abbreviations that end in the same letter as the full word...", "explanation": "BrE: 'Dr Smith' / 'Mr Jones' (NO full stop/period after abbreviations that end in the same letter as the full word). AmE: 'Dr. Smith' / 'Mr. Jones' (WITH period). BrE rule: abbreviations that end with the final letter of the full word don't need a period (Dr, Mr, Mrs, St). Contractions like 'Prof.' (not ending in f) do take a period in BrE."}, {"type": "mcq", "q": "How does BrE punctuate the time '3:30 PM' differently from AmE?", "options": ["No difference", "BrE typically writes '3.30 pm' (full stop/period as separator; lowercase pm). AmE writes '3:30 PM' (colon as separator; capitals or lowercase). BrE also uses 24-hour clock more commonly in formal/official contexts.", "BrE always uses 24-hour clock", "AmE uses dots"], "answer": 1, "explanation": "TIME FORMAT: BrE = '3.30 pm' (FULL STOP/PERIOD separator; lowercase 'pm'). AmE = '3:30 PM' (COLON separator; AM/PM often capitalised). This punctuation difference appears on schedules, timetables, and formal documents. BrE also more routinely uses 24-hour format (15:30) in official/transport contexts."}, {"type": "mcq", "q": "'The 1960s' vs 'the 1960's' — which style is now preferred for decades?", "options": ["'The 1960's' with apostrophe in both varieties", "'THE 1960s' WITHOUT apostrophe is now standard in BOTH BrE and AmE — the apostrophe ('1960's') incorrectly suggests possession. The plural of a decade does not need an apostrophe.", "AmE uses apostrophe; BrE does not", "BrE uses apostrophe; AmE does not"], "answer": 1, "explanation": "DECADE APOSTROPHE: Both BrE and AmE now prefer '1960S' (no apostrophe). '1960'S' (with apostrophe) is increasingly considered incorrect because decades are plurals, not possessives. This is one area where BrE and AmE AGREE on the standard. The apostrophe-for-plural error ('apple's', 'the 1990's') is criticised in both varieties."}, {"type": "tf", "q": "British English uses the term 'full stop' for the punctuation mark that Americans call a 'period'.", "answer": true, "explanation": "True. PUNCTUATION TERMINOLOGY: BrE 'FULL STOP' = AmE 'PERIOD' (the dot at the end of a sentence). Other terminology differences: BrE 'INVERTED COMMAS' / AmE 'QUOTATION MARKS'; BrE 'BRACKETS' (round) / AmE 'PARENTHESES'; BrE 'SQUARE BRACKETS' / AmE 'BRACKETS'; BrE 'OBLIQUE/SLASH' / AmE 'FORWARD SLASH'."}, {"type": "mcq", "q": "In formal British writing, how are numbers typically written?", "options": ["Always as numerals", "BrE convention: write numbers ONE TO NINE (or sometimes ONE TO TEN) as WORDS; 10 (or 11) and above as numerals — 'there were five participants' but '15 participants.' AmE often writes out one to nine similarly, but conventions vary by style guide.", "Always as words", "Only use Roman numerals"], "answer": 1, "explanation": "NUMBER WRITING CONVENTIONS: Both BrE and AmE follow similar rules — small numbers as words, larger as numerals — but the exact cut-off varies by style guide. BrE (e.g., Oxford style): one to nine as words; 10 onwards as numerals. AmE (AP style): one to nine as words; 10+ as numerals. Chicago style uses one to one hundred. Always follow the relevant style guide."}, {"type": "mcq", "q": "'She earns £45,000 per year.' vs 'She earns $45,000 per year.' — Beyond currency symbols, how do BrE and AmE write large numbers?", "options": ["Differently — BrE uses spaces", "The SAME — both use COMMAS to separate thousands: 1,000; 45,000; 1,000,000. Continental European convention uses periods (1.000) or spaces (1 000), but BrE and AmE both use commas for thousands.", "BrE uses periods", "AmE uses spaces"], "answer": 1, "explanation": "THOUSAND SEPARATORS: BrE and AmE BOTH use COMMAS for thousands: '1,000'; '1,000,000.' Continental European convention (periods or spaces) differs from both. This is an area of BrE/AmE AGREEMENT, in contrast to many other formatting differences. However, the decimal separator is different: BrE sometimes uses a middle dot; both mainly use a period/full stop."}, {"type": "mcq", "q": "In British English, a 'billion' traditionally meant one million million (1,000,000,000,000). What does it mean in American English?", "options": ["The same — a billion is always 1,000,000,000", "AmE 'BILLION' = 1,000,000,000 (one thousand million). BrE traditionally used 'billion' for 1,000,000,000,000 (one million million), but now BOTH BrE and AmE use the American 'short scale' (billion = 1,000,000,000) in most contexts.", "BrE billion = AmE trillion", "AmE uses milliard"], "answer": 1, "explanation": "'BILLION' CONVERGENCE: The AmE/short scale 'billion' (10^9) is now standard in BOTH BrE and AmE for most purposes. The old British 'long scale' (billion = 10^12) is virtually obsolete in everyday BrE. However, European countries still often use the long scale, so international financial documents may specify."}, {"type": "fill", "q": "In British English, '10 Downing Street' — the street name ________ capitalised in both BrE and AmE, but the formatting of addresses differs.", "answer": "is", "hint": "Proper nouns are capitalised in all English varieties...", "explanation": "Proper nouns (street names, place names) ARE capitalised in BOTH varieties. Address formatting differs: BrE typically writes addresses with house number first, then street name, town on the next line, county, postcode. AmE: number, street name, city, state abbreviation, ZIP code on one or two lines. The postal format reflects different postal systems."}, {"type": "tf", "q": "American English uses a colon after the salutation in formal letters ('Dear Sir:'), while British English uses a comma ('Dear Sir,') or no punctuation.", "answer": true, "explanation": "True. LETTER SALUTATION PUNCTUATION: AmE formal: 'Dear Sir:' or 'Dear Ms Smith:' (COLON). BrE formal: 'Dear Sir,' or 'Dear Ms Smith,' (COMMA) or increasingly no punctuation. Email conventions are more informal in both varieties. The colon after salutation is distinctly American; the comma or no punctuation is characteristically British."}, {"type": "mcq", "q": "'Autumn term timetable — classes run Monday–Friday, 9:00–17:00' — which BrE formatting features are present?", "options": ["No BrE features", "'AUTUMN' (not 'fall') + 24-HOUR TIME FORMAT (9:00–17:00 rather than 9:00 AM–5:00 PM) + EN DASH (–) for ranges — these are all characteristically BrE/formal British formatting features", "AmE features only", "Neither variety's features"], "answer": 1, "explanation": "BrE FORMATTING: (1) 'AUTUMN' (vocabulary); (2) 24-HOUR FORMAT (9:00–17:00 = standard BrE official/timetable format); (3) EN DASH (–) for time/number ranges is formal BrE (AmE also uses en dash, but BrE uses it consistently for ranges). Multiple BrE conventions in one timetable entry."}, {"type": "mcq", "q": "Which of these is a formatting difference (not grammar or vocabulary) between BrE and AmE?", "options": ["'Colour' vs 'color'", "'Lift' vs 'elevator'", "DATE FORMAT: '25 December 2025' (BrE day/month/year) vs 'December 25, 2025' (AmE month/day/year)", "'Autumn' vs 'fall'"], "answer": 2, "explanation": "DATE FORMAT is a FORMATTING difference (how information is arranged on the page). 'Colour/color' = spelling; 'lift/elevator' = vocabulary; 'autumn/fall' = vocabulary. Date formatting is a practical, real-world consequence of BrE/AmE differences that affects everything from contracts to birthday party invitations."}, {"type": "mcq", "q": "Why is awareness of BrE/AmE punctuation and formatting differences important in professional and academic contexts?", "options": ["It isn't important — punctuation is the same everywhere", "Different contexts REQUIRE different conventions: an IELTS essay should follow BrE conventions; a submission to an American academic journal should follow AmE style; international legal documents must be explicit about date formats. Mixing conventions signals lack of attention to detail.", "Only matters for native speakers", "Only matters for creative writing"], "answer": 1, "explanation": "PROFESSIONAL IMPORTANCE: (1) ACADEMIC JOURNALS specify style guides (Chicago/MLA = AmE; Oxford/Cambridge = BrE); (2) LEGAL DOCUMENTS must clarify date formats to avoid ambiguity; (3) BUSINESS COMMUNICATIONS should match the recipient's variety; (4) EXAMINATIONS expect the appropriate variety's conventions. Formatting awareness is professional competence."}];
var SKEY="m12_l5",NEXT="q12-6.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
