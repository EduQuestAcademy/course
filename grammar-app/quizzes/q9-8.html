var Q=[{"type": "mcq", "q": "'I wish I could fly.' What does WISH + COULD express?", "options": ["A real ability", "A PRESENT WISH for something impossible or unavailable — a desire about present/future", "A past regret", "A future plan"], "answer": 1, "explanation": "'I WISH I COULD FLY' = PRESENT WISH about something IMPOSSIBLE/UNAVAILABLE. 'Could' = past modal expressing hypothetical ability. WISH + PAST MODAL: expresses a desire that is not currently possible. The situation is unreal (I can't fly)."}, {"type": "mcq", "q": "'I wish I had studied harder.' What does WISH + PAST PERFECT express?", "options": ["A present desire", "A REGRET ABOUT THE PAST — the studying didn't happen", "A future plan", "A universal truth"], "answer": 1, "explanation": "'I WISH I HAD STUDIED harder' = PAST REGRET. 'Had studied' = past perfect for UNREAL PAST. WISH + PAST PERFECT = regret about something that happened (or didn't happen) in the past. The studying was insufficient — the speaker wishes it had been different."}, {"type": "tf", "q": "'I wish it would stop raining' uses WOULD to express a desire for a future change or an annoying situation.", "answer": true, "explanation": "True. WISH + WOULD + BASE VERB = desire for a FUTURE CHANGE or complaint about an ONGOING ANNOYING SITUATION. 'I wish it WOULD stop raining' = I want the rain to stop (in the future / soon). Also: 'I wish you would be quiet!' (complaint about repeated/ongoing behaviour)."}, {"type": "mcq", "q": "'If only I were taller!' IF ONLY is:", "options": ["Weaker than 'wish'", "Stronger/more emotional than 'wish' — expresses intense desire or regret", "Exactly the same as 'if'", "A future conditional"], "answer": 1, "explanation": "IF ONLY = MORE EMPHATIC than 'wish.' 'IF ONLY I WERE taller!' = intense desire (I really want to be taller). 'I wish I were taller' is the milder equivalent. If only is used for strong emotions: deep regret, frustration, longing. Same grammar as 'wish': if only + past simple/perfect/would."}, {"type": "fill", "q": "'I wish she ________ (stop) interrupting me!' Express a wish for change about a present annoying habit.", "answer": "would stop", "hint": "Wish + would + base verb for annoying present habit...", "explanation": "'I wish she WOULD STOP interrupting me!' WISH + WOULD + BASE VERB for an ANNOYING PRESENT HABIT you want to change. 'Would' signals the desired change. Compare: 'I wish she stopped' (less natural); 'I wish she would stop' is the correct form for this use."}, {"type": "mcq", "q": "'She talks as if she knew everything.' AS IF + PAST SIMPLE expresses:", "options": ["A real way of talking", "She actually knows everything", "An UNREAL MANNER — she talks in a way that implies she knows everything (but she doesn't)", "A past habit"], "answer": 2, "explanation": "'AS IF SHE KNEW everything' = UNREAL MANNER (second conditional meaning). 'As if' + past simple = comparing behaviour to an unreal situation. She DOESN'T know everything, but talks AS IF she does. The past simple signals unreality/hypothetical comparison."}, {"type": "mcq", "q": "'I would rather she came tomorrow.' WOULD RATHER + PAST TENSE expresses:", "options": ["A past habit", "A PREFERENCE about someone else's action (when the subject of 'prefer' ≠ subject of 'rather' clause)", "A future certainty", "A zero conditional truth"], "answer": 1, "explanation": "WOULD RATHER + SUBJECT + PAST TENSE = PREFERENCE about SOMEONE ELSE'S ACTION. 'I would rather she CAME tomorrow' = I prefer that she come tomorrow (not today). The past tense after 'would rather' signals a preference/wish, not past time."}, {"type": "tf", "q": "'I would rather stay home than go to the party' uses WOULD RATHER + BASE VERB for a personal preference.", "answer": true, "explanation": "True. WOULD RATHER + BASE VERB (when same subject): 'I would rather STAY home' = I prefer to stay home. 'Would rather + base verb + than + base verb' = preference comparison: 'I'd rather STAY than GO.' No tense shift needed when it's about the speaker's own preference."}, {"type": "mcq", "q": "'If only I hadn't said that.' IF ONLY + PAST PERFECT expresses:", "options": ["A present wish", "A future plan", "INTENSE REGRET about something that happened in the past", "A universal truth"], "answer": 2, "explanation": "'IF ONLY I HADN'T SAID THAT' = INTENSE PAST REGRET. Past perfect after 'if only' = regret about a past event. 'I said it — and I deeply wish I hadn't.' Stronger emotional intensity than 'I wish I hadn't said that.' Common expression of deep remorse."}, {"type": "mcq", "q": "'He behaved as though he owned the place.' AS THOUGH is:", "options": ["Different in meaning from 'as if'", "Interchangeable with AS IF — both introduce unreal comparisons", "Only used for past situations", "Only used in formal writing"], "answer": 1, "explanation": "AS THOUGH = AS IF. Both introduce UNREAL COMPARISONS: 'He behaved AS IF/AS THOUGH he owned the place' (he doesn't). Both can use past simple (unreal present) or past perfect (unreal past). Completely interchangeable in modern English."}, {"type": "mcq", "q": "'I wish it were Friday already.' WERE signals:", "options": ["Past tense of 'be'", "SUBJUNCTIVE/hypothetical — expressing a wish about present time (it isn't Friday yet)", "Future prediction", "Perfect aspect"], "answer": 1, "explanation": "'I WISH IT WERE FRIDAY' = SUBJUNCTIVE/HYPOTHETICAL. 'Were' = past subjunctive for ALL persons in wish sentences. The wish is about the PRESENT (it isn't Friday yet — I wish it was). 'Was' is also used informally, but 'were' is the formal standard."}, {"type": "fill", "q": "'If only they ________ (arrive) on time, none of this would have happened.' Past regret.", "answer": "had arrived", "hint": "If only + past perfect = past regret...", "explanation": "'If only they HAD ARRIVED on time, none of this would have happened.' IF ONLY + PAST PERFECT = intense past regret. They didn't arrive on time — this caused the current problem. The speaker deeply wishes the past had been different."}, {"type": "tf", "q": "'I'd rather you didn't smoke in here' uses past simple after 'would rather' to express a preference about another person's present action.", "answer": true, "explanation": "True. 'I'D RATHER YOU DIDN'T smoke' = preference about another person's present action. PAST SIMPLE after 'would rather + subject' expresses a wish/preference about someone else. 'Didn't smoke' = I prefer that you don't smoke (past simple signals preference, not past time)."}, {"type": "mcq", "q": "'She looks as if she has seen a ghost.' AS IF + PRESENT PERFECT expresses:", "options": ["A past regret", "The manner of looking — as if a ghost-sighting is the explanation for her current appearance", "An unreal present state", "A future prediction"], "answer": 1, "explanation": "'AS IF SHE HAS SEEN a ghost' = PRESENT PERFECT in 'as if' clause for RECENT PAST EXPLANATION. Her current appearance is being described as if a recent frightening event (ghost) explains it. Note: present perfect here (not past simple) suggests the experience has just happened."}, {"type": "mcq", "q": "'Would rather' vs 'would prefer to' — what is the grammatical difference?", "options": ["No difference", "WOULD RATHER + bare infinitive; WOULD PREFER + TO-INFINITIVE", "Would rather is more formal", "Would prefer is British only"], "answer": 1, "explanation": "GRAMMATICAL DISTINCTION: 'I would RATHER GO' (bare infinitive) vs 'I would PREFER TO GO' (to-infinitive). 'Would rather + base verb' vs 'would prefer + to + base verb.' For another person: 'I'd rather you CAME' (past tense) vs 'I'd prefer you TO COME' (to-infinitive)."}, {"type": "mcq", "q": "'If only I had more time!' This expresses a wish about:", "options": ["The past", "The PRESENT — the speaker wants more time right now (but doesn't have it)", "The future only", "A scientific fact"], "answer": 1, "explanation": "'IF ONLY I HAD MORE TIME' = PRESENT WISH using PAST SIMPLE. The past simple here signals UNREALITY about the PRESENT: I don't have enough time NOW. This is the same pattern as second conditional: past simple = hypothetical present. 'Had more time' = present wish, not past reference."}, {"type": "mcq", "q": "'He talks as if he had met the President personally.' AS IF + PAST PERFECT expresses:", "options": ["He has met the President", "An UNREAL PAST COMPARISON — he talks as if this past event (meeting the President) had occurred, but it didn't", "A future plan", "A present state"], "answer": 1, "explanation": "'AS IF HE HAD MET the President' = UNREAL PAST COMPARISON (third conditional meaning). He HASN'T met the President, but talks as if this past event occurred. Past perfect in 'as if' clause = unreal past: the implied event didn't actually happen."}, {"type": "mcq", "q": "Which sentence expresses a REGRET about a past event?", "options": ["I wish I were taller.", "I wish he would be quieter.", "If only I had told her the truth.", "I would rather stay home."], "answer": 2, "explanation": "'IF ONLY I HAD TOLD HER THE TRUTH' = PAST REGRET (if only + past perfect). I didn't tell her — I deeply regret it. The others: present wish (were taller), annoying habit (would be quieter), present preference (would rather stay)."}];
var SKEY="m9_l8",NEXT="q9-9.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
