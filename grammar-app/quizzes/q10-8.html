var Q=[{"type": "mcq", "q": "'The committee approved the proposal unanimously.' Passive:", "options": ["The proposal is approved by the committee unanimously.", "The proposal was approved unanimously by the committee.", "The proposal has been approved by the committee.", "The proposal approved unanimously by the committee."], "answer": 1, "explanation": "'The proposal WAS APPROVED unanimously by the committee.' Simple past passive: was + past participle. Object ('the proposal') becomes subject; original subject becomes 'by + agent.' 'Unanimously' stays as an adverb modifying the passive verb."}, {"type": "mcq", "q": "'\"I'll be there at 8,\" she promised.' Reported:", "options": ["She promised she will be there at 8.", "She promised she would be there at 8.", "She promised she would be there at 8 that evening/night.", "Both B and C are correct depending on time context."], "answer": 3, "explanation": "BOTH B AND C are correct: 'She promised she WOULD BE THERE at 8' (basic backshift). If time context matters: 'at 8 that evening/night' (time expression change). B is acceptable if '8' is self-understood from context; C is more precise if reporting from a different day."}, {"type": "tf", "q": "'Not until she arrived did the meeting begin' uses subject-auxiliary inversion correctly after 'not until.'", "answer": true, "explanation": "True. 'NOT UNTIL SHE ARRIVED DID THE MEETING BEGIN.' Correct: 'not until' fronted → INVERSION required: did + the meeting + begin. Standard word order would be: 'The meeting did not begin until she arrived.' Fronted negative adverbials always require subject-auxiliary inversion."}, {"type": "mcq", "q": "'Despite working hard, she didn't get the promotion.' Expand to full clause:", "options": ["Despite she worked hard, she didn't get the promotion.", "Although she worked hard, she didn't get the promotion.", "Because she worked hard, she didn't get the promotion.", "As she worked hard, she didn't get the promotion."], "answer": 1, "explanation": "'ALTHOUGH SHE WORKED HARD, she didn't get the promotion.' DESPITE + gerund → ALTHOUGH + full clause. 'Despite working hard' = 'Although she worked hard.' 'Despite' (preposition) → 'although' (conjunction). The gerund phrase expands to a full subordinate clause."}, {"type": "mcq", "q": "'She suggested that they should try a different approach.' Condense to gerund:", "options": ["She suggested trying a different approach.", "She suggested to try a different approach.", "She suggested them to try a different approach.", "She suggested that trying a different approach."], "answer": 0, "explanation": "'She suggested TRYING a different approach.' THAT-CLAUSE → GERUND CONDENSATION: 'suggested that they should try' → 'suggested trying.' 'Suggest + gerund' is the condensed form. 'Suggested to try' and 'suggested them to try' are both wrong — suggest never takes to-infinitive."}, {"type": "fill", "q": "'It was such a difficult exam that many students failed.' Rewrite with 'so': 'The exam was ________ many students failed.'", "answer": "so difficult that", "hint": "Such a + adjective + noun = so + adjective + that...", "explanation": "'The exam was SO DIFFICULT THAT many students failed.' SUCH A + adjective + noun → SO + adjective + THAT. 'Such a difficult exam' → 'so difficult.' The noun ('exam') becomes the subject; 'so + adjective + that' replaces 'such a + adjective + noun.'"}, {"type": "mcq", "q": "'Running into the office, the coffee was spilled on the floor.' Identify the error:", "options": ["No error", "DANGLING PARTICIPLE — 'the coffee' wasn't running; should be 'Running into the office, she spilled the coffee'", "'Running' should be 'having run'", "'Was spilled' should be active"], "answer": 1, "explanation": "DANGLING PARTICIPLE: 'RUNNING INTO THE OFFICE' implies the subject of running = main clause subject ('the coffee'). Coffee doesn't run into offices! Correct: 'Running into the office, SHE SPILLED the coffee on the floor.' Subject of participial must match main clause subject."}, {"type": "mcq", "q": "'He is too young to vote.' Paraphrase using 'not...enough':", "options": ["He is not young enough to vote.", "He is not old enough to vote.", "He is not enough old to vote.", "He does not vote young enough."], "answer": 1, "explanation": "'He is NOT OLD ENOUGH to vote.' TOO + adjective → NOT + OPPOSITE ADJECTIVE + ENOUGH. 'Too young' = insufficient age → 'not old enough.' The adjective changes to its opposite in the 'not enough' transformation. 'Not young enough' would mean he is too old (the opposite meaning)."}, {"type": "mcq", "q": "'Hardly had he sat down when the doorbell rang.' Standard word order:", "options": ["He hardly had sat down when the doorbell rang.", "He had hardly sat down when the doorbell rang.", "Hardly he had sat down when the doorbell rang.", "He sat down hardly when the doorbell rang."], "answer": 1, "explanation": "'He HAD HARDLY SAT DOWN when the doorbell rang.' INVERTED → STANDARD: 'Hardly had he sat down' → 'He had hardly sat down.' The adverb 'hardly' moves between had and the past participle. Auxiliary 'had' returns to its normal position after the subject."}, {"type": "mcq", "q": "'She told me she had been waiting for over an hour.' Convert to direct speech:", "options": ["'I was waiting for over an hour,' she told me.", "'I have been waiting for over an hour,' she told me.", "'I had been waiting for over an hour,' she told me.", "'I am waiting for over an hour,' she told me."], "answer": 1, "explanation": "'\"I HAVE BEEN WAITING for over an hour,\" she told me.' REPORTED → DIRECT: reverse backshift: 'had been waiting' (past perfect continuous) → 'have been waiting' (present perfect continuous). Pronouns: 'she' → 'I'. The present perfect continuous is the original direct speech form."}, {"type": "mcq", "q": "'Despite the difficulty, she completed the task.' Expand the prepositional phrase:", "options": ["Despite she had difficulty, she completed the task.", "Although the task was difficult, she completed it.", "In spite that it was difficult, she completed the task.", "The task was difficult. She completed it."], "answer": 1, "explanation": "'ALTHOUGH THE TASK WAS DIFFICULT, she completed it.' DESPITE + noun → ALTHOUGH + full clause. 'Despite the difficulty' expands to 'although the task was difficult.' The noun phrase 'the difficulty' becomes a full subordinate clause with subject, verb, and complement."}, {"type": "tf", "q": "'She was advised to rest by the doctor' correctly passivises 'The doctor advised her to rest.'", "answer": true, "explanation": "True. ACTIVE → PASSIVE: 'The doctor advised HER to rest' → 'SHE was advised to rest by the doctor.' The indirect object ('her') becomes the passive subject ('she'). 'Advised to rest' — the to-infinitive is preserved in the passive transformation."}, {"type": "mcq", "q": "'Not only did she pass the exam, but she also received the highest mark.' What does 'not only...but also' add?", "options": ["A concession", "A negative meaning", "EMPHASIS on the double achievement — first good result + even better result", "A conditional meaning"], "answer": 2, "explanation": "NOT ONLY...BUT ALSO = EMPHATIC ADDITION: highlights two positive achievements, with the second being even more impressive. 'Not only did she PASS, but she ALSO received the HIGHEST MARK.' The structure escalates from a basic expectation to an exceptional result."}, {"type": "mcq", "q": "'Provided that all documents are in order, the visa will be issued.' Condense the condition:", "options": ["If all documents are in order, the visa will be issued.", "With all documents in order, the visa will be issued.", "Both are correct condensations of the condition.", "Neither is correct."], "answer": 2, "explanation": "BOTH CORRECT: (A) 'IF all documents are in order' (simple conditional = concise); (B) 'WITH ALL DOCUMENTS IN ORDER' (prepositional absolute phrase = very condensed, formal). Both condense the full 'provided that' clause. 'With + noun + adjective/participle' is a particularly elegant condensation."}, {"type": "mcq", "q": "'He was so nervous that he couldn't speak.' Rewrite beginning 'Such was...':", "options": ["Such was his nervousness that he couldn't speak.", "Such nervous was he that he couldn't speak.", "Such he was nervous that he couldn't speak.", "Such nervousness that he couldn't speak."], "answer": 0, "explanation": "'SUCH WAS HIS NERVOUSNESS that he couldn't speak.' SO + adjective → SUCH WAS + noun phrase. 'So nervous' → 'such was his nervousness.' The adjective ('nervous') becomes a noun ('nervousness'); 'was' inverts for the 'such was...' construction."}, {"type": "mcq", "q": "'The window was broken. A stone was thrown.' Combine to show cause:", "options": ["The window was broken because a stone was thrown through it.", "A stone was thrown and the window was broken.", "A stone broke the window.", "The window broke a stone."], "answer": 0, "explanation": "'The window was broken BECAUSE A STONE WAS THROWN through it.' CAUSE COMBINING in passive: both sentences are passive; 'because' clause introduces the cause. Adding 'through it' clarifies the causal mechanism. Both active ('because someone threw a stone') and passive versions are correct."}, {"type": "mcq", "q": "Which transformation is CORRECT?", "options": ["Despite she worked hard, she failed.", "Not until she arrived we could start.", "Having considered all options, the decision was made by the committee.", "Although it was cold, she wore a light coat."], "answer": 3, "explanation": "'ALTHOUGH IT WAS COLD, she wore a light coat' = CORRECT. The others: 'Despite she worked hard' (despite + clause = wrong); 'Not until she arrived WE could start' (missing inversion); 'Having considered...the decision was made BY THE COMMITTEE' (dangling participle — the committee should be the subject). Only option D is error-free."}];
var SKEY="m10_assessment",NEXT="../index.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Back to Dashboard</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
