var Q=[{"type": "mcq", "q": "'The results, which had been eagerly anticipated, were finally announced.' How many grammatical systems interact in this sentence?", "options": ["One — just tenses", "Two — tenses and relative clauses", "Three — tenses, relative clauses, and passive voice", "Four — tenses, relative clauses, passive voice, and adverbs"], "answer": 3, "explanation": "FOUR SYSTEMS INTERACT: (1) TENSES: 'had been' (past perfect) + 'were announced' (past simple); (2) RELATIVE CLAUSE: 'which had been eagerly anticipated' (non-defining); (3) PASSIVE VOICE: 'had been anticipated' + 'were announced'; (4) ADVERB: 'eagerly' (modifying the participle). Real sentences routinely combine multiple grammatical systems."}, {"type": "mcq", "q": "'If she had studied harder, she would have passed — a fact which everyone knew.' Which systems combine here?", "options": ["Third conditional only", "Third conditional + non-defining relative clause + reported thought", "Only modal verbs", "Only relative clauses"], "answer": 1, "explanation": "THREE SYSTEMS: (1) THIRD CONDITIONAL: 'if she had studied, she would have passed'; (2) NON-DEFINING RELATIVE CLAUSE: 'which everyone knew' (referring to the whole preceding clause — a fact that everyone knew); (3) REPORTED THOUGHT: 'a fact which everyone knew' implies general awareness. Complex sentences naturally layer systems."}, {"type": "tf", "q": "Understanding how grammatical systems interact helps writers produce more sophisticated and precise sentences.", "answer": true, "explanation": "True. INTEGRATED GRAMMAR KNOWLEDGE enables writers to: (1) COMBINE tenses with conditionals, passive, and modals; (2) EMBED clauses within clauses; (3) USE relative clauses with passive reporting verbs; (4) CONTROL register by choosing appropriate combinations. Isolated grammar knowledge is insufficient for fluent, sophisticated writing."}, {"type": "mcq", "q": "'She was told that the project, which had been delayed twice, would finally be completed by June.' Identify all passive constructions:", "options": ["Only 'was told'", "'Was told' and 'had been delayed'", "'Was told', 'had been delayed', and 'be completed'", "Only 'had been delayed'"], "answer": 2, "explanation": "THREE PASSIVES: (1) 'WAS TOLD' (past simple passive — she received the information); (2) 'HAD BEEN DELAYED' (past perfect passive — within the relative clause); (3) 'WOULD FINALLY BE COMPLETED' (future passive with modal). Passive voice interacts with tense, modals, and subordinate clauses simultaneously."}, {"type": "fill", "q": "'It is believed that scientists ________ (make) a breakthrough by the end of the decade.' Complete combining passive reporting + future perfect.", "answer": "will have made", "hint": "Passive reporting + future perfect in the noun clause...", "explanation": "'It is believed that scientists WILL HAVE MADE a breakthrough by the end of the decade.' PASSIVE REPORTING ('it is believed') + FUTURE PERFECT ('will have made') + TIME CLAUSE ('by the end of the decade'). Three systems: impersonal passive, future perfect, and time expression."}, {"type": "mcq", "q": "'Having been trained extensively, she was able to handle situations that would have overwhelmed less experienced colleagues.' How many grammatical systems are present?", "options": ["Two", "Three", "Four", "Five"], "answer": 3, "explanation": "FOUR SYSTEMS: (1) PERFECT PASSIVE PARTICIPIAL CLAUSE: 'Having been trained extensively'; (2) MODAL: 'was able to' (= could); (3) RELATIVE CLAUSE: 'that would have overwhelmed'; (4) SECOND/THIRD CONDITIONAL ELEMENT: 'would have overwhelmed less experienced colleagues.' Sophisticated sentences routinely use four or more systems."}, {"type": "mcq", "q": "Why does passive voice often co-occur with present perfect in academic writing?", "options": ["By accident", "Both serve similar functions: passive removes the agent; present perfect connects past to present relevance — together they describe completed research objectively", "They cannot co-occur", "Present perfect is never used in academic writing"], "answer": 1, "explanation": "PASSIVE + PRESENT PERFECT SYNERGY in academic writing: 'It HAS BEEN DEMONSTRATED THAT...' The passive removes personal agency ('I/we'); the present perfect connects the finding to current knowledge. Together: 'Several studies HAVE BEEN CONDUCTED...' creates the objective, cumulative tone of academic discourse."}, {"type": "tf", "q": "Reported speech interacts with tense backshift, modal changes, and pronoun shifts simultaneously.", "answer": true, "explanation": "True. REPORTED SPEECH COMBINES: (1) TENSE BACKSHIFT: present → past; (2) MODAL CHANGES: will → would, can → could; (3) PRONOUN SHIFTS: I → she/he; (4) TIME EXPRESSION CHANGES: today → that day. These four systems operate simultaneously in every reported speech transformation. No one system works in isolation."}, {"type": "mcq", "q": "'The report, which should have been submitted last week, is said to contain significant errors.' Which systems interact?", "options": ["Only modal perfect", "Non-defining relative clause + modal perfect + passive reporting", "Only passive", "Reported speech only"], "answer": 1, "explanation": "THREE SYSTEMS: (1) NON-DEFINING RELATIVE CLAUSE: 'which should have been submitted last week'; (2) MODAL PERFECT PASSIVE: 'should have been submitted' (obligation in past + passive); (3) PASSIVE REPORTING: 'is said to contain.' These three systems interact seamlessly in a single sentence."}, {"type": "mcq", "q": "'Unless they had acted immediately, the situation would have become critical.' What is the relationship between tense and conditional here?", "options": ["It is a first conditional with past tense", "It is a third conditional using UNLESS instead of IF — past perfect in unless-clause + would have in result", "It is a zero conditional", "It is a second conditional"], "answer": 1, "explanation": "THIRD CONDITIONAL + UNLESS: 'UNLESS they HAD ACTED' = 'If they HAD NOT ACTED immediately.' 'WOULD HAVE BECOME critical' = past unreal result. 'Unless' (= if not) interacts with the third conditional structure perfectly. The two systems combine naturally."}, {"type": "mcq", "q": "'It is widely believed that languages are best learned by those who have been immersed in them from an early age.' Count the grammatical systems:", "options": ["Two", "Three", "Four", "Five"], "answer": 3, "explanation": "FOUR+ SYSTEMS: (1) PASSIVE REPORTING: 'It is widely believed'; (2) PASSIVE: 'are best learned'; (3) RELATIVE CLAUSE: 'who have been immersed'; (4) PASSIVE + PRESENT PERFECT: 'have been immersed'; (5) ADVERB: 'widely' + 'best'. A single academic sentence can weave together five or more grammatical systems."}, {"type": "mcq", "q": "How do modal verbs interact with the passive voice?", "options": ["They cannot combine", "Modal + be + past participle creates modal passives: 'must be done', 'should be considered', 'might have been avoided'", "Modals replace 'be' in passive", "Only 'will' combines with passive"], "answer": 1, "explanation": "MODAL + PASSIVE = MODAL PASSIVE: modal + BE + past participle. 'This MUST BE DONE.' 'It SHOULD BE CONSIDERED.' 'The mistake MIGHT HAVE BEEN AVOIDED' (modal perfect passive). Modals combine with both simple passive and perfect passive. This interaction is fundamental to formal and academic English."}, {"type": "fill", "q": "'The plan that ________ (discuss) in the meeting ________ (now implement) across all departments.' Complete with passive systems interacting.", "answer": "was discussed / is now being implemented", "hint": "Past passive in relative clause + present continuous passive in main clause...", "explanation": "'The plan that WAS DISCUSSED in the meeting IS NOW BEING IMPLEMENTED across all departments.' RELATIVE CLAUSE (that was discussed) + PRESENT CONTINUOUS PASSIVE (is being implemented). Two passive constructions at different times show the plan's journey from discussion to implementation."}, {"type": "tf", "q": "Conditionals can embed relative clauses, reported speech, and passives within them.", "answer": true, "explanation": "True. CONDITIONALS EMBED MULTIPLE SYSTEMS: 'If the report THAT WAS SUBMITTED last week HAD BEEN REVIEWED more carefully, the errors WOULD HAVE BEEN CAUGHT.' The third conditional embeds: (1) defining relative clause ('that was submitted'); (2) two passive constructions ('had been reviewed', 'would have been caught'). Conditionals are flexible containers for other systems."}, {"type": "mcq", "q": "'She said she would have been promoted had she not resigned.' What interaction occurs?", "options": ["Reported speech only", "REPORTED SPEECH + THIRD CONDITIONAL (inverted) — the third conditional appears within reported speech", "Modal perfect only", "Passive only"], "answer": 1, "explanation": "REPORTED SPEECH + INVERTED THIRD CONDITIONAL: 'She SAID' (reporting verb) + 'she WOULD HAVE BEEN PROMOTED' (result clause) + 'HAD SHE NOT RESIGNED' (inverted third conditional — formal). The inverted conditional ('had she not resigned' instead of 'if she hadn't resigned') appears inside reported speech."}, {"type": "mcq", "q": "'Not only had the deadline been missed, but the work that was submitted was also found to be incomplete.' Count the systems:", "options": ["Two", "Three", "Four", "Five or more"], "answer": 3, "explanation": "FOUR+ SYSTEMS: (1) FRONTED NEGATIVE with INVERSION: 'Not only had'; (2) PASSIVE PERFECT: 'had been missed'; (3) DEFINING RELATIVE CLAUSE: 'that was submitted'; (4) PASSIVE + FOUND: 'was found to be incomplete' (passive + adjective complement). Complex sentences in formal writing routinely combine this many systems."}, {"type": "mcq", "q": "Which is the MOST accurate description of how grammatical systems work in real language?", "options": ["Each grammatical system operates independently", "Grammatical systems constantly interact, combine, and nest within each other to create meaning", "Only one system can operate per sentence", "Grammatical systems are separate units that should not mix"], "answer": 1, "explanation": "GRAMMATICAL SYSTEMS INTERACT CONSTANTLY. In real language, sentences routinely combine: tenses + aspect + modality + voice + clause types + discourse markers. These systems are not isolated units — they work together to create nuanced meaning. Integrated grammar mastery means controlling these interactions."}, {"type": "tf", "q": "A sentence using present perfect passive ('It has been decided') combines aspect, voice, and tense simultaneously.", "answer": true, "explanation": "True. 'IT HAS BEEN DECIDED' combines: (1) TENSE: present (reference to now); (2) ASPECT: perfect (completed action with present relevance); (3) VOICE: passive (agent removed); (4) IMPERSONAL SUBJECT: 'it' (avoids naming decision-makers). Four grammatical dimensions in three words — this is the elegance of integrated grammar."}, {"type": "mcq", "q": "'Despite having been warned repeatedly, he continued to ignore the safety protocols.' What systems combine here?", "options": ["Only participial clauses", "Concessive structure + perfect passive participial clause + main clause with modal-like verb", "Only passive", "Only concession"], "answer": 1, "explanation": "THREE SYSTEMS: (1) CONCESSIVE: 'Despite' (= in spite of / although); (2) PERFECT PASSIVE PARTICIPIAL CLAUSE: 'having been warned repeatedly' (had been warned = passive perfect aspect); (3) MAIN CLAUSE: 'continued to ignore' (past simple + infinitive complement). The systems nest within each other naturally."}, {"type": "mcq", "q": "What does integrated grammar mastery ultimately enable a language user to do?", "options": ["Memorise all grammar rules", "Produce and understand sentences that naturally combine multiple grammatical systems with accuracy, fluency, and appropriate register", "Avoid using complex sentences", "Use only simple present tense"], "answer": 1, "explanation": "INTEGRATED GRAMMAR MASTERY = the ability to COMBINE systems ACCURATELY, FLUENTLY, and with REGISTER AWARENESS. Not memorising rules in isolation — but deploying tense, voice, mood, clause structure, and modality together, in context, for communicative purpose. This is the goal of advanced grammar study."}];
var SKEY="m11_l1",NEXT="q11-2.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}

updDots();rQ();
