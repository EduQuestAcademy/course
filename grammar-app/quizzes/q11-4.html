var Q=[{"type": "mcq", "q": "Which grammatical structure is MOST useful for presenting a THESIS STATEMENT in an argument?", "options": ["Simple present: 'This essay argues that...'", "Past perfect: 'This essay had argued that...'", "Future: 'This essay will have argued that...'", "Present continuous: 'This essay is arguing that...'"], "answer": 0, "explanation": "'This essay ARGUES THAT...' — SIMPLE PRESENT for thesis statements in academic writing. 'It is argued that...', 'This essay contends that...', 'The paper examines...' — all use simple present for the meta-discourse (writing about the writing). Present tense creates an authoritative, definitive claim."}, {"type": "mcq", "q": "'While some argue that X, others contend that Y.' What grammatical structure is this?", "options": ["A simple compound sentence", "A CONCESSIVE STRUCTURE expressing opposing views: 'while' + present simple acknowledges one position before presenting the counter-position", "A conditional sentence", "A passive construction"], "answer": 1, "explanation": "ARGUMENTATIVE CONCESSIVE STRUCTURE: 'WHILE some argue X, others contend Y.' 'While' introduces one perspective as a concession before presenting the contrasting view. This is a fundamental sentence pattern in academic argument: acknowledge one side, then present the other. 'While', 'whereas', 'although' are key argumentative conjunctions."}, {"type": "tf", "q": "Hedging language (might, could, appears to, tends to, suggests) is important in academic argument to show appropriate epistemic caution.", "answer": true, "explanation": "True. HEDGING in academic writing signals intellectual honesty: 'The data SUGGESTS that...', 'This MIGHT indicate...', 'It APPEARS THAT...' Hedging avoids overstating certainty. Strong claims ('This PROVES that...') are often inappropriate without overwhelming evidence. Hedging with modals and epistemic verbs is a mark of academic sophistication."}, {"type": "mcq", "q": "'It has been widely demonstrated that exercise improves mental health; however, the mechanisms remain poorly understood.' What argumentative move does 'however' signal?", "options": ["Agreement with the previous point", "A CONCESSION + COUNTER: first concedes the established point, then introduces a gap/limitation — the classic problem-solution argumentative structure", "A definition", "A conclusion"], "answer": 1, "explanation": "'HOWEVER' = ADVERSATIVE CONNECTOR signalling a COUNTER or QUALIFICATION. The structure: ESTABLISHED FACT ('it has been demonstrated...') + HOWEVER + GAP/LIMITATION ('mechanisms remain poorly understood'). This is the classic academic argument move: concede the consensus, then identify the problem your research addresses."}, {"type": "fill", "q": "'This paper ________ (aim) to examine the relationship between grammar and academic success.' Complete for a formal introduction.", "answer": "aims", "hint": "Simple present for academic thesis statements...", "explanation": "'This paper AIMS to examine...' SIMPLE PRESENT for ACADEMIC META-DISCOURSE. Verbs used: aims, seeks, examines, investigates, argues, contends, demonstrates. Simple present creates the authoritative, present-tense framing of academic writing purpose statements."}, {"type": "mcq", "q": "'Not only does the evidence support the hypothesis, but it also challenges previous assumptions.' What argumentative function does 'not only...but also' serve?", "options": ["Simple addition", "EMPHASIS + ESCALATION: first presents one positive, then escalates to an even stronger point — 'not only X, but also Y (which is even more significant)'", "Concession", "Contrast"], "answer": 1, "explanation": "'NOT ONLY...BUT ALSO' = ADDITIVE EMPHASIS with ESCALATION. In argument: first point (evidence supports hypothesis) is then surpassed by a stronger point (challenges previous assumptions). The structure builds from the expected to the surprising/stronger claim. A powerful argumentative escalation device."}, {"type": "mcq", "q": "'Although the government's intentions were admirable, the policy's outcomes were deeply problematic.' In an argument, this structure:", "options": ["Avoids taking a position", "CONCEDES ONE POINT then ARGUES A STRONGER COUNTER-POINT — the 'although' clause acknowledges virtue before the main clause delivers the critical analysis", "Simply describes facts", "Draws a conclusion"], "answer": 1, "explanation": "ARGUMENTATIVE CONCESSION: 'ALTHOUGH [positive concession], [stronger critical point].' Acknowledging the government's good intentions (concession) makes the subsequent criticism ('deeply problematic outcomes') more credible and fair-minded. This concede-then-critique structure is central to balanced academic argument."}, {"type": "tf", "q": "The passive voice is useful in argument for expressing general consensus without attributing the claim to one person: 'It is generally accepted that...'", "answer": true, "explanation": "True. IMPERSONAL PASSIVE FOR CONSENSUS: 'IT IS GENERALLY ACCEPTED THAT...', 'IT HAS BEEN ARGUED THAT...', 'IT IS WIDELY BELIEVED THAT...' These passive reporting structures present claims as shared knowledge or ongoing academic discourse rather than personal opinions. Essential for academic argument."}, {"type": "mcq", "q": "'The evidence strongly suggests that further research is needed; thus, the current study contributes to an important gap in the literature.' Identify the argumentative connectors:", "options": ["'Strongly' and 'further'", "'STRONGLY SUGGESTS' (epistemic verb + hedging) + 'THUS' (logical conclusion) — both signal argumentative moves", "'Evidence' and 'study'", "'Needed' and 'current'"], "answer": 1, "explanation": "TWO ARGUMENTATIVE SIGNALS: (1) 'STRONGLY SUGGESTS' = hedged claim with epistemic modality ('suggests' not 'proves'); (2) 'THUS' = logical consequence connector. 'Thus/therefore/hence/consequently' introduce the logical conclusion drawn from preceding evidence. The combination creates the 'evidence → conclusion' argumentative logic."}, {"type": "mcq", "q": "Which sentence is the most effective academic argument counter-claim structure?", "options": ["But some people think differently.", "While proponents of X claim that..., this position fails to account for...", "X is wrong because people say so.", "Some people are against this."], "answer": 1, "explanation": "'WHILE PROPONENTS OF X CLAIM THAT..., this position FAILS TO ACCOUNT FOR...' — the most sophisticated counter-argument structure: (1) CONCESSIVE 'while' acknowledges the opposing view; (2) 'PROPONENTS OF X CLAIM' = academic language for presenting others' views; (3) 'FAILS TO ACCOUNT FOR' = precise critical analysis verb. The structure is balanced and academic."}, {"type": "mcq", "q": "'This finding corroborates the view that...' What is the argumentative function of 'corroborates'?", "options": ["It weakens the claim", "It introduces a new topic", "It CONFIRMS AND STRENGTHENS the argument by showing consistency with established views — 'corroborates' = provides additional support for", "It introduces a counter-argument"], "answer": 2, "explanation": "'CORROBORATES' = confirms/supports/provides evidence for. Argumentative support verbs: corroborate, substantiate, reinforce, validate, confirm, demonstrate, illustrate. These verbs position evidence as SUPPORTING the claim. Essential academic vocabulary for building argument through evidence."}, {"type": "fill", "q": "'________ the evidence is compelling, questions remain about the long-term effects.' Introduce a concession.", "answer": "Although|While|Even though|Whilst", "hint": "Concessive conjunction acknowledging strength then introducing limitation...", "explanation": "'ALTHOUGH/WHILE the evidence is compelling, questions remain about the long-term effects.' CONCESSIVE ARGUMENTATIVE STRUCTURE: acknowledge the strength of the evidence (concession) then introduce the limitation/counter-point. Standard academic argument move: concede + qualify."}, {"type": "tf", "q": "In formal argument, 'In conclusion, it can be seen that...' is more appropriate than 'So basically what I'm saying is...'", "answer": true, "explanation": "True. FORMAL CONCLUSION MARKERS: 'In conclusion, it can be seen that...', 'To summarise, the evidence demonstrates...', 'The foregoing analysis suggests...' These formal discourse markers signal the conclusion with appropriate register. Informal markers ('so basically', 'what I mean is') are inappropriate in academic argument."}, {"type": "mcq", "q": "'This argument, though persuasive on the surface, overlooks several crucial factors.' What grammatical feature makes this an effective critical sentence?", "options": ["The use of 'this'", "The CONCESSIVE PARENTHETICAL CLAUSE ('though persuasive on the surface') embedded within the main critique ('overlooks crucial factors') — sophisticated grammar serving the argument", "The use of 'several'", "The word 'crucial'"], "answer": 1, "explanation": "EMBEDDED CONCESSIVE CLAUSE: 'THOUGH PERSUASIVE ON THE SURFACE' is a reduced concessive clause (= 'although it is persuasive on the surface'). Embedding it parenthetically within the critique shows the writer can acknowledge merit while simultaneously undermining the argument. Grammatical sophistication serves the argumentative purpose."}, {"type": "mcq", "q": "What is the grammatical difference between 'This PROVES that X is true' and 'This SUGGESTS that X may be true'?", "options": ["No meaningful difference", "EPISTEMIC CERTAINTY vs HEDGING: 'proves' = 100% certain claim (rare in academic writing); 'suggests + may' = hedged, appropriate academic claim showing awareness of limitations", "'Proves' is wrong grammar", "'Suggests' is informal"], "answer": 1, "explanation": "EPISTEMIC MARKING: 'PROVES' = certain (very strong claim, rarely justified). 'SUGGESTS THAT X MAY BE' = double-hedged (suggests + may). Academic writing AVOIDS overstatement: 'demonstrates', 'indicates', 'suggests', 'implies' + 'may/might/could' are preferred to 'proves/shows/is'. Hedging = academic caution and precision."}, {"type": "mcq", "q": "Which discourse marker signals a LOGICAL CONSEQUENCE in academic argument?", "options": ["Furthermore", "However", "Nevertheless", "Therefore"], "answer": 3, "explanation": "'THEREFORE' = LOGICAL CONSEQUENCE (A is true, THEREFORE B follows). Other consequence markers: thus, hence, consequently, as a result, it follows that. These signal that the next statement is a logical conclusion from the previous evidence. 'Furthermore' = addition; 'however' = contrast; 'nevertheless' = concessive."}, {"type": "tf", "q": "Using first person ('I argue that...') is now considered acceptable in many academic disciplines.", "answer": true, "explanation": "True. FIRST PERSON IN ACADEMIC WRITING: Many disciplines now ACCEPT or ENCOURAGE 'I argue that...', 'I contend that...', 'In this paper, I demonstrate...' It avoids the awkwardness of passive ('it is argued'). However, disciplines vary: sciences often prefer passive/impersonal; humanities often accept 'I.' Always follow discipline conventions."}, {"type": "mcq", "q": "'The data are unambiguous; to deny this would be to ignore the evidence entirely.' The semicolon and conditional together create what effect?", "options": ["A casual tone", "LOGICAL FORCE: the semicolon presents a strong evidential claim; the conditional 'to deny this would be to...' challenges anyone who disagrees, implying denial is irrational", "A question", "A concession"], "answer": 1, "explanation": "RHETORICAL FORCE THROUGH GRAMMAR: semicolon (strong pause — equal weight) + CONDITIONAL ('to deny this WOULD BE TO ignore evidence') = logical trap for dissenters. The conditional structure suggests that denial is equivalent to intellectual dishonesty. Grammar creates rhetorical effect in argument."}, {"type": "mcq", "q": "Complete the argumentative sequence: 'X has been demonstrated. Furthermore, Y has been observed. ________, it can be concluded that Z.'", "options": ["However", "Although", "Therefore", "Despite"], "answer": 2, "explanation": "'THEREFORE' completes the argument sequence: evidence (X) + additional evidence (Y) + THEREFORE + conclusion (Z). This is the ARGUMENTATIVE LOGIC CHAIN: premises → evidence → therefore → conclusion. 'Therefore' (consequence) is the only option that correctly signals the logical conclusion drawn from the accumulated evidence."}];

var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];

function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}

function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}

function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';

else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}

var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}

var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
