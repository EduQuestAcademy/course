var Q=[{"type": "mcq", "q": "A student writes: 'The policy has introduced last year caused many problems.' Identify ALL errors:", "options": ["One error: tense", "TWO ERRORS: (1) 'has introduced' should be 'introduced' (specific past time = simple past, not present perfect); (2) MISSING RELATIVE PRONOUN: 'that/which was introduced' — needs a connector between 'policy' and 'last year'", "No errors", "One error: missing article"], "answer": 1, "explanation": "TWO ERRORS: (1) TENSE: 'has introduced' → 'INTRODUCED' (specific past time 'last year' requires simple past); (2) STRUCTURE: 'The policy introduced last year' needs either 'The policy THAT WAS introduced last year' (relative clause) or 'The policy INTRODUCED last year' (reduced relative — correct). The current form is a run-on."}, {"type": "mcq", "q": "Transform: 'She was too exhausted to continue.' Begin with 'Such was...':", "options": ["Such was her exhaustion that she couldn't continue.", "Such exhausted she was that she couldn't continue.", "Such the exhaustion that she couldn't continue.", "Such was she exhausted that she couldn't continue."], "answer": 0, "explanation": "'SUCH WAS HER EXHAUSTION that she couldn't continue.' TRANSFORMATION: TOO + adjective → SUCH WAS + noun phrase + THAT. 'Too exhausted to continue' → 'such was her exhaustion that she couldn't continue.' The adjective ('exhausted') becomes a noun ('exhaustion'); 'such was' + possessive noun phrase + 'that' + result."}, {"type": "tf", "q": "'Having been rejected by three publishers, the novel was eventually accepted by a fourth, which went on to win a major award.' This sentence correctly combines passive, perfect participial, and relative clause.", "answer": true, "explanation": "True. THREE SYSTEMS COMBINED: (1) PASSIVE PERFECT PARTICIPIAL: 'Having been rejected by three publishers' (passive + perfect aspect + participial); (2) PASSIVE: 'was eventually accepted'; (3) NON-DEFINING RELATIVE CLAUSE: 'which went on to win a major award' (referring to the fourth publisher). All three are used correctly."}, {"type": "mcq", "q": "Improve this weak student sentence: 'People think that exercise is good and they say it helps mental health too.'", "options": ["It is widely believed that exercise is beneficial; furthermore, research suggests it significantly improves mental health.", "People think exercise is good and helpful for mental health.", "Exercise is good. It helps mental health.", "People widely think that exercise helps mental health."], "answer": 0, "explanation": "'It is WIDELY BELIEVED that exercise is BENEFICIAL; furthermore, research SUGGESTS it SIGNIFICANTLY IMPROVES mental health.' IMPROVEMENTS: (1) Impersonal passive ('it is widely believed'); (2) Formal vocabulary ('beneficial' not 'good'); (3) Semicolon for formal connection; (4) 'Furthermore' as academic connector; (5) 'research suggests' (hedged attribution)."}, {"type": "fill", "q": "'Not until she ________ (read) the final chapter ________ (understand) the author's true intention.' Complete with inversion.", "answer": "had read / did she understand", "hint": "Not until + past perfect + inversion (did + subject + base verb)...", "explanation": "'Not until she HAD READ the final chapter DID SHE UNDERSTAND the author's true intention.' INVERSION after fronted 'not until': DID + she + base verb (understand). The past perfect in the 'not until' clause shows the reading was completed before understanding followed."}, {"type": "mcq", "q": "A news headline reads: 'Three arrested after robbery.' Expand to a full formal sentence:", "options": ["Three were arrested after robbery.", "Three people have been arrested in connection with a robbery that took place yesterday.", "Police arrested three. The robbery happened.", "Three persons are arrested after a robbery took place."], "answer": 1, "explanation": "'Three people HAVE BEEN ARRESTED in connection with a robbery THAT TOOK PLACE yesterday.' EXPANSION: (1) 'Three' → 'Three people' (article + noun); (2) 'arrested' → 'have been arrested' (present perfect passive — recent with present relevance); (3) 'after robbery' → 'in connection with a robbery that took place yesterday' (relative clause + time expression)."}, {"type": "mcq", "q": "'Despite her considerable experience, the position was not offered to her.' Rewrite beginning 'Although':", "options": ["Although she had considerable experience, the position was not offered to her.", "Although her experience was considerable, she did not offer the position.", "Although considerable experience, the position was not offered.", "She was not offered the position although having considerable experience."], "answer": 0, "explanation": "'ALTHOUGH SHE HAD CONSIDERABLE EXPERIENCE, the position was not offered to her.' DESPITE + noun phrase → ALTHOUGH + full clause. 'Her considerable experience' → 'she had considerable experience.' 'Despite' (preposition + noun) converts to 'Although' (conjunction + full subject + verb clause). Passive maintained."}, {"type": "tf", "q": "'The research that was conducted over five years has produced results that may revolutionise the field' integrates four grammatical systems correctly.", "answer": true, "explanation": "True. FOUR SYSTEMS: (1) DEFINING RELATIVE CLAUSE: 'that was conducted over five years'; (2) PASSIVE: 'was conducted'; (3) PRESENT PERFECT: 'has produced'; (4) HEDGED MODAL: 'may revolutionise' (appropriate epistemic caution). All four systems operate correctly and naturally together in one sophisticated sentence."}, {"type": "mcq", "q": "Which is the most effective combination of the sentences: 'The experiment failed. Researchers were disappointed. They will try a new approach.'", "options": ["The experiment failed and the researchers were disappointed and they will try a new approach.", "The experiment having failed, the disappointed researchers will now try a new approach.", "The experiment failed but the researchers were disappointed so they will try a new approach.", "Researchers were disappointed after the experiment failed they will try a new approach."], "answer": 1, "explanation": "'The experiment HAVING FAILED, the disappointed researchers WILL NOW TRY a new approach.' ELEGANT COMBINATION: (1) Perfect participial ('having failed') condenses first sentence; (2) Adjective ('disappointed') condenses second; (3) Main clause expresses the forward-looking consequence. Three sentences become one through participial + adjective + main clause integration."}, {"type": "mcq", "q": "Convert to reported speech: '\"We would have succeeded had you supported us,\" the director said.'", "options": ["The director said they would have succeeded had she supported them.", "The director said that they would have succeeded if she had supported them.", "The director said they would have succeeded if they had been supported.", "Both A and B are correct."], "answer": 3, "explanation": "BOTH A and B are correct: (A) 'they WOULD HAVE SUCCEEDED HAD SHE SUPPORTED them' (inverted third conditional preserved in reported speech); (B) 'they WOULD HAVE SUCCEEDED if she HAD SUPPORTED them' (non-inverted third conditional). Both preserve the third conditional meaning. Pronouns: 'we' → 'they'; 'you' → 'she/he' depending on context."}, {"type": "mcq", "q": "'It being a public holiday, the offices were closed.' Identify the grammatical structure and its function:", "options": ["Dangling participle — incorrect", "ABSOLUTE CLAUSE: 'it being a public holiday' has its own subject ('it') different from 'the offices' — formally expresses the circumstance/reason for closure", "A reduced adverbial clause", "A non-defining relative clause"], "answer": 1, "explanation": "ABSOLUTE CLAUSE: 'IT BEING A PUBLIC HOLIDAY' — 'it' is the subject of 'being'; 'the offices' is the main clause subject. Different subjects = absolute clause (not a dangling participle). Expresses the CIRCUMSTANCE/REASON formally and elegantly. Equivalent to: 'Since it was a public holiday, the offices were closed.'"}, {"type": "fill", "q": "Complete the academic sentence: 'The findings ________ (present) in this paper ________ (challenge) the prevailing view that technology ________ (inevitably / improve) educational outcomes.'", "answer": "presented / challenge / inevitably improves", "hint": "Past participial (reduced relative) + present simple + adverb + present simple...", "explanation": "'The findings PRESENTED in this paper CHALLENGE the prevailing view that technology INEVITABLY IMPROVES educational outcomes.' (1) 'Presented' = reduced relative passive; (2) 'challenge' = present simple main verb; (3) 'inevitably improves' = adverb + present simple in noun clause. Academic register throughout."}, {"type": "tf", "q": "Mastery of integrated grammar allows writers to simultaneously control meaning, register, precision, and rhetorical effect.", "answer": true, "explanation": "True. INTEGRATED GRAMMAR MASTERY enables SIMULTANEOUS CONTROL of: (1) MEANING (what is communicated); (2) REGISTER (formal/informal, academic/narrative); (3) PRECISION (exact relationships between ideas); (4) RHETORICAL EFFECT (emphasis, persuasion, emotion). Grammar is not just a set of rules — it is the primary tool of effective communication."}, {"type": "mcq", "q": "'Not a single proposal submitted by the committee was accepted by the board.' What is the most important grammatical observation about this sentence?", "options": ["It uses simple past", "MULTIPLE SYSTEMS: fronted 'not a single' (emphasis/inversion of expected positive), passive ('was accepted'), reduced relative ('submitted by the committee'), formal register — all integrated naturally", "It is too long", "It uses active voice"], "answer": 1, "explanation": "MULTIPLE INTEGRATED SYSTEMS: (1) EMPHATIC NEGATIVE: 'Not a single' (stronger than 'No proposal'); (2) PASSIVE REDUCED RELATIVE: 'submitted by the committee' (= that had been submitted); (3) PASSIVE MAIN VERB: 'was accepted'; (4) FORMAL REGISTER throughout. The complexity is invisible because the systems combine smoothly."}, {"type": "mcq", "q": "Which single improvement would MOST elevate this sentence: 'The government made many changes to the policy.'", "options": ["Add an adjective: 'The government made many big changes'", "NOMINALISE AND SPECIFY: 'The government implemented substantial revisions to the policy' — 'made changes' → 'implemented revisions' (formal verbs); 'many' → 'substantial' (precise quantifier)", "Make it passive: 'Many changes were made'", "Add 'very': 'The government made very many changes'"], "answer": 1, "explanation": "'The government IMPLEMENTED SUBSTANTIAL REVISIONS to the policy.' IMPROVEMENT: (1) 'Made changes' → 'IMPLEMENTED REVISIONS' (more formal, precise verb + nominal); (2) 'Many' → 'SUBSTANTIAL' (qualitative precision, not just quantity). Both improvements raise register and precision simultaneously — the hallmarks of integrated grammar mastery."}, {"type": "mcq", "q": "Why is integrated grammar mastery the goal of advanced grammar study?", "options": ["Because it allows learners to memorise more rules", "Because it enables the simultaneous deployment of multiple grammatical systems — tense, voice, aspect, modality, clause structure — in service of clear, appropriate, and sophisticated communication", "Because it makes language more complicated", "Because it only matters for academic writing"], "answer": 1, "explanation": "INTEGRATED GRAMMAR MASTERY = the ability to use ALL grammatical systems TOGETHER, SIMULTANEOUSLY, and PURPOSEFULLY. Not separate rules memorised in isolation, but a fluid command that serves communication in any context — academic argument, narrative prose, professional communication, or everyday conversation. This is the pinnacle of language proficiency."}];
var SKEY="m11_l6",NEXT="q11-7.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}

function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
