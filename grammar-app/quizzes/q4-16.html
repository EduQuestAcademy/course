<style>

  .res-actions{display:flex;flex-direction:column;gap:10px;width:100%;}
  .res-primary{background:linear-gradient(135deg,var(--accent),var(--accent-mid));border:none;border-radius:var(--r-lg);padding:16px;font-family:inherit;font-size:1em;font-weight:700;color:white;cursor:pointer;text-align:center;text-decoration:none;display:block;box-shadow:var(--sh-accent);transition:opacity 0.15s;}

var Q=[{"type": "mcq", "q": "Which sentence uses the CORRECT tense? 'She ___ to Paris last year.'", "options": ["has gone", "have gone", "went", "is going"], "answer": 2, "explanation": "SIMPLE PAST: 'She WENT to Paris last year.' 'Last year' is a specific, finished past time → always simple past, never present perfect. 'Has gone' would be wrong with 'last year'."}, {"type": "mcq", "q": "'They have lived here ___ 2015.' Which word best completes this present perfect sentence?", "options": ["for", "ago", "last", "since"], "answer": 3, "explanation": "SINCE + starting point (2015): 'They have lived here SINCE 2015.' 'For' is used with duration: 'for ten years.' 'Ago' and 'last' require simple past. This tests since vs for."}, {"type": "tf", "q": "'She is always losing her keys' is grammatically incorrect because 'always' should only be used with simple present.", "answer": false, "explanation": "False. 'She IS ALWAYS LOSING her keys' is CORRECT — present continuous + always expresses an ANNOYING HABIT. This is a deliberate and grammatically valid structure showing frustration with a repeated behaviour."}, {"type": "mcq", "q": "Choose the correct tense sequence: 'When I ___ (arrive), she ___ (already/leave).'", "options": ["arrived / had already left", "had arrived / already left", "was arriving / has already left", "arrive / already left"], "answer": 0, "explanation": "'When I ARRIVED (simple past — later event), she HAD ALREADY LEFT (past perfect — earlier event).' Past perfect shows the leaving happened BEFORE the arriving. 'By the time / when + simple past' often triggers past perfect."}, {"type": "mcq", "q": "Which sentence uses present continuous for a FUTURE ARRANGEMENT?", "options": ["She is knowing the answer.", "She is meeting the CEO tomorrow.", "She is always forgetting things.", "She is finishing the report right now."], "answer": 1, "explanation": "'She IS MEETING the CEO tomorrow' — PRESENT CONTINUOUS for a definite future arrangement (the meeting is already scheduled). 'Know' is stative. 'Always forgetting' = annoying habit. 'Is finishing' = current action."}, {"type": "fill", "q": "'The match ___ (start) at 3 pm tomorrow.' Use simple present for this scheduled event.", "answer": "starts", "hint": "Simple present for timetabled events...", "explanation": "'The match STARTS at 3 pm tomorrow' — SIMPLE PRESENT for scheduled/timetabled future events. This is common with transport and events: departs, arrives, begins, ends, starts. Third person singular → add -s."}, {"type": "mcq", "q": "'She has been studying for six hours.' What does the present perfect continuous emphasise?", "options": ["The studying is completed", "The duration of the ongoing activity (six hours of studying)", "She studied six hours ago", "She will study for six hours"], "answer": 1, "explanation": "PRESENT PERFECT CONTINUOUS emphasises DURATION: 'HAS BEEN STUDYING for six hours' — the activity has been ongoing for a long period. It also implies present relevance (she may still be studying or just stopped)."}, {"type": "mcq", "q": "'By the time you arrive, I ___ (cook) dinner.' Which future form is correct?", "options": ["will cook", "will be cooking", "will have cooked", "am cooking"], "answer": 2, "explanation": "'I WILL HAVE COOKED dinner by the time you arrive' — FUTURE PERFECT. 'By the time you arrive' = a future reference point. The cooking will be COMPLETE before that point. The dinner will be ready when you get there."}, {"type": "tf", "q": "'He was always interrupting people' (past continuous + always) is a correct way to describe an annoying past habit.", "answer": true, "explanation": "True. PAST CONTINUOUS + ALWAYS = annoying past habit. 'He WAS ALWAYS INTERRUPTING people' — he had this irritating habit (in the past). This structure directly mirrors 'He is always interrupting' (present continuous + always)."}, {"type": "mcq", "q": "Which sentence INCORRECTLY uses past perfect?", "options": ["When she arrived, the film had already started.", "She realised she had left her phone at home.", "After she had eaten, she went for a walk.", "She had went to the shop."], "answer": 3, "explanation": "ERROR: 'She had WENT' — 'went' is SIMPLE PAST, not a past participle. Correct: 'She HAD GONE to the shop.' Past perfect requires HAD + PAST PARTICIPLE. 'Gone' is the past participle of 'go', not 'went'."}, {"type": "mcq", "q": "'I ___ (not/see) him since Monday.' Which present perfect negative is correct?", "options": ["didn't see", "haven't seen", "wasn't seeing", "hadn't seen"], "answer": 1, "explanation": "'I HAVEN'T SEEN him since Monday' — PRESENT PERFECT NEGATIVE + since. The not-seeing started on Monday and continues to NOW. 'Since' + time point with present perfect = from that past point to the present."}, {"type": "fill", "q": "'At this time tomorrow, I ___ (fly) over the Atlantic.' Complete with future continuous.", "answer": "will be flying", "hint": "Will + be + verb-ing for an action in progress at a future time...", "explanation": "'At this time tomorrow, I WILL BE FLYING over the Atlantic' — FUTURE CONTINUOUS for an action IN PROGRESS at a specific future time ('at this time tomorrow'). The flying will be ongoing at that future moment."}, {"type": "mcq", "q": "Which sentence uses simple present for a UNIVERSAL TRUTH?", "options": ["She is eating an apple now.", "The Sun rises in the east.", "He went to school yesterday.", "She will arrive tomorrow."], "answer": 1, "explanation": "'The Sun RISES in the east' — UNIVERSAL TRUTH (always true). Simple present for permanent facts, scientific laws, and eternal truths. The sun has always risen in the east and always will."}, {"type": "mcq", "q": "'She told me she ___ the report.' (She said: 'I have finished the report.') Reported speech — what is the correct backshift?", "options": ["has finished", "finished", "had finished", "was finishing"], "answer": 2, "explanation": "REPORTED SPEECH BACKSHIFT: present perfect ('I HAVE FINISHED') → past perfect ('she told me she HAD FINISHED'). In reported speech, tenses shift back one step: present → past, present perfect → past perfect."}, {"type": "mcq", "q": "'By next June, he ___ here for three years.' Which future perfect continuous sentence is correct?", "options": ["will work here", "will have worked here", "will be working here", "will have been working here"], "answer": 3, "explanation": "'He WILL HAVE BEEN WORKING here for three years by next June' — FUTURE PERFECT CONTINUOUS for a DURATION (3 years) of ongoing activity up to a future point (next June). 'Will have worked' (future perfect) focuses on completion, not duration."}, {"type": "tf", "q": "'I am thinking of moving abroad' is grammatically correct — 'think' can be used in continuous form here.", "answer": true, "explanation": "True. 'THINKING OF/ABOUT' = active mental process (considering an option) — this DYNAMIC use of 'think' allows continuous form. Compare: 'I think you're right' (opinion/stative — NO continuous)."}, {"type": "mcq", "q": "Which pair shows the correct use of 'for' and 'since'?", "options": ["'For 2015' and 'since three years'", "'For three years' and 'since 2015' (or 'since last Monday')", "'For last week' and 'since five hours'", "Both 'for' and 'since' mean the same"], "answer": 1, "explanation": "'FOR + DURATION (three years, five hours, a long time)' and 'SINCE + STARTING POINT (2015, last Monday, this morning)' — these are the two correct patterns with present perfect and past perfect continuous."}, {"type": "mcq", "q": "Identify the tense shift error: 'Napoleon invaded Russia in 1812 and the campaign becomes a disaster.'", "options": ["No error", "'Becomes' should be 'became' — historical narrative should maintain past tense", "'Invaded' should be 'invades'", "Both verbs should be present"], "answer": 1, "explanation": "'BECOMES' → 'BECAME': historical narrative uses simple past throughout. 'Napoleon INVADED Russia... and the campaign BECAME a disaster.' Shifting to present tense ('becomes') is an inconsistency error in past-tense historical writing."}, {"type": "mcq", "q": "'She ___ (just/eat) — she's not hungry.' Which present perfect sentence is correct?", "options": ["She just ate", "She has just eaten", "She is just eating", "She had just eaten"], "answer": 1, "explanation": "'She HAS JUST EATEN' — PRESENT PERFECT + JUST for a very recent action with PRESENT CONSEQUENCE (she's not hungry NOW). 'Just' sits between 'has/have' and the past participle. The past participle of 'eat' is 'eaten'."}, {"type": "mcq", "q": "Which sentence best demonstrates the FUTURE PERFECT and its meaning?", "options": ["By the time you finish reading this, you will have learned twenty tenses.", "She will learn tenses.", "She is learning tenses now.", "She learned tenses last year."], "answer": 0, "explanation": "'By the time you finish reading this, you WILL HAVE LEARNED twenty tenses' — FUTURE PERFECT: action (learning) will be COMPLETE before the future reference point (finishing reading). This perfectly captures the future-before-future structure of the future perfect."}];
var SKEY="m4_assessment",NEXT="../index.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Back to Dashboard</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
</body>
