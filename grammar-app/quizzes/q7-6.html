var Q=[{"type": "mcq", "q": "'She said the Earth is round.' Why is present tense NOT backshifted here?", "options": ["'Said' is past so backshift is required", "The Earth being round is a permanent scientific fact — always true, so present tense is retained", "Backshift is optional for all sentences", "'Round' prevents backshift"], "answer": 1, "explanation": "PERMANENT TRUTHS and SCIENTIFIC FACTS retain present tense even in reported speech: 'The Earth IS round.' The fact doesn't change over time, so backshift would misrepresent it. Similarly: 'She said water BOILS at 100°C.'"}, {"type": "mcq", "q": "If the reporting verb is in the PRESENT tense, backshift:", "options": ["Is always required", "Is never required — tenses stay as in the original", "Applies to modals only", "Only applies to past tenses"], "answer": 1, "explanation": "PRESENT REPORTING VERB → NO BACKSHIFT NEEDED. 'She says she IS tired' (not 'was'). 'He tells me he HAS finished.' When the reporting verb is present (says, tells, announces), the original tenses can be kept unchanged."}, {"type": "tf", "q": "When the reported situation is STILL TRUE at the time of reporting, backshift is optional.", "answer": true, "explanation": "True. If the situation is STILL CURRENT, backshift is OPTIONAL: 'She said she LIVES in Paris' (she still does) vs 'She said she LIVED in Paris' (she may have moved). Both are acceptable. If the situation has changed, past tense is preferred."}, {"type": "mcq", "q": "'He told me he was born in 1990.' Why is past simple NOT shifted to past perfect?", "options": ["It should be shifted — this is an error", "Date of birth is a permanent fact — 'was born' remains as past simple", "'Born' cannot be past perfect", "Backshift only applies to present tenses"], "answer": 1, "explanation": "'He told me he WAS BORN in 1990.' A person's birth year is a PERMANENT FACT that never changes — backshift to 'had been born' would be unusual and unnecessary. Historical facts and permanent personal data are not typically backshifted."}, {"type": "fill", "q": "'She said, \"The meeting starts at 9 tomorrow.\"' If reported immediately: 'She said the meeting ________ at 9 the next day.'", "answer": "starts|started", "hint": "Backshift optional when still relevant/true...", "explanation": "'She said the meeting STARTS/STARTED at 9 the next day.' If reported very soon after (meeting hasn't happened yet), PRESENT TENSE is acceptable: 'starts.' Backshift ('started') is also correct. When the information is still relevant, present can be retained."}, {"type": "mcq", "q": "'\"I've lived here for twenty years,\" she said.' When can we retain present perfect?", "options": ["Never — always backshift to past perfect", "When she STILL lives there at the time of reporting", "Only in formal contexts", "When the reporting verb is present"], "answer": 1, "explanation": "If she STILL LIVES THERE when we report her words, we can optionally retain: 'She said she HAS LIVED there for twenty years.' But if we report later and she may have moved, backshift is appropriate: 'She said she HAD LIVED there for twenty years.'"}, {"type": "mcq", "q": "'\"The film is excellent,\" the critic said.' Which reported version might retain present tense?", "options": ["The critic said the film was excellent. (only correct form)", "The critic said the film IS excellent. (opinion still valid)", "Both are acceptable depending on context", "Present tense is always wrong in reported speech"], "answer": 2, "explanation": "BOTH ARE ACCEPTABLE: 'The critic said the film WAS excellent' (standard backshift) and 'The critic said the film IS excellent' (the film is still showing; the opinion is still relevant). When a review/opinion is still current, present can be kept."}, {"type": "tf", "q": "Backshift is generally not required when reporting something very recently said, especially in informal conversation.", "answer": true, "explanation": "True. In INFORMAL/IMMEDIATE REPORTING, backshift is often dropped: 'She just said she IS coming' (not 'was coming'). The closer in time the report is to the original statement, the more natural it is to retain the original tenses."}, {"type": "mcq", "q": "'He said Napoleon was defeated at Waterloo in 1815.' Is the past tense correct here?", "options": ["No — it should be 'had been defeated'", "Yes — historical facts can stay in past simple without further backshift", "No — present tense should be used", "Yes, but only because the reporting verb is past"], "answer": 1, "explanation": "'Napoleon WAS DEFEATED at Waterloo in 1815' — HISTORICAL FACT. Simple past is appropriate for historical facts. Backshifting to 'had been defeated' is unusual and unnecessary. Historical events with specific dates typically stay in simple past."}, {"type": "mcq", "q": "'She said she is a doctor.' vs 'She said she was a doctor.' What do these imply?", "options": ["No difference", "'Is a doctor' implies she still IS one; 'was a doctor' may imply she is no longer a doctor", "'Is a doctor' is always wrong", "'Was a doctor' is always more correct"], "answer": 1, "explanation": "'She IS a doctor' (present retained) = she is STILL a doctor now. 'She WAS a doctor' (backshifted) = she was one at the time of speaking — may or may not still be. The tense choice communicates whether the situation is current."}, {"type": "mcq", "q": "When should backshift be AVOIDED for clarity?", "options": ["When the sentence is long", "When using past tense would create ambiguity about whether the situation is still current", "When the reporting verb is 'say'", "When there are two clauses"], "answer": 1, "explanation": "AVOID BACKSHIFT when it would CREATE AMBIGUITY: 'She said she lives in London' is clearer than 'She said she lived in London' if she still lives there. Backshifting might wrongly suggest she has moved. Retaining present tense avoids this confusion."}, {"type": "fill", "q": "'\"The sun rises in the east,\" the teacher said.' Reported: 'The teacher said the sun ________ in the east.'", "answer": "rises|rose", "hint": "Scientific/geographical fact — no backshift needed...", "explanation": "'The teacher said the sun RISES in the east.' SCIENTIFIC FACT — the sun always rises in the east, so present 'rises' is retained. 'Rose' (backshifted) would be technically acceptable but unusual for an eternal geographical fact."}, {"type": "tf", "q": "'He said he was sorry' and 'He said he is sorry' can both be correct, depending on whether the apology is still relevant.", "answer": true, "explanation": "True. 'He said he WAS sorry' (standard backshift — apology noted). 'He said he IS sorry' (present retained — the apology is still genuine/current). Both are grammatically acceptable; the choice depends on whether the feeling of regret is still ongoing."}, {"type": "mcq", "q": "'\"I love you,\" he whispered to her.' In a novel being narrated: 'He whispered that he loved/loves her.' Which tense is typical in literary narrative?", "options": ["Only present tense is used in novels", "Backshifted past ('loved') is standard in literary narrative past tense", "Both are equally common", "Neither is correct for novels"], "answer": 1, "explanation": "In literary NARRATIVE using past tense, BACKSHIFT ('he loved') is standard: 'He whispered that he LOVED her.' This maintains consistency with the past tense narrative voice. Present ('loves') would break the past tense narrative — though some styles may use it for dramatic effect."}, {"type": "mcq", "q": "'\"Two plus two equals four,\" the teacher said.' Why is backshift not needed?", "options": ["Mathematical rules require present tense", "2+2=4 is a mathematical truth that is always and permanently true", "The reporting verb is present", "The sentence is too short to backshift"], "answer": 1, "explanation": "MATHEMATICAL/LOGICAL TRUTH: '2+2=4' is always true — an eternal fact. No backshift: 'The teacher said two plus two EQUALS four.' Like scientific facts, mathematical truths retain present tense. Backshifting would be unusual: 'equalled' sounds wrong."}, {"type": "mcq", "q": "In journalism, why might a reporter write 'The minister says the policy will benefit workers'?", "options": ["It is an error", "Present reporting verb 'says' means no backshift is required or expected", "The journalist cannot use past tense", "'Says' is always more formal"], "answer": 1, "explanation": "'The minister SAYS...' — PRESENT reporting verb → no backshift. Journalism often uses present tense for reporting verbs to make stories feel current and immediate: 'He says...', 'She claims...', 'The company announces...' This is a deliberate stylistic choice."}, {"type": "mcq", "q": "Which situation most clearly does NOT require backshift?", "options": ["Reporting something said last week about a past event", "Reporting a general scientific law just stated", "Reporting a past plan that was cancelled", "Reporting a specific past event that is no longer relevant"], "answer": 1, "explanation": "A GENERAL SCIENTIFIC LAW just stated doesn't require backshift — it is always true: 'The professor said that electrons HAVE a negative charge.' The truth of the statement is independent of when it was said."}, {"type": "tf", "q": "'She told me she was pregnant' (backshifted) and 'She told me she is pregnant' (not backshifted) can both be correct in British English.", "answer": true, "explanation": "True. Both are ACCEPTABLE in British English: 'she WAS pregnant' (backshift — standard formal/written) and 'she IS pregnant' (no backshift — informal/still current). If she is still pregnant, present is logical. If reported long after, backshift is more appropriate."}];

else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
