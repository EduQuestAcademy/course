var Q=[{"type": "mcq", "q": "When is the passive voice most appropriately used?", "options": ["When you want to make writing more casual", "When the agent is unknown, unimportant, or deliberately omitted", "When you have too many active sentences", "When describing actions in the past only"], "answer": 1, "explanation": "Passive is most appropriate when: (1) AGENT IS UNKNOWN ('My phone was stolen'); (2) AGENT IS OBVIOUS/UNIMPORTANT; (3) DELIBERATE OMISSION (tactfulness, mystery); (4) FORMAL/SCIENTIFIC writing; (5) FOCUSING on the receiver of the action."}, {"type": "mcq", "q": "'Mistakes were made.' Why might this passive be used in a political context?", "options": ["It sounds more intelligent", "It deliberately avoids naming who made the mistakes (evasive passive)", "It is a scientific statement", "It is the only correct form"], "answer": 1, "explanation": "'MISTAKES WERE MADE' is famously EVASIVE — the agent (who made the mistakes) is omitted. Politicians and officials use passive voice to acknowledge problems without assigning blame. This deliberate omission is sometimes called the 'institutional passive'."}, {"type": "tf", "q": "Scientific writing commonly uses passive voice to achieve objectivity and impersonality.", "answer": true, "explanation": "True. SCIENTIFIC/ACADEMIC WRITING uses passive extensively: 'The samples WERE HEATED to 100°C', 'The results WERE RECORDED', 'It HAS BEEN OBSERVED that...' This creates OBJECTIVITY by removing the personal 'I/we' and focusing on the experiment/process."}, {"type": "mcq", "q": "'The new hospital was opened by the Queen in 2010.' Why is passive used here?", "options": ["Because the Queen is unknown", "To focus on the hospital (more important topic) while noting the agent", "Because active voice is impossible", "The Queen is the main subject"], "answer": 1, "explanation": "PASSIVE with BY PHRASE: The HOSPITAL is the main topic/focus (new subject). The Queen is important enough to mention (so 'by the Queen' is included) but the hospital — not the Queen — is the primary topic of discussion."}, {"type": "fill", "q": "In formal reports, the passive is used to describe PROCESSES without naming the performer: 'Data ________ (collect) from 500 participants.'", "answer": "was collected|were collected", "hint": "Passive past simple...", "explanation": "'Data WAS COLLECTED from 500 participants' — SCIENTIFIC/REPORT PASSIVE. The researcher who collected it is not mentioned because the PROCESS (data collection) is the focus, not the person who did it."}, {"type": "mcq", "q": "'English is spoken in over 50 countries.' Why is passive preferred here?", "options": ["'Speak' is irregular", "The agent (billions of people) is too general/obvious to mention", "The active form is impossible", "English cannot speak"], "answer": 1, "explanation": "'English IS SPOKEN in over 50 countries' — the agent (people in those countries) is TOO GENERAL and obvious to state. 'English is spoken by people in over 50 countries' is clumsy and redundant. Passive without agent is cleaner."}, {"type": "mcq", "q": "'You should hand in assignments on Fridays.' Which passive version maintains the FORMAL TONE better?", "options": ["Someone hands in assignments on Fridays.", "Assignments should be handed in on Fridays.", "Somebody is handing in assignments.", "Assignments are being handed in on Fridays."], "answer": 1, "explanation": "'Assignments SHOULD BE HANDED IN on Fridays' — the passive is impersonal and authoritative, suitable for formal instructions (rules, guidelines, notices). It avoids the personal 'you' and sounds more official and objective."}, {"type": "tf", "q": "When the agent is the key piece of new information, including the 'by' phrase in passive is appropriate.", "answer": true, "explanation": "True. The 'by' phrase is INCLUDED when the agent is important or new information: 'The telephone was invented BY ALEXANDER GRAHAM BELL' — Bell's identity is the key piece of information. If the agent is obvious or unimportant, omit 'by'."}, {"type": "mcq", "q": "'The company fired 200 workers.' A company spokesperson might prefer:", "options": ["We fired 200 workers.", "200 workers were let go.", "I fired 200 workers.", "The workers fired themselves."], "answer": 1, "explanation": "'200 workers WERE LET GO' — TACTFUL/EUPHEMISTIC PASSIVE. The company avoids naming themselves as the agent, making the action sound less harsh and avoiding direct blame. This 'responsibility-avoidance' use is common in corporate communication."}, {"type": "mcq", "q": "'The thief was caught by police after a long chase.' When should the 'by police' be OMITTED?", "options": ["Never — agents must always be stated", "When the agent is obvious from context (e.g., obviously the police catch thieves)", "When the sentence is too long", "When writing fiction"], "answer": 1, "explanation": "'The thief was caught' (without 'by police') is perfectly acceptable when it's OBVIOUS who the agent is. If the agent adds no new information, omitting 'by + agent' is cleaner and more natural."}, {"type": "mcq", "q": "Which context MOST strongly calls for passive voice?", "options": ["A text message to a friend", "A spoken conversation", "A scientific research paper describing methodology", "A personal blog post"], "answer": 2, "explanation": "SCIENTIFIC RESEARCH PAPER: 'The experiments WERE CONDUCTED...', 'The data WERE ANALYSED...' This is the context that MOST consistently uses passive — for objectivity, formality, and focus on the experimental process rather than the researchers."}, {"type": "fill", "q": "'Someone broke into our house last night.' Passive (focusing on the house): 'Our house ________ last night.'", "answer": "was broken into", "hint": "Phrasal verb passive: was + broken into...", "explanation": "'Our house WAS BROKEN INTO last night.' Note: phrasal verbs maintain their particle in passive: 'broken into' stays together. The agent ('someone') is omitted as it is unknown. Phrasal verb passives keep the preposition/particle attached to the verb."}, {"type": "tf", "q": "In passive sentences for news headlines, the 'be' auxiliary is often omitted for brevity.", "answer": true, "explanation": "True. NEWS HEADLINES often use TRUNCATED PASSIVE (be omitted): 'Three arrested after robbery' (= Three people have been/were arrested). 'Bridge closed due to flooding' (= The bridge has been closed). This creates concise, punchy headlines."}, {"type": "mcq", "q": "'The suspect was seen leaving the building at 9 pm.' Why is passive used here?", "options": ["The suspect is unknown", "The passive focuses on the suspect (the topic) and the action of being seen", "'See' cannot be used in active", "The agent is known and important"], "answer": 1, "explanation": "'The suspect WAS SEEN' focuses on the SUSPECT and what happened to them. In witness statements, crime reports, and legal contexts, passive maintains the topic (suspect/victim) as the grammatical subject across multiple sentences."}, {"type": "mcq", "q": "Which is the BEST reason to AVOID passive voice?", "options": ["When the agent is genuinely unknown", "When you want to create exciting, energetic, direct narrative writing", "When writing a scientific report", "When the subject is obvious"], "answer": 1, "explanation": "AVOID passive when you want DIRECT, ENERGETIC writing — e.g., action narratives, journalism, persuasive writing. Overusing passive creates weak, distant, or bureaucratic prose. Active voice is more direct and engaging in creative/journalistic contexts."}, {"type": "mcq", "q": "'It is believed that the treasure is buried here.' What does this impersonal passive express?", "options": ["One specific person believes it", "A general belief (attributed to people in general, no specific agent)", "The speaker's personal belief", "A scientific fact"], "answer": 1, "explanation": "'IT IS BELIEVED that...' = IMPERSONAL PASSIVE expressing a GENERAL/WIDESPREAD BELIEF. This structure attributes a belief to people in general without specifying who: 'It is said that...', 'It is thought that...', 'It is reported that...'"}, {"type": "mcq", "q": "'The letter was written in 1842.' Why is passive preferred over 'Someone wrote the letter in 1842'?", "options": ["'Someone' is wrong English", "The letter is the known topic; 'someone' adds no useful information", "Passive is always better in the past", "'Wrote' is irregular"], "answer": 1, "explanation": "'THE LETTER was written in 1842' — the LETTER is the topic. 'Someone' tells us nothing new (we know a person wrote it). Passive allows us to keep the important subject (the letter) and drop the uninformative 'someone'."}, {"type": "tf", "q": "Passive can be used to maintain topic continuity across several sentences.", "answer": true, "explanation": "True. TOPIC CONTINUITY: 'The painting was created in 1503. It was commissioned by a Florentine merchant. It was displayed in France for centuries. It is now housed in the Louvre.' Passive keeps 'the painting' as the subject throughout, maintaining coherent flow."}, {"type": "mcq", "q": "'Dinner is served.' vs 'We serve dinner.' In a formal restaurant, which is preferred and why?", "options": ["'We serve dinner' — more personal", "'Dinner is served' — more formal and focuses on the meal being ready, not on the server", "Both are equally appropriate", "'We serve dinner' is always correct"], "answer": 1, "explanation": "'DINNER IS SERVED' — formal restaurant register. The passive is more FORMAL, IMPERSONAL, and focuses on the important information (the meal is ready) rather than on who is serving. A classic use of institutional/formal passive."}];
var SKEY="m6_l3",NEXT="q6-4.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
