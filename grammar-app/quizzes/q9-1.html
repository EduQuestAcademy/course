var Q=[{"type": "mcq", "q": "What is the structure of the ZERO CONDITIONAL?", "options": ["If + past simple, would + base verb", "If + present simple, present simple", "If + present perfect, will + base verb", "If + past perfect, would have + past participle"], "answer": 1, "explanation": "ZERO CONDITIONAL = IF + PRESENT SIMPLE, PRESENT SIMPLE. Both clauses use present simple. 'If you heat water to 100°C, it boils.' Used for UNIVERSAL TRUTHS, SCIENTIFIC FACTS, and HABITS — things that are ALWAYS true whenever the condition is met."}, {"type": "mcq", "q": "'If you mix red and blue, you get purple.' What type of conditional is this?", "options": ["First conditional — a future possibility", "Second conditional — an unreal situation", "Zero conditional — a universal truth", "Third conditional — a past regret"], "answer": 2, "explanation": "ZERO CONDITIONAL — this is a UNIVERSAL TRUTH about colour mixing. The result always follows from the condition. Zero conditionals state facts that are invariably true: scientific facts, mathematical truths, general rules, habits."}, {"type": "tf", "q": "In the zero conditional, 'when' can replace 'if' without changing the meaning.", "answer": true, "explanation": "True. In zero conditionals, IF and WHEN are interchangeable: 'If you heat water, it boils' = 'When you heat water, it boils.' Both express universal truths. The difference is subtle: 'when' slightly emphasises the regularity; 'if' the condition. Both are correct."}, {"type": "mcq", "q": "Which sentence is a ZERO CONDITIONAL?", "options": ["If it rains tomorrow, we will cancel the picnic.", "If I were rich, I would travel the world.", "If plants don't get water, they die.", "If she had studied, she would have passed."], "answer": 2, "explanation": "'If plants don't get water, THEY DIE' = ZERO CONDITIONAL (universal biological truth). The result ALWAYS follows. The other sentences: first conditional (future possibility), second conditional (unreal present), third conditional (unreal past)."}, {"type": "fill", "q": "'If you ________ (freeze) water, it turns to ice.' Complete with zero conditional.", "answer": "freeze", "hint": "Present simple in both clauses...", "explanation": "'If you FREEZE water, it turns to ice.' ZERO CONDITIONAL: both clauses use PRESENT SIMPLE. A scientific fact — always true. No tense shift needed because this is a timeless, universal truth."}, {"type": "mcq", "q": "'If I eat too much sugar, I get headaches.' This expresses:", "options": ["A future prediction", "A personal habit or regular consequence", "An unreal situation", "A past regret"], "answer": 1, "explanation": "ZERO CONDITIONAL for PERSONAL HABITS/REGULAR CONSEQUENCES. This describes something that always happens for this particular person — a personal pattern. Not a universal truth for everyone, but a reliable personal consequence. Zero conditional covers both universal truths and personal habits."}, {"type": "mcq", "q": "'When the temperature drops below zero, pipes freeze.' Can the clauses be reversed?", "options": ["No — the if/when clause must always come first", "Yes — 'Pipes freeze when the temperature drops below zero.' (no comma needed when if-clause comes second)", "No — the result clause must always come first", "Yes, but the meaning changes"], "answer": 1, "explanation": "CLAUSE ORDER IS FLEXIBLE: 'Pipes freeze WHEN THE TEMPERATURE DROPS BELOW ZERO.' When the condition clause comes AFTER the main clause, NO COMMA is needed. Both orders are correct — the meaning stays the same."}, {"type": "tf", "q": "Zero conditionals can be used to give instructions or warnings: 'If you press this button, the machine stops.'", "answer": true, "explanation": "True. Zero conditionals are used for INSTRUCTIONS and PROCEDURES: 'If you press the red button, the machine stops.' 'If you mix these chemicals, a reaction occurs.' The result reliably follows the action — making zero conditional ideal for manuals and instructions."}, {"type": "mcq", "q": "'If you exercise regularly, your health improves.' This is zero conditional because:", "options": ["It uses 'will' in the result clause", "Both clauses are in present simple and the result is always/generally true", "It describes a future prediction", "It is an unreal situation"], "answer": 1, "explanation": "ZERO CONDITIONAL: BOTH CLAUSES IN PRESENT SIMPLE ('exercise', 'improves'). The result is generally/always true — a reliable cause-and-effect relationship. No 'will' = not first conditional. Present + present = zero conditional."}, {"type": "mcq", "q": "Which zero conditional correctly uses the negative?", "options": ["If you don't sleep enough, you will feel tired.", "If you don't sleep enough, you feel tired.", "If you won't sleep enough, you feel tired.", "If you didn't sleep enough, you feel tired."], "answer": 1, "explanation": "'If you DON'T SLEEP ENOUGH, you FEEL tired.' ZERO CONDITIONAL NEGATIVE: 'don't/doesn't + base verb' in the if-clause; present simple in result clause. No 'will' (that would make it first conditional). The negative present simple is 'don't/doesn't'."}, {"type": "mcq", "q": "'Metals conduct electricity if they are pure.' What does this zero conditional establish?", "options": ["A future possibility", "A scientific property that is always true for pure metals", "An unreal situation about metals", "A past observation"], "answer": 1, "explanation": "ZERO CONDITIONAL for SCIENTIFIC PROPERTY: pure metals always conduct electricity — this is a reliable, universal fact about their nature. Zero conditionals are fundamental to scientific descriptions of properties, laws, and phenomena."}, {"type": "fill", "q": "'If you ________ (not water) plants, they wither.' Zero conditional negative.", "answer": "don't water", "hint": "Present simple negative = don't/doesn't + base verb...", "explanation": "'If you DON'T WATER plants, they wither.' Zero conditional negative: don't + base verb in the if-clause. This is a universally true horticultural fact — plants always wither without water."}, {"type": "tf", "q": "'If you add 2 and 2, you get 4' is a zero conditional expressing a mathematical truth.", "answer": true, "explanation": "True. Mathematical truths use ZERO CONDITIONAL: '2 + 2 = 4 is always true.' 'If you add 2 and 2, you get 4' — the result invariably follows from the condition. No future, no hypothetical — just a permanent truth."}, {"type": "mcq", "q": "What is the key difference between ZERO and FIRST conditionals?", "options": ["Zero uses 'if'; first uses 'when'", "Zero expresses what is ALWAYS true; first expresses what MIGHT happen in the future", "Zero is for the past; first is for the present", "Zero uses past simple; first uses present simple"], "answer": 1, "explanation": "ZERO = ALWAYS TRUE (universal facts, habits): 'If you heat ice, it melts.' FIRST = POSSIBLE FUTURE event ('If it rains tomorrow, we'll cancel'). Zero: present + present. First: present + will. Zero is about invariable facts; first is about probable future outcomes."}, {"type": "mcq", "q": "'If customers complain, we offer a refund.' This zero conditional describes:", "options": ["A future policy that might be implemented", "A company policy that is always followed", "An unreal situation", "A past practice"], "answer": 1, "explanation": "ZERO CONDITIONAL for COMPANY POLICY/PROCEDURE: 'we always offer a refund when customers complain.' The result reliably follows the condition. Zero conditionals describe standard procedures, policies, and rules that are always applied."}, {"type": "mcq", "q": "'If the alarm sounds, everyone evacuates the building.' Can 'when' replace 'if' here?", "options": ["No — 'if' is mandatory", "Yes — 'when the alarm sounds' works equally well for this procedure", "No — 'when' would change it to a future event only", "Yes, but only in informal speech"], "answer": 1, "explanation": "'WHEN the alarm sounds, everyone evacuates' = equally correct. For procedures and reliable sequences, both IF and WHEN work in zero conditionals. 'When' slightly emphasises the reliability of the trigger; 'if' slightly emphasises the condition aspect."}, {"type": "tf", "q": "Zero conditionals can also express habitual past actions using 'if + past simple, past simple'.", "answer": true, "explanation": "True. PAST ZERO CONDITIONAL for PAST HABITS: 'If she had free time, she read.' (whenever she had free time, she always read). This uses past simple in both clauses to describe habitual patterns in the past. Less common than present zero conditional but grammatically valid."}, {"type": "mcq", "q": "Identify the zero conditional: 'You look tired if you haven't slept.'", "options": ["This is zero conditional — present simple result", "This is not zero conditional because it uses present perfect in the if-clause", "This is first conditional", "This is second conditional"], "answer": 1, "explanation": "'If you haven't slept' uses PRESENT PERFECT (not present simple) — so this is not a standard zero conditional (which uses present simple + present simple). However, the meaning is close to zero conditional. Standard zero conditional requires present simple in both clauses."}, {"type": "mcq", "q": "'If you touch fire, it burns you.' What aspect of English does the zero conditional capture here?", "options": ["A rare, unlikely event", "An inevitable, immediate consequence", "A hypothetical situation", "A past experience"], "answer": 1, "explanation": "INEVITABLE CONSEQUENCE: touching fire ALWAYS burns — no exceptions, no possibility of it not happening. Zero conditional captures the INVARIABLE CAUSE-EFFECT relationship. This is the core meaning: condition → result, always, without fail."}, {"type": "mcq", "q": "Which sentence is NOT a zero conditional?", "options": ["If you drop something, it falls.", "If you study hard, you usually do well.", "If you press enter, the computer saves the file.", "If she calls, please tell her I'll be back later."], "answer": 3, "explanation": "'If she calls, PLEASE TELL HER I'll be back' = NOT zero conditional. 'Please tell' is an imperative + future element ('I'll be back'). This is closer to a FIRST CONDITIONAL with an imperative result. The others all describe reliable, general truths or habits."}];
var SKEY="m9_l1",NEXT="q9-2.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
