var Q=[{"type": "mcq", "q": "Which variety of English is generally considered the historical origin from which American English developed?", "options": ["Australian English", "British English", "Canadian English", "South African English"], "answer": 1, "explanation": "BRITISH ENGLISH (BrE) is the historical origin. American English (AmE) developed from British English brought to North America by settlers from the 17th century. Over time, AmE developed independently, preserving some older British features while also innovating. Neither variety is 'more correct' — both are complete, prestigious standards."}, {"type": "mcq", "q": "Which statement best describes the relationship between British and American English?", "options": ["They are completely different languages", "They are mutually intelligible varieties of the same language with systematic differences in spelling, vocabulary, grammar, and pronunciation", "American English is simply incorrect British English", "British English is old-fashioned; American English is modern"], "answer": 1, "explanation": "BrE and AmE are MUTUALLY INTELLIGIBLE VARIETIES — speakers of each can generally understand the other. They share the same grammatical core but differ systematically in spelling (colour/color), vocabulary (lift/elevator), grammar (have got/have), and pronunciation. Neither is superior; both are fully developed standard varieties."}, {"type": "tf", "q": "American English has preserved some features that were used in 17th-century British English but are now considered archaic in Britain.", "answer": true, "explanation": "True. AmE PRESERVES OLDER FEATURES: 'fall' (autumn — used in Britain until 18th century), 'gotten' (past participle of 'get' — used in older British English), 'I will' for first person (British English traditionally used 'shall'). American English can seem old-fashioned to British ears for historical reasons."}, {"type": "mcq", "q": "Which global institution is most associated with setting standards for British English?", "options": ["The Oxford English Dictionary and BBC English", "The Webster's Dictionary only", "The American Heritage Dictionary", "The French Academy"], "answer": 0, "explanation": "BRITISH ENGLISH STANDARDS: The OXFORD ENGLISH DICTIONARY (OED) is the most authoritative reference. BBC English has long been a pronunciation model (Received Pronunciation / RP). Style guides (e.g., Oxford Style Guide) and examination bodies (Cambridge, IELTS) also establish written standards."}, {"type": "mcq", "q": "Noah Webster (1758–1843) played a key role in:", "options": ["Establishing British English spelling standards", "STANDARDISING AMERICAN ENGLISH spelling — his 1828 dictionary simplified many British spellings (colour→color, honour→honor, programme→program)", "Inventing the English language", "Promoting British English in America"], "answer": 1, "explanation": "NOAH WEBSTER standardised AMERICAN ENGLISH SPELLING. His 'An American Dictionary of the English Language' (1828) systematically reformed spellings: -our → -or (colour/color), -re → -er (centre/center), -ise → -ize (standardise/standardize), double letters → single (travelled/traveled). His reforms reflected American national identity."}, {"type": "tf", "q": "Neither British nor American English is inherently 'more correct' — both are complete, standardised varieties of English.", "answer": true, "explanation": "True. LANGUAGE EQUALITY: Both BrE and AmE are fully developed, prestigious, standardised varieties. Calling AmE 'wrong' British or BrE 'old-fashioned' reflects social attitudes, not linguistic fact. Both have their own norms, literature, and international influence. Learners should choose one variety and be consistent."}, {"type": "mcq", "q": "What is the approximate percentage of the world's English speakers who use American English as their primary variety?", "options": ["Less than 10%", "About 20%", "About 65–70% (if we include international English heavily influenced by AmE)", "100%"], "answer": 2, "explanation": "AMERICAN ENGLISH DOMINANCE: AmE is the variety most heard globally through: Hollywood films, American TV, technology (Silicon Valley), and international media. It influences global English enormously. While BrE remains prestigious in academia and many international contexts, AmE has the largest global footprint."}, {"type": "mcq", "q": "'English is a global language.' What does this mean for BrE/AmE differences?", "options": ["Only one variety should be used worldwide", "Learners should be aware that BOTH varieties are valid internationally — choosing one and being consistent is more important than preferring either", "AmE has replaced BrE globally", "BrE is the only correct international standard"], "answer": 1, "explanation": "GLOBAL ENGLISH REALITY: Both BrE and AmE are internationally accepted. International English exams (IELTS, TOEFL, Cambridge) accept both. Learners are advised to: (1) choose ONE variety; (2) be CONSISTENT within a text; (3) understand the other variety for comprehension. Neither variety is 'more international.'"}, {"type": "mcq", "q": "Which of the following is a feature that BOTH British AND American English share?", "options": ["Identical spelling for all words", "The same grammar, sentence structure, and core vocabulary — differences are at the margins, not the core", "Identical punctuation rules", "Identical pronunciation"], "answer": 1, "explanation": "SHARED CORE: Despite differences, BrE and AmE share: (1) IDENTICAL GRAMMAR for most structures; (2) SHARED CORE VOCABULARY (the vast majority of words); (3) SAME WRITING SYSTEMS; (4) MUTUAL INTELLIGIBILITY. The differences — while important — are at the margins of the system, not the core."}, {"type": "mcq", "q": "Why is it important for English language learners to understand the differences between BrE and AmE?", "options": ["To choose which is correct", "To AVOID CONFUSION when reading different texts, to know which variety to use in different contexts (British exams, American academic papers), and to communicate with speakers of both varieties", "Because they are totally different languages", "Only for advanced learners"], "answer": 1, "explanation": "PRACTICAL IMPORTANCE: (1) EXAMINATION CONTEXT: IELTS/Cambridge = BrE preferred; TOEFL = AmE. (2) PROFESSIONAL CONTEXT: UK company = BrE; US company = AmE. (3) COMPREHENSION: reading texts from both varieties. (4) CONSISTENCY: choosing one variety to avoid mixing. Understanding both enables full global communication."}, {"type": "mcq", "q": "'Received Pronunciation' (RP) is:", "options": ["The pronunciation used by all British people", "The prestige accent historically associated with educated Southern British English — the BrE 'standard' for broadcasting and teaching", "The American standard pronunciation", "The Australian standard"], "answer": 1, "explanation": "RECEIVED PRONUNCIATION (RP): the historically prestigious British accent associated with public schools, the BBC, and upper-class speech. It is non-regional (doesn't reveal where in Britain the speaker is from). 'General American' is the equivalent AmE prestige accent. RP is the model for most BrE pronunciation teaching."}, {"type": "tf", "q": "Indian English, Nigerian English, and Australian English are all valid World Englishes, not 'incorrect' versions of BrE or AmE.", "answer": true, "explanation": "True. WORLD ENGLISHES: Kachru's 'Three Circles' framework recognises Inner Circle (BrE, AmE, AusE, etc.), Outer Circle (Indian English, Nigerian English, etc.), and Expanding Circle (English as foreign language). All inner and outer circle varieties are LEGITIMATE, NATIVISED Englishes with their own standards."}, {"type": "mcq", "q": "Which decade saw the greatest expansion of American English influence globally?", "options": ["1800s", "1900–1930", "POST-WWII ONWARDS — American cultural, economic, and military dominance accelerated global spread of AmE through media, technology, and pop culture", "1600s"], "answer": 2, "explanation": "POST-WWII AmE EXPANSION: After 1945, American cultural products (Hollywood, rock music, TV, later internet/tech) spread AmE globally. The Cold War, Marshall Plan, and American economic dominance made AmE the language of modernity and pop culture. The internet (1990s onwards) accelerated this further."}, {"type": "mcq", "q": "When a learner writes 'I travelled to the centre of the city' and then 'I traveled to the center of the city' in the same document, what error are they making?", "options": ["Spelling error", "INCONSISTENCY — mixing BrE ('travelled', 'centre') and AmE ('traveled', 'center') in the same text. Learners should choose ONE variety and maintain it throughout", "Grammar error", "Punctuation error"], "answer": 1, "explanation": "VARIETY MIXING ERROR: Using BrE spelling in one sentence and AmE in another is INCONSISTENT. Consistent variety use is important in: (1) formal writing and exams; (2) professional documents; (3) academic papers. Both varieties are correct — but mixing them signals confusion and lack of control."}, {"type": "mcq", "q": "Which of these is TRUE about BrE and AmE grammatical differences?", "options": ["They have completely different grammatical systems", "BrE and AmE grammatical differences are RELATIVELY MINOR — the same core grammar applies; differences appear mainly in tense use (present perfect vs simple past), modal verbs, and prepositions", "AmE uses no grammar", "BrE grammar is more complex"], "answer": 1, "explanation": "GRAMMATICAL SIMILARITY: The vast majority of BrE and AmE grammar is IDENTICAL. Key differences are: (1) PRESENT PERFECT vs SIMPLE PAST ('I've just eaten' BrE / 'I just ate' AmE); (2) MODAL: 'shall' (BrE) vs 'will' (AmE); (3) PREPOSITIONS: 'at the weekend' (BrE) vs 'on the weekend' (AmE). Minor but important."}, {"type": "mcq", "q": "The term 'Mid-Atlantic English' refers to:", "options": ["English spoken in the Atlantic Ocean", "A HYBRID VARIETY blending BrE and AmE features — used by some international speakers and professionals who interact with both British and American contexts", "Australian English", "South African English"], "answer": 1, "explanation": "MID-ATLANTIC ENGLISH: a blend of BrE and AmE features used by some internationally mobile professionals, actors, and global organizations. It is neither fully BrE nor AmE but draws on both. While not a standardised variety, it reflects the reality of globalisation — speakers naturally blend features from exposure to both varieties."}, {"type": "tf", "q": "The spelling reform movement championed by George Bernard Shaw advocated for greater simplification of English spelling.", "answer": true, "explanation": "True. SPELLING REFORM: George Bernard Shaw (and others) advocated for more phonetically consistent English spelling. Shaw left money in his will for the development of a new alphabet (the Shavian alphabet). While widespread reform hasn't occurred, American English's spelling simplifications (color, favor) can be seen as partial moves in this direction."}, {"type": "mcq", "q": "'The two varieties are different enough that speakers of one cannot understand the other.' Is this statement accurate?", "options": ["Yes — they are mutually unintelligible", "No — BrE and AmE are MUTUALLY INTELLIGIBLE; most differences are minor and context usually makes meaning clear. Some slang and vocabulary may cause confusion, but core communication is not impeded", "Only in formal contexts", "Only in informal speech"], "answer": 1, "explanation": "MUTUAL INTELLIGIBILITY: BrE and AmE speakers understand each other perfectly well in most contexts. Vocabulary differences ('lift/elevator') may occasionally cause brief confusion, but core communication is never impeded. Films, TV, and international media ensure both varieties are widely understood globally."}, {"type": "mcq", "q": "Which best describes the current global status of English?", "options": ["English is declining as a global language", "English serves as the world's primary LINGUA FRANCA — used between speakers of different L1s — with both BrE and AmE serving as reference standards", "Only BrE is internationally recognised", "Only AmE is internationally recognised"], "answer": 1, "explanation": "ENGLISH AS LINGUA FRANCA (ELF): English is the world's most widely used language for international communication. Both BrE and AmE (and other varieties) contribute to this global role. ELF research shows that non-native speakers outnumber native speakers — English belongs to all its users, not just British or American speakers."}];

var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}

function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}

function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';

else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';

function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}

var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];

if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}

var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
