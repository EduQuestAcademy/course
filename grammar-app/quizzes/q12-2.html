var Q=[{"type": "mcq", "q": "What is the British English spelling of the American 'color'?", "options": ["Collor", "Colour", "Coler", "Kolour"], "answer": 1, "explanation": "BrE: COLOUR / AmE: COLOR. The -OUR → -OR pattern is one of the most systematic BrE/AmE spelling differences: honour/honor, favour/favor, neighbour/neighbor, behaviour/behavior, glamour/glamor. Noah Webster eliminated the 'u' in his 1828 dictionary for simplification."}, {"type": "mcq", "q": "Which pair shows a BrE -RE / AmE -ER difference?", "options": ["Theatre / Theater", "Thetre / Theeter", "Theatr / Theater", "Theatre / Theatr"], "answer": 0, "explanation": "BrE: THEATRE / AmE: THEATER. The -RE → -ER reversal: centre/center, metre/meter, litre/liter, fibre/fiber, theatre/theater, calibre/caliber. BrE retains the French-influenced -re ending; AmE reverses to phonetically straightforward -er."}, {"type": "tf", "q": "British English typically doubles the final consonant before -ed and -ing endings more than American English.", "answer": true, "explanation": "True. BrE DOUBLE CONSONANT: 'travel' → TRAVELLED/TRAVELLING (BrE) vs TRAVELED/TRAVELING (AmE). Also: cancelled/canceled, levelled/leveled, modelled/modeled. BrE doubles the final consonant in unstressed syllables; AmE typically does not. The rule is consistent for verbs ending in a single consonant after a single vowel."}, {"type": "mcq", "q": "The American spelling 'program' vs the British 'programme' — which contexts still use 'program' in British English?", "options": ["Never — British English always uses 'programme'", "British English uses 'program' specifically for COMPUTER PROGRAMS — 'programme' for other meanings (TV programme, theatre programme)", "Always — British English uses 'program' for everything", "'Programme' is used for computers in British English"], "answer": 1, "explanation": "BrE EXCEPTION: 'PROGRAM' is used in BrE for COMPUTER SOFTWARE ('a computer program'). 'PROGRAMME' is used for all other senses (TV programme, theatre programme, programme of events). This is one case where AmE spelling has been adopted into BrE for a specific technical meaning."}, {"type": "fill", "q": "Complete the BrE spelling: 'The ________ of the building was stunning.' (AmE: 'defense')", "answer": "defence", "hint": "BrE uses -ce; AmE uses -se for this word...", "explanation": "BrE: DEFENCE / AmE: DEFENSE. The -CE / -SE pattern: offence/offense, licence/license (noun in BrE), pretence/pretense, defence/defense. BrE uses -CE for nouns; note that 'license' in BrE can be the verb ('to license') while 'licence' is the noun."}, {"type": "mcq", "q": "Which word has the SAME spelling in both British and American English?", "options": ["Colour/Color", "Analyse/Analyze", "Cat", "Behaviour/Behavior"], "answer": 2, "explanation": "'CAT' — and most common everyday words — have IDENTICAL spellings in BrE and AmE. The spelling differences are relatively systematic but affect a specific subset of words. The core vocabulary (common nouns, verbs, adjectives) is largely spelled the same. Differences cluster around certain suffix patterns."}, {"type": "mcq", "q": "'Analyse' (BrE) vs 'Analyze' (AmE). Which suffix pattern does this represent?", "options": ["The -RE/-ER pattern", "The -OUR/-OR pattern", "The -ISE/-IZE pattern", "The -CE/-SE pattern"], "answer": 2, "explanation": "The -ISE / -IZE PATTERN: BrE traditionally uses -ISE (analyse, organise, recognise, realise), while AmE uses -IZE (analyze, organize, recognize, realize). Note: Oxford University Press prefers -IZE even for BrE; however, -ISE is more common in everyday British usage. Both are acceptable in BrE."}, {"type": "tf", "q": "'Judgement' (BrE) and 'judgment' (AmE) is an example of a BrE/AmE spelling difference involving a silent 'e'.", "answer": true, "explanation": "True. BrE: JUDGEMENT / AmE: JUDGMENT. Similarly: BrE 'acknowledgement' / AmE 'acknowledgment.' BrE retains the 'e' in these forms; AmE drops it. Note: 'judgment' without 'e' is also used in BrE in legal contexts. Both spellings appear in reputable dictionaries."}, {"type": "mcq", "q": "'Cheque' (BrE) vs 'check' (AmE) for the banking term — this difference is:", "options": ["Only a spelling difference — same pronunciation and meaning", "A VOCABULARY DIFFERENCE as well as spelling — BrE uses 'cheque' for the banking document; AmE uses 'check' for the same item", "AmE is incorrect here", "BrE 'cheque' is outdated"], "answer": 0, "explanation": "'CHEQUE' (BrE) / 'CHECK' (AmE) = same item (a written order to a bank), same pronunciation (/tʃek/), just different spellings. This is one of many cases where the spelling difference is purely orthographic — not a difference in meaning or pronunciation. The banking document is the same concept in both varieties."}, {"type": "mcq", "q": "Which of these is spelled the SAME in both BrE and AmE?", "options": ["Travelling/Traveling", "Mould/Mold", "International", "Colour/Color"], "answer": 2, "explanation": "'INTERNATIONAL' is spelled identically in both BrE and AmE. The -OUR/-OR (colour/color), consonant doubling (travelling/traveling), and -OUR/-O (mould/mold) differences don't apply here. Many common words — especially academic and technical vocabulary — are spelled identically in both varieties."}, {"type": "mcq", "q": "BrE 'grey' vs AmE 'gray' — what type of difference is this?", "options": ["Suffix difference", "VOWEL SPELLING DIFFERENCE: 'ey' (BrE: grey) vs 'ay' (AmE: gray) — different vowel letter combinations for the same sound", "Consonant difference", "No real difference"], "answer": 1, "explanation": "'GREY' (BrE) / 'GRAY' (AmE) = VOWEL SPELLING DIFFERENCE. Both represent the same vowel sound /eɪ/. This is not a systematic suffix pattern but an individual word difference. Similarly: BrE 'kerb' / AmE 'curb'; BrE 'tyre' / AmE 'tire.' Some differences are word-specific rather than pattern-based."}, {"type": "fill", "q": "BrE spelling: 'She has a ________ to drive.' (AmE: 'license' as a noun)", "answer": "licence", "hint": "BrE uses -ce for the noun; -se for the verb...", "explanation": "BrE: LICENCE (noun) / LICENSE (verb). 'She has a LICENCE to drive' (noun). 'They LICENSED the drug' (verb). AmE uses 'license' for both noun and verb. This BrE noun/verb spelling distinction (-CE noun / -SE verb) also applies to: practice (noun) / practise (verb) in BrE."}, {"type": "tf", "q": "The Oxford English Dictionary accepts both -ise and -ize spellings for verbs like 'organise/organize' in British English.", "answer": true, "explanation": "True. OED -IZE PREFERENCE: The Oxford English Dictionary actually PREFERS -IZE (organize, recognize, realize) as etymologically correct for BrE. However, -ISE is more widespread in everyday BrE usage. Both are accepted. The choice between -ise and -ize in British English is a style guide preference, not a right/wrong distinction."}, {"type": "mcq", "q": "'Fulfil' (BrE) vs 'fulfill' (AmE) — what pattern does this represent?", "options": ["The -OUR/-OR pattern", "FINAL -L DOUBLING: BrE 'fulfil' (single l) becomes 'fulfils, fulfilled, fulfilling'; AmE 'fulfill' has double l in the base form", "The -ISE/-IZE pattern", "A vowel difference"], "answer": 1, "explanation": "'FULFIL' (BrE) / 'FULFILL' (AmE). Also: BrE 'enrol, enthral, instil' / AmE 'enroll, enthrall, instill.' AmE doubles the final -l in the base form; BrE keeps single -l. (Note: BrE then doubles when adding suffixes: fulfilled, fulfilling.) This is the reverse of the 'travelled/traveled' pattern."}, {"type": "mcq", "q": "Which word has a BrE/AmE difference involving -OE- vs -E-?", "options": ["Colour/Color", "Foetus/Fetus", "Centre/Center", "Behaviour/Behavior"], "answer": 1, "explanation": "'FOETUS' (BrE) / 'FETUS' (AmE). The -OE-/-E- pattern: BrE 'oestrogen, paediatric, anaemia' / AmE 'estrogen, pediatric, anemia.' BrE retains classical Greek/Latin -OE- and -AE- diphthong spellings; AmE simplifies to single vowel. Medical and scientific vocabulary shows many of these differences."}, {"type": "mcq", "q": "'Mum' (BrE) vs 'Mom' (AmE) — is this a spelling difference or a vocabulary difference?", "options": ["Spelling difference only", "BOTH: different spellings AND different word forms for the informal word for 'mother' — though both derive from the same origin", "Vocabulary difference only", "Neither — they are the same word"], "answer": 1, "explanation": "'MUM' (BrE) / 'MOM' (AmE) = a difference in both FORM and SPELLING. They are related words from the same root but have developed differently in each variety. Similarly: 'nappy' (BrE) / 'diaper' (AmE) = vocabulary difference. 'Mum/Mom' is borderline — same informal word, different form in each variety."}, {"type": "mcq", "q": "'Draught' (BrE) vs 'draft' (AmE) — which senses share this BrE/AmE difference?", "options": ["The spelling is always the same", "BrE uses 'draught' for the beer/cold air sense; AmE uses 'draft' for all senses including 'draft beer' and 'draft of a document'", "They are completely different words", "'Draught' is archaic"], "answer": 1, "explanation": "'DRAUGHT' (BrE) / 'DRAFT' (AmE). In BrE: 'draught beer', 'in a draught' (cold air). In AmE: 'draft beer', 'draft of wind'. For documents: BrE 'draft' is also used ('a draft of a letter'). 'Draught/draft' is one of many cases where BrE retains the older spelling and AmE simplifies."}, {"type": "tf", "q": "Consistency in spelling within a single document is more important than which variety is used.", "answer": true, "explanation": "True. CONSISTENCY IS KEY: Whether you write 'colour' or 'color', 'travelled' or 'traveled', 'analyse' or 'analyze' — the most important rule is CONSISTENCY within a text. Mixing varieties (colour in one paragraph, color in the next) signals poor language control. Choose one variety and maintain it throughout."}, {"type": "mcq", "q": "Which suffix pattern is used to distinguish BrE 'practice' (noun) from 'practise' (verb)?", "options": ["The -ISE/-IZE pattern", "The -CE (NOUN) / -SE (VERB) PATTERN in British English only — American English uses 'practice' for both noun and verb", "The -OUR/-OR pattern", "The -RE/-ER pattern"], "answer": 1, "explanation": "BrE -CE/-SE NOUN/VERB DISTINCTION: PRACTISE (verb) / PRACTICE (noun). Also: LICENCE (noun) / LICENSE (verb). In AmE: 'practice' serves as both noun and verb; 'license' serves as both. This BrE distinction is important in formal writing: 'She practices medicine' (verb — BrE: practises); 'Her practice is busy' (noun — both varieties: practice)."}];
var SKEY="m12_l2",NEXT="q12-3.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
