var Q=[{"type": "mcq", "q": "What is a MIXED CONDITIONAL?", "options": ["A conditional with two different conjunctions", "A conditional that mixes time frames — typically combining elements of the second and third conditionals", "A conditional in both active and passive voice", "A conditional using 'if' and 'when'"], "answer": 1, "explanation": "MIXED CONDITIONAL = combines DIFFERENT TIME FRAMES. Most commonly: (1) PAST CONDITION + PRESENT RESULT: 'If she had studied (past), she would be a doctor now (present).' (2) PRESENT CONDITION + PAST RESULT: 'If she were more careful (present), she wouldn't have made that mistake (past).'"}, {"type": "mcq", "q": "'If she had taken the job offer, she would be in New York now.' This is a mixed conditional combining:", "options": ["Zero and first conditional", "Second and third conditional", "PAST CONDITION (if + past perfect) + PRESENT RESULT (would + base verb)", "First and second conditional"], "answer": 2, "explanation": "TYPE 1 MIXED CONDITIONAL: IF + PAST PERFECT (condition in the past — she didn't take the offer) + WOULD + BASE VERB (present result — she's not in New York now). Past failure to act → present different situation. The most common mixed conditional type."}, {"type": "tf", "q": "Mixed conditionals are used when the condition and result belong to DIFFERENT time frames.", "answer": true, "explanation": "True. DIFFERENT TIME FRAMES = mixed conditional. Standard conditionals keep condition and result in the same time frame. Mixed conditionals occur when: a PAST condition affects the PRESENT, or a PRESENT condition is projected onto a PAST result."}, {"type": "mcq", "q": "'If she were more confident, she would have spoken up at the meeting.' This mixed conditional shows:", "options": ["A past condition causing a present result", "A PRESENT CONDITION (she isn't confident) causing a PAST RESULT (she didn't speak up)", "A future possibility", "A zero conditional truth"], "answer": 1, "explanation": "TYPE 2 MIXED CONDITIONAL: IF + PAST SIMPLE/WERE (present character/state — she isn't confident NOW) + WOULD HAVE + PAST PARTICIPLE (past result — she didn't speak up at the specific past meeting). Present character → past consequence."}, {"type": "fill", "q": "'If he ________ (study) medicine, he ________ (be) a doctor now.' Mixed conditional — past condition, present result.", "answer": "had studied / would be", "hint": "Past perfect in if-clause; would + base verb in result...", "explanation": "'If he HAD STUDIED medicine, he WOULD BE a doctor now.' MIXED CONDITIONAL: had studied (past perfect — he didn't study medicine in the past) + would be (present — he isn't a doctor now). Past action → present state."}, {"type": "mcq", "q": "'If I hadn't lost my job, I wouldn't be struggling financially now.' This mixed conditional expresses:", "options": ["A future prediction", "The ongoing PRESENT CONSEQUENCE of a PAST EVENT (job loss affects current financial situation)", "A zero conditional truth", "A second conditional hypothesis"], "answer": 1, "explanation": "MIXED CONDITIONAL: PAST EVENT (if I hadn't lost my job — I DID lose it) → PRESENT CONSEQUENCE (I am struggling now). The past event (job loss) is the cause of the current situation. This is the most common mixed conditional: past unreal condition → current real/unreal consequence."}, {"type": "mcq", "q": "'If she were a native speaker, she would have understood the joke immediately.' What does WERE signal?", "options": ["Past tense of 'be'", "Present/permanent condition (she isn't a native speaker — this is her current state)", "Future possibility", "Past ability"], "answer": 1, "explanation": "'IF SHE WERE a native speaker' = PRESENT/PERMANENT CONDITION (she isn't one). 'She WOULD HAVE UNDERSTOOD' = PAST RESULT (at that specific past moment, the joke). Present character/state → specific past consequence. Second + third conditional mixed."}, {"type": "tf", "q": "Mixed conditionals are less common than standard conditionals but occur naturally when discussing past actions and their ongoing present effects.", "answer": true, "explanation": "True. Mixed conditionals arise NATURALLY when: past decisions affect the present ('If I had saved money, I would be wealthy now'), or present characteristics explain past behaviour ('If she were kinder, she wouldn't have said that'). They express real-world cause-effect across time."}, {"type": "mcq", "q": "'If they had invested earlier, the company would be profitable by now.' The time frames are:", "options": ["Both present", "Past condition + present result", "Both past", "Present condition + past result"], "answer": 1, "explanation": "PAST CONDITION + PRESENT RESULT: 'if they HAD INVESTED earlier' (past — they didn't) + 'the company WOULD BE profitable by now' (present — it isn't). The past failure to invest causes the current lack of profitability."}, {"type": "mcq", "q": "Which sentence is a MIXED CONDITIONAL?", "options": ["If she had studied, she would have passed.", "If he were honest, he wouldn't have lied to us.", "If you heat water, it boils.", "If it rains, we'll cancel."], "answer": 1, "explanation": "'If he WERE HONEST (present state — he isn't honest), he WOULDN'T HAVE LIED to us (past event).' MIXED CONDITIONAL: present condition + past result. The others: third conditional (had studied/would have passed), zero conditional (heat/boils), first conditional (rains/cancel)."}, {"type": "mcq", "q": "'I would be fluent in French now if I had continued with lessons.' Rewrite in standard order:", "options": ["If I had continued with lessons, I would be fluent in French now.", "If I continued with lessons, I would be fluent.", "If I had continued with lessons, I would have been fluent.", "If I were fluent, I would have continued."], "answer": 0, "explanation": "REORDERED: 'IF I HAD CONTINUED with lessons, I WOULD BE FLUENT in French now.' Mixed conditional with if-clause first. 'Had continued' = past perfect (past condition); 'would be' = present result. Same meaning, different word order. With if-clause first, add comma."}, {"type": "fill", "q": "'If she ________ (be) more organised, she ________ (not miss) the deadline yesterday.' Present condition + past result.", "answer": "were / wouldn't have missed", "hint": "Were (present condition); would + not + have + past participle (past result)...", "explanation": "'If she WERE more organised (present — she isn't), she WOULDN'T HAVE MISSED the deadline yesterday (past).' Mixed: present character → past specific event consequence. Her present lack of organisation explains the past mistake."}, {"type": "tf", "q": "'If I had been born in a different country, my life would look very different now' uses a mixed conditional.", "answer": true, "explanation": "True. 'IF I HAD BEEN BORN' (past condition — unchangeable) + 'MY LIFE WOULD LOOK different NOW' (present result). Classic mixed conditional: an unrealised past event (being born elsewhere) projected onto the present (different current life). Past → present."}, {"type": "mcq", "q": "What does the mixed conditional 'If she hadn't helped, we wouldn't be here today' convey?", "options": ["Criticism of her unhelpfulness", "Deep gratitude — her past help has a lasting positive present effect", "A prediction about the future", "A zero conditional truth"], "answer": 1, "explanation": "MIXED CONDITIONAL OF GRATITUDE: 'if she HADN'T HELPED' = she DID help. 'We WOULDN'T BE HERE today' = we ARE here because of her. Past positive action → positive present state. Expresses ongoing gratitude for past help whose effects continue into the present."}, {"type": "mcq", "q": "'If you had listened to the doctor, you might be feeling better now.' MIGHT BE expresses:", "options": ["Certainty about the present result", "A less certain present result — feeling better is possible but not guaranteed", "Past ability", "Future prediction"], "answer": 1, "explanation": "'MIGHT BE feeling better' = UNCERTAIN PRESENT RESULT. 'Would be' = certain result. 'Might be' = possible but uncertain. In mixed conditionals, the result clause can use 'would', 'could', or 'might' with the base verb (for present results), each expressing different levels of certainty."}, {"type": "mcq", "q": "Which correctly identifies a TYPE 2 mixed conditional (present → past)?", "options": ["If she had eaten breakfast, she would feel better now.", "If he were more patient, he wouldn't have snapped at her yesterday.", "If they had invested, the company would be profitable.", "If I had taken the job, I would be living in London."], "answer": 1, "explanation": "TYPE 2 MIXED (PRESENT CONDITION → PAST RESULT): 'If he WERE more patient (he isn't patient NOW — present) + he WOULDN'T HAVE SNAPPED AT HER yesterday (past event).' Present character → past specific consequence. The others are Type 1 (past condition → present result)."}, {"type": "mcq", "q": "'If it hadn't rained yesterday, we would be on the beach right now.' This shows:", "options": ["Zero conditional logic", "How a PAST WEATHER EVENT (rain) determines the CURRENT SITUATION (not on the beach)", "Second conditional imagining", "A future plan"], "answer": 1, "explanation": "MIXED CONDITIONAL: PAST EVENT → PRESENT STATE. 'If it hadn't RAINED YESTERDAY' (it did rain) → 'we WOULD BE ON THE BEACH right now' (we aren't). The past rain prevents the current beach visit. Past event → current situation — the classic use of mixed conditionals in real life."}];
var SKEY="m9_l5",NEXT="q9-6.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
