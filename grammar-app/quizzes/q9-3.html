var Q=[{"type": "mcq", "q": "What is the structure of the SECOND CONDITIONAL?", "options": ["If + present simple, will + base verb", "If + past simple, would + base verb", "If + past perfect, would have + past participle", "If + present perfect, would + base verb"], "answer": 1, "explanation": "SECOND CONDITIONAL = IF + PAST SIMPLE, WOULD + BASE VERB. 'If I had more money, I would travel the world.' Used for UNREAL or HYPOTHETICAL present/future situations — the condition is either impossible or very unlikely."}, {"type": "mcq", "q": "'If I were a bird, I would fly to the sea.' What does WERE express?", "options": ["Simple past tense of 'be'", "The SUBJUNCTIVE form of 'be' — used in formal second conditionals for all persons", "A mistake — 'was' is correct", "Past continuous"], "answer": 1, "explanation": "'WERE' = SUBJUNCTIVE in second conditionals. 'If I were...' 'If she were...' 'If he were...' — formal/standard grammar uses 'were' for ALL persons in second conditional if-clauses. 'Was' is acceptable in informal speech: 'If I was a bird...' — but 'were' is preferred in formal writing."}, {"type": "tf", "q": "The second conditional describes situations that are UNREAL, IMAGINARY, or VERY UNLIKELY in the present or future.", "answer": true, "explanation": "True. SECOND CONDITIONAL = UNREAL/HYPOTHETICAL. 'If I were the president, I would...' (I'm not the president). 'If I had a million pounds, I'd...' (I don't). The past simple in the if-clause signals UNREALITY — the speaker is imagining, not predicting."}, {"type": "mcq", "q": "'If she knew the answer, she would tell you.' What does this imply?", "options": ["She will tell you the answer", "She DOESN'T know the answer — the situation is contrary to fact", "She might find out the answer", "She knew in the past"], "answer": 1, "explanation": "SECOND CONDITIONAL IMPLIES CONTRARY-TO-FACT: 'If she knew' = SHE DOESN'T KNOW (the condition is not met). The would-result is therefore not happening either. Second conditionals describe what WOULD happen if the (unreal) condition WERE true."}, {"type": "fill", "q": "'If he ________ (work) harder, he would get promoted.' Complete with second conditional.", "answer": "worked", "hint": "Past simple in the if-clause (but it's unreal)...", "explanation": "'If he WORKED harder, he would get promoted.' Second conditional: past simple ('worked') in if-clause. But 'worked' here is NOT past tense — it signals UNREALITY (he doesn't actually work hard). This is the subjunctive/hypothetical use of past simple."}, {"type": "mcq", "q": "'If I had more time, I could learn a new language.' COULD expresses:", "options": ["Certainty", "A present ability that would exist if the condition were met", "Past ability", "A polite request"], "answer": 1, "explanation": "'I COULD learn' = CONDITIONAL ABILITY — if I had the time, I would HAVE THE ABILITY/OPPORTUNITY to learn. 'Could' in second conditional result clauses expresses possible ability or opportunity: 'If she were here, she could help.' 'Could' = 'would be able to.'"}, {"type": "mcq", "q": "'What would you do if you won the lottery?' This is:", "options": ["First conditional — winning is possible", "Zero conditional — a universal truth", "Second conditional — a hypothetical question about an unlikely/imaginary situation", "Third conditional — past regret"], "answer": 2, "explanation": "SECOND CONDITIONAL HYPOTHETICAL QUESTION: winning the lottery is possible but treated as a hypothetical/unlikely scenario for discussion. 'What would you do IF YOU WON?' invites imaginative thinking. Common in conversation for hypothetical scenarios."}, {"type": "tf", "q": "'If I were you, I would apologise' is a fixed second conditional expression used to give advice.", "answer": true, "explanation": "True. 'IF I WERE YOU, I WOULD...' = fixed second conditional ADVICE FORMULA. The speaker imagines being in the other person's position. 'Were' is used (not 'was') in this fixed expression, even in informal English. Always followed by 'I would + advice.'"}, {"type": "mcq", "q": "'She would be happier if she had a better job.' This is second conditional because:", "options": ["It uses 'would be' in the result clause", "She doesn't have a better job — the condition is unreal/contrary to fact, and the past simple shows hypotheticality", "It refers to the past", "It is a first conditional with 'would' instead of 'will'"], "answer": 1, "explanation": "SECOND CONDITIONAL: 'if she had' (past simple for UNREALITY — she doesn't have a better job). 'Would be happier' = the hypothetical result. The speaker is imagining a different present reality. PAST SIMPLE in if-clause = hypothetical, not past time."}, {"type": "mcq", "q": "What is the difference between: 'If it rains, I'll stay home' and 'If it rained, I would stay home'?", "options": ["No meaningful difference", "First = real future possibility; second = hypothetical/unlikely (speaker doesn't expect it to rain)", "First is past; second is future", "First is more formal"], "answer": 1, "explanation": "FIRST CONDITIONAL 'If it RAINS' = real possibility (it might rain). SECOND CONDITIONAL 'If it RAINED' = hypothetical/unlikely (the speaker doesn't really expect it to rain). The tense signals the speaker's view of how likely the condition is."}, {"type": "mcq", "q": "'If we didn't have rules, society would collapse.' This second conditional describes:", "options": ["A past situation", "A real future possibility", "A hypothetical — we do have rules, but the speaker imagines what would happen without them", "A zero conditional truth"], "answer": 2, "explanation": "SECOND CONDITIONAL for COUNTERFACTUAL REASONING: 'We DO have rules' — the speaker imagines the opposite to show their value. 'If we didn't have rules' (we do) → 'society would collapse' (it doesn't). Using second conditional to reason about the importance of something real."}, {"type": "fill", "q": "'I ________ (travel) more if I ________ (have) more holiday time.' Complete with second conditional.", "answer": "would travel / had", "hint": "Would + base verb (result); past simple (if-clause)...", "explanation": "'I WOULD TRAVEL more if I HAD more holiday time.' Second conditional: WOULD + BASE VERB in result clause; PAST SIMPLE in if-clause. The situation is unreal — the speaker doesn't have enough holiday time."}, {"type": "tf", "q": "In spoken English, 'If I was you' is commonly heard, even though formal grammar requires 'If I were you.'", "answer": true, "explanation": "True. Informal spoken English: 'If I WAS you' is widely used. Formal/standard grammar: 'If I WERE you.' Both are understood. 'Were' is the traditional SUBJUNCTIVE form for all persons in hypothetical if-clauses. Formal writing and exams typically require 'were.'"}, {"type": "mcq", "q": "'He would understand if he listened more carefully.' What does this imply?", "options": ["He listens carefully", "He DOESN'T listen carefully — hence he doesn't understand (contrary to present fact)", "He will listen in the future", "He understood in the past"], "answer": 1, "explanation": "SECOND CONDITIONAL IMPLICATION: 'if he listened' (he doesn't) → 'he would understand' (he doesn't currently). The second conditional reveals the current reality by showing its hypothetical opposite. He doesn't listen → he doesn't understand."}, {"type": "mcq", "q": "Which is a second conditional?", "options": ["If you press the button, the machine starts.", "If it snows, we will build a snowman.", "If I lived in Paris, I would visit the Louvre every week.", "If she had arrived earlier, she would have met him."], "answer": 2, "explanation": "'If I LIVED in Paris, I WOULD visit...' = SECOND CONDITIONAL (hypothetical — I don't live in Paris). The others: zero conditional (button/machine), first conditional (snow/snowman), third conditional (had arrived/would have met)."}, {"type": "mcq", "q": "'She wouldn't say that if she really meant it.' What second conditional meaning is expressed?", "options": ["She said it and means it", "The speaker implies she doesn't really mean it (unreal condition)", "A future possibility", "A past event"], "answer": 1, "explanation": "SECOND CONDITIONAL FOR INFERENCE: 'if she REALLY MEANT IT, she WOULDN'T SAY THAT' (but she did say it) — implying she doesn't really mean it. The second conditional creates a logical inference about what is actually true based on what someone has done."}, {"type": "mcq", "q": "Can the second conditional result clause use 'might' instead of 'would'?", "options": ["No — only 'would' is correct", "Yes — 'might' suggests a possible but uncertain result: 'If she studied, she might pass'", "Only 'could' can replace 'would'", "No — 'would' is mandatory in all conditionals"], "answer": 1, "explanation": "'MIGHT' IN SECOND CONDITIONAL: 'If she studied, she MIGHT pass' = less certain than 'would pass.' 'Might' suggests a possibility, not a certainty. 'Could' expresses ability. 'Would' expresses the default certain outcome. All three are grammatically correct in the result clause."}, {"type": "tf", "q": "'Were I in your position, I would do the same' is a formal inverted second conditional.", "answer": true, "explanation": "True. 'WERE I in your position' = INVERTED SECOND CONDITIONAL (formal/literary). 'If I were in your position' → 'WERE I in your position.' Inversion: WERE + subject (no 'if' needed). This is a formal alternative to the standard 'if' construction."}];
var SKEY="m9_l3",NEXT="q9-4.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
