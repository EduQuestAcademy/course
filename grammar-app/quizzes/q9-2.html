var Q=[{"type": "mcq", "q": "What is the structure of the FIRST CONDITIONAL?", "options": ["If + past simple, would + base verb", "If + present simple, will + base verb", "If + past perfect, would have + past participle", "If + present perfect, will have + past participle"], "answer": 1, "explanation": "FIRST CONDITIONAL = IF + PRESENT SIMPLE, WILL + BASE VERB. 'If it rains tomorrow, we will cancel the picnic.' Used for REAL AND POSSIBLE future situations — the condition is genuinely possible or likely."}, {"type": "mcq", "q": "'If she studies hard, she will pass the exam.' This expresses:", "options": ["A universal truth", "A real and possible future outcome based on her action", "A hypothetical/unreal situation", "A past regret"], "answer": 1, "explanation": "FIRST CONDITIONAL — REAL POSSIBLE FUTURE. The speaker considers studying hard a genuine possibility, and passing is the likely result. The condition might or might not happen — but it is realistic."}, {"type": "tf", "q": "In the first conditional, the if-clause uses PRESENT SIMPLE, not 'will', even though it refers to the future.", "answer": true, "explanation": "True. CRITICAL RULE: If-clause uses PRESENT SIMPLE for future reference: 'If it RAINS tomorrow' (not 'if it will rain'). 'Will' goes in the RESULT clause: 'we WILL cancel.' This is a common error — learners often write 'if it will rain', which is wrong."}, {"type": "mcq", "q": "'If you don't hurry, you will miss the train.' What does this first conditional express?", "options": ["A regret about missing the train", "A realistic warning about a possible future consequence", "An impossible situation", "A scientific fact"], "answer": 1, "explanation": "FIRST CONDITIONAL WARNING: if you (genuinely) don't hurry, missing the train is a real future possibility. First conditionals are often used for WARNINGS, PREDICTIONS, OFFERS, and PROMISES about real possible futures."}, {"type": "fill", "q": "'If she ________ (arrive) on time, we will start without her.' Complete the if-clause.", "answer": "doesn't arrive", "hint": "Present simple negative in the if-clause...", "explanation": "'If she DOESN'T ARRIVE on time, we will start without her.' FIRST CONDITIONAL negative: if + present simple negative (doesn't arrive) + will + base verb. The condition is real and possible — she might be late."}, {"type": "mcq", "q": "Can the result clause in a first conditional use modals other than 'will'?", "options": ["No — only 'will' is allowed", "Yes — can, may, might, should, could can replace 'will' to vary the certainty", "Only 'shall' can replace 'will'", "No — only imperatives can replace 'will'"], "answer": 1, "explanation": "FIRST CONDITIONAL RESULT CLAUSE VARIATIONS: 'If it rains, we CAN stay inside' (ability/permission). 'If you study, you MIGHT pass' (less certain). 'If she calls, you SHOULD answer' (advice). 'If you need help, CALL ME' (imperative). Many result clause forms are possible."}, {"type": "mcq", "q": "'If you will help me, I will be very grateful.' Is this correct?", "options": ["Yes — 'will' can be used in both clauses", "No — 'will' in the if-clause is wrong. Use present simple: 'If you help me...' unless expressing willingness", "Yes — this is a common British pattern", "No — use 'would' instead of 'will'"], "answer": 1, "explanation": "'IF YOU WILL HELP ME' — generally WRONG for a standard first conditional. Use PRESENT SIMPLE: 'If you HELP me...' Exception: 'will' in the if-clause CAN express WILLINGNESS/REQUEST: 'If you will please wait...' (= if you are willing to wait). But this is formal and different from a condition."}, {"type": "tf", "q": "'Unless you hurry, you will be late' is a first conditional using UNLESS (= if not).", "answer": true, "explanation": "True. UNLESS = IF NOT. 'UNLESS you hurry, you will be late' = 'If you DON'T hurry, you will be late.' First conditional with 'unless' is very common: 'Unless she apologises, I won't forgive her.' Unless always introduces a negative condition."}, {"type": "mcq", "q": "'If I see her, I'll give her your message.' What does the first conditional imply?", "options": ["I definitely will not see her", "Seeing her is a real possibility — I might see her and I'll pass on the message", "I definitely will see her", "I would like to see her but cannot"], "answer": 1, "explanation": "FIRST CONDITIONAL IMPLIES REAL POSSIBILITY: 'If I see her' = there's a chance I might see her (uncertain but possible). The message will be delivered IF this meeting happens. First conditional = real world, genuine possibility."}, {"type": "mcq", "q": "Which first conditional sentence uses an IMPERATIVE in the result clause?", "options": ["If you're tired, you will rest.", "If you're tired, rest.", "If you were tired, you would rest.", "If you had been tired, you would have rested."], "answer": 1, "explanation": "'If you're tired, REST.' IMPERATIVE RESULT CLAUSE: the result clause uses a base verb as a command/instruction. First conditional + imperative = advice, instructions, warnings: 'If you see smoke, call 999.' 'If you need help, ask me.' Very common for giving directions."}, {"type": "mcq", "q": "'If it stops raining, we can go for a walk.' What does CAN express in this result clause?", "options": ["Certainty", "Possibility/ability (we will have the opportunity)", "Obligation", "Past ability"], "answer": 1, "explanation": "'We CAN go' = POSSIBILITY/ABILITY in the result clause. If the rain stops, we will HAVE THE OPPORTUNITY/ABILITY to walk. 'Can' in first conditional result clause expresses availability of an option: 'If she arrives early, she can help us set up.'"}, {"type": "fill", "q": "'If you ________ (not finish) your homework, you cannot go out.' First conditional.", "answer": "don't finish", "hint": "Present simple negative in if-clause...", "explanation": "'If you DON'T FINISH your homework, you cannot go out.' First conditional: present simple negative in if-clause + result clause (can't = negative ability). A realistic parent/teacher condition."}, {"type": "tf", "q": "'Provided that you meet the deadline, we will process your application' uses an alternative to 'if' in a first conditional.", "answer": true, "explanation": "True. 'PROVIDED THAT' = alternative to 'if' for conditions: same structure as first conditional. 'Provided that you meet the deadline, we will process...' The condition is real and possible. Other alternatives: 'as long as', 'on condition that', 'so long as.'"}, {"type": "mcq", "q": "'If she doesn't get the job, she'll be very disappointed.' This is:", "options": ["Zero conditional — a universal truth", "First conditional — a real future possibility with emotional consequence", "Second conditional — an unreal situation", "Third conditional — past regret"], "answer": 1, "explanation": "FIRST CONDITIONAL — REAL FUTURE EMOTIONAL CONSEQUENCE. Not getting the job is a real possibility; the disappointment would be the genuine emotional result. First conditionals include predictions about emotional states and personal consequences."}, {"type": "mcq", "q": "What happens to the word order when the result clause comes FIRST?", "options": ["A comma is still required before the if-clause", "No comma is needed when the result clause comes first (If-clause second = no comma)", "The meaning changes", "'If' must be replaced by 'when'"], "answer": 1, "explanation": "WORD ORDER: If-clause FIRST needs COMMA: 'If it rains, we'll cancel.' Result clause FIRST needs NO COMMA: 'We'll cancel if it rains.' This applies to all conditional types. The comma rule follows from the position of the if-clause."}, {"type": "mcq", "q": "'If the project succeeds, it will change the industry.' The speaker implies:", "options": ["The project has already succeeded", "Success is impossible", "Success is genuinely possible — the conditional outcome is realistic", "The project is purely hypothetical"], "answer": 2, "explanation": "FIRST CONDITIONAL = REAL POSSIBILITY. The speaker believes project success is GENUINELY POSSIBLE (even if uncertain). The industry change is the realistic anticipated result. First conditional signals the speaker's belief in the condition's plausibility."}, {"type": "tf", "q": "'If you happen to see her, could you tell her I called?' uses a first conditional with 'could' in the result clause.", "answer": true, "explanation": "True. 'If you HAPPEN TO SEE her, COULD you tell her I called?' — 'could' in the result clause makes the request POLITE. First conditional + 'could' = polite request about a possible future situation. 'Happen to' softens the condition: it's possible but not expected."}, {"type": "mcq", "q": "Which sentence is a FIRST CONDITIONAL?", "options": ["If I were you, I would apologise.", "If he had known, he would have called.", "If you need anything, just call me.", "If water reaches 0°C, it freezes."], "answer": 2, "explanation": "'If you NEED anything, just CALL me.' FIRST CONDITIONAL: present simple + imperative (result). Real and possible future situation — giving a genuine offer/instruction. The others: second conditional ('were', 'would'), third conditional ('had known', 'would have called'), zero conditional (universal truth)."}, {"type": "mcq", "q": "'I'll help you if you ask nicely.' What does this first conditional offer imply?", "options": ["I will definitely help regardless", "Help depends on asking nicely — the condition must be fulfilled", "I cannot help under any circumstances", "I helped in the past"], "answer": 1, "explanation": "CONDITIONAL OFFER: help is CONTINGENT on asking nicely. The condition (asking nicely) must be met for the result (help) to occur. First conditionals for offers: 'I'll come if you want me to.' 'She'll explain if you ask her.'"}];
var SKEY="m9_l2",NEXT="q9-3.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
