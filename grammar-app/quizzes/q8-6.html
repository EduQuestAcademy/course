var Q=[{"type": "mcq", "q": "What is a REDUCED relative clause?", "options": ["A relative clause with no meaning", "A relative clause shortened by removing the relative pronoun and auxiliary verb, leaving a participle or adjective", "A relative clause with a missing object", "A relative clause that uses 'that'"], "answer": 1, "explanation": "A REDUCED RELATIVE CLAUSE is formed by removing the RELATIVE PRONOUN + AUXILIARY VERB and replacing the verb with a PARTICIPLE (present or past): 'The man WHO IS STANDING by the door' → 'The man STANDING by the door.' Only defining relative clauses can typically be reduced."}, {"type": "mcq", "q": "'The letter which was written in French was hard to understand.' Reduce the relative clause:", "options": ["The letter which in French was hard to understand.", "The letter written in French was hard to understand.", "The letter, written in French, was hard to understand.", "The letter to be written in French was hard to understand."], "answer": 1, "explanation": "'The letter WRITTEN IN FRENCH was hard to understand.' Passive relative clause reduction: remove 'which was' and keep the past participle 'written.' PAST PARTICIPLE is used for PASSIVE reduced relative clauses (the letter was written = passive)."}, {"type": "tf", "q": "Active relative clauses are reduced using the PRESENT participle (-ing form).", "answer": true, "explanation": "True. ACTIVE RELATIVE CLAUSE REDUCTION: 'The man WHO IS TALKING to her' → 'The man TALKING to her.' Remove 'who is' and keep the -ing form. 'The children WHO WERE PLAYING in the garden' → 'The children PLAYING in the garden.'"}, {"type": "mcq", "q": "'The students who study at this university come from 50 countries.' Reduce the relative clause:", "options": ["The students studying at this university come from 50 countries.", "The students studied at this university come from 50 countries.", "The students to study at this university come from 50 countries.", "The students study at this university come from 50 countries."], "answer": 0, "explanation": "'The students STUDYING at this university come from 50 countries.' Active reduction: remove 'who' and change 'study' to 'studying' (-ing present participle). Simple present active → present participle in reduced form."}, {"type": "fill", "q": "'The package which was delivered this morning is on your desk.' Reduced: 'The package ________ this morning is on your desk.'", "answer": "delivered", "hint": "Passive: remove 'which was' + keep past participle...", "explanation": "'The package DELIVERED this morning is on your desk.' PASSIVE REDUCTION: remove 'which was' and keep the past participle 'delivered.' The reduced form begins directly with the past participle (no auxiliary)."}, {"type": "mcq", "q": "'Anyone who wants to apply should submit a form.' Reduce the relative clause:", "options": ["Anyone wanting to apply should submit a form.", "Anyone wanted to apply should submit a form.", "Anyone to want to apply should submit a form.", "Anyone who wanting to apply should submit a form."], "answer": 0, "explanation": "'Anyone WANTING TO APPLY should submit a form.' Active reduction: remove 'who' and change 'wants' to 'wanting' (-ing). 'Wanting to apply' = reduced active relative clause. Present participle replaces the full relative clause."}, {"type": "mcq", "q": "When can a relative clause be reduced to a TO-INFINITIVE?", "options": ["Always", "When the relative clause has a modal (first/only/last + to do, or expresses purpose/suitability)", "Only in the passive", "When the antecedent is a person"], "answer": 1, "explanation": "TO-INFINITIVE REDUCTION: used after superlatives and 'first/last/only': 'The first person TO ARRIVE' (= who arrived first). Also for PURPOSE/SUITABILITY: 'a house TO RENT' (= that can be rented). 'She was the best student TO WIN the prize.'"}, {"type": "tf", "q": "Non-defining relative clauses can generally be reduced in the same way as defining clauses.", "answer": false, "explanation": "False. NON-DEFINING relative clauses are RARELY reduced in standard usage. 'My father, who is a doctor, lives in London' → 'My father, a doctor, lives in London' (appositive, not a reduced relative). The full 'who is' reduction is less standard for non-defining clauses."}, {"type": "mcq", "q": "'The items listed below require attention.' What was the original full relative clause?", "options": ["The items which list below require attention.", "The items which are listed below require attention.", "The items which have listed below require attention.", "The items listing below require attention."], "answer": 1, "explanation": "'The items LISTED BELOW' = reduced from 'the items WHICH ARE LISTED below.' Passive reduction: 'which are' removed; past participle 'listed' kept. Very common in formal and written English: 'the information provided', 'the documents required', 'the issues raised.'"}, {"type": "mcq", "q": "'Residents living near the airport complained about noise.' What type of reduction is this?", "options": ["Passive reduction (past participle)", "Active reduction (present participle)", "To-infinitive reduction", "Appositive reduction"], "answer": 1, "explanation": "'LIVING near the airport' = ACTIVE REDUCTION. Full form: 'Residents WHO LIVE/ARE LIVING near the airport.' 'Who live/are living' → 'living.' Present participle marks active voice. The residents perform the action (living)."}, {"type": "mcq", "q": "'She was the last person to leave the office.' 'To leave' is a reduced relative clause. The full form is:", "options": ["She was the last person who left the office.", "She was the last person who was leaving.", "She was the last person who to leave.", "She was the last person which left."], "answer": 0, "explanation": "'She was the last person TO LEAVE' = reduced from 'the last person WHO LEFT.' TO-INFINITIVE REDUCTION after 'last' (and first, only, best, next). These superlative/ordinal antecedents commonly take to-infinitive reduced relatives."}, {"type": "fill", "q": "'The conference, ________ last week, attracted 500 delegates.' Complete with a reduced non-defining relative.", "answer": "held", "hint": "Passive reduced: past participle...", "explanation": "'The conference, HELD last week, attracted 500 delegates.' Reduced from: 'The conference, which was held last week, attracted 500 delegates.' Past participle 'held' = passive. Note the commas are retained from the non-defining original."}, {"type": "tf", "q": "'The man sitting at the back raised his hand' uses an active reduced relative clause.", "answer": true, "explanation": "True. 'SITTING at the back' = active present participle. Full form: 'The man WHO WAS SITTING at the back.' 'Who was' removed; 'sitting' retained. Active reduction = present participle (-ing). The man performs the sitting action."}, {"type": "mcq", "q": "'The road being repaired causes daily traffic jams.' What type of reduced relative is 'being repaired'?", "options": ["Active present participle", "Passive present participle (being + past participle)", "Past participle passive", "To-infinitive"], "answer": 1, "explanation": "'BEING REPAIRED' = PASSIVE PRESENT PARTICIPLE. Full form: 'The road WHICH IS BEING REPAIRED.' Present continuous passive → reduced to 'being + past participle.' Shows the passive action is ongoing (in progress)."}, {"type": "mcq", "q": "Can the relative pronoun be the SUBJECT and be omitted in a reduced clause? 'The woman who is smiling is my sister.'", "options": ["No — subject pronouns can never be omitted", "Yes, when we reduce: 'who is' → removed, 'smiling' kept: 'The woman smiling is my sister'", "Yes, remove 'who' but keep 'is': 'The woman is smiling is my sister'", "No — you must keep 'who'"], "answer": 1, "explanation": "CORRECT REDUCTION: 'The woman WHO IS SMILING' → 'The woman SMILING.' When the subject relative pronoun + be is removed for reduction, the main verb becomes a present participle (-ing). 'The woman smiling is my sister' is the correctly reduced form."}, {"type": "mcq", "q": "'Scientists working on the project have made a breakthrough.' The original full clause was:", "options": ["Scientists who work on the project", "Scientists who are working on the project", "Scientists worked on the project", "Scientists to work on the project"], "answer": 1, "explanation": "'Scientists WORKING on the project' = reduced from 'scientists WHO ARE WORKING on the project.' The present participle 'working' signals active and ongoing (or general habitual). 'Who are working' → 'working.'"}, {"type": "tf", "q": "Reduced relative clauses make writing more concise and are especially common in formal and written English.", "answer": true, "explanation": "True. Reduced relative clauses are VALUED IN FORMAL/WRITTEN ENGLISH for CONCISENESS: 'documents required by law' (instead of 'documents that are required by law'), 'officials attending the summit,' 'the approach taken by researchers.' They compress information efficiently."}, {"type": "mcq", "q": "'There are three issues to be addressed in this report.' What does 'to be addressed' express?", "options": ["An action in progress", "Necessity/obligation — issues that need to be addressed (passive to-infinitive)", "Past action", "Active future plan"], "answer": 1, "explanation": "'TO BE ADDRESSED' = PASSIVE TO-INFINITIVE reduced relative. Full form: 'issues THAT NEED TO BE ADDRESSED' or 'issues THAT MUST BE ADDRESSED.' Passive to-infinitive expresses necessity or intended future action: 'the problem to be solved', 'the goal to be achieved.'"}, {"type": "mcq", "q": "Which sentence correctly reduces: 'The application that was submitted late was rejected'?", "options": ["The application submitting late was rejected.", "The application submitted late was rejected.", "The application to submit late was rejected.", "The application being submit late was rejected."], "answer": 1, "explanation": "'The application SUBMITTED LATE was rejected.' PASSIVE REDUCTION: remove 'that was' and keep past participle 'submitted.' Late remains as a modifier. 'Submitting' would be active (wrong here — the application doesn't submit itself). 'Submitted' correctly indicates passive."}];
var SKEY="m8_l6",NEXT="q8-7.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Next Lesson →</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
