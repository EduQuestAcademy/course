var Q=[{"type": "mcq", "q": "'Colour' (BrE) vs 'color' (AmE) represents which spelling pattern?", "options": ["The -ISE/-IZE pattern", "The -OUR/-OR pattern", "The -RE/-ER pattern", "Consonant doubling"], "answer": 1, "explanation": "The -OUR/-OR PATTERN: BrE 'colour' → AmE 'color'; honour/honor, favour/favor, neighbour/neighbor, behaviour/behavior. Noah Webster systematically removed the 'u' in this suffix. This is one of the most visible and systematic BrE/AmE spelling differences."}, {"type": "mcq", "q": "'Pants' in British English means underwear. In American English, 'pants' means:", "options": ["The same — underwear", "Trousers — a significant false friend between the two varieties", "Shorts", "Socks"], "answer": 1, "explanation": "'PANTS' FALSE FRIEND: BrE = underpants/underwear. AmE = trousers. This is one of the most famous BrE/AmE false friends — potentially causing embarrassing miscommunication. Context usually clarifies, but awareness of this difference is essential."}, {"type": "tf", "q": "'I've just eaten' (BrE) and 'I just ate' (AmE) describe the same action using different tenses.", "answer": true, "explanation": "True. BrE uses PRESENT PERFECT with 'just/already/yet'; AmE commonly uses SIMPLE PAST in the same contexts. 'I'VE JUST EATEN' (BrE) / 'I JUST ATE' (AmE). Both are correct in their respective varieties — this is the most consistent grammatical difference between BrE and AmE."}, {"type": "mcq", "q": "BrE: 'She went to hospital.' AmE: 'She went to the hospital.' What difference is illustrated?", "options": ["Preposition difference", "ARTICLE DIFFERENCE: BrE omits 'the' before institutional nouns in their functional sense (hospital as institution); AmE uses 'the'. BrE: 'in hospital' (as patient) / 'at university' (as student). AmE: 'in THE hospital' / 'at THE university'", "Tense difference", "Vocabulary difference"], "answer": 1, "explanation": "ZERO ARTICLE vs DEFINITE ARTICLE: BrE omits 'the' when the institutional noun is used in its functional sense (being a patient, student, prisoner). AmE uses 'the' consistently. 'In hospital' vs 'in the hospital' is a reliable BrE marker."}, {"type": "mcq", "q": "Date '04/05/2025' could mean 4 May in BrE or April 5 in AmE. How should this be written unambiguously?", "options": ["04.05.2025", "04/05/2025 with a note", "4 May 2025 / May 4, 2025 (month written in full), OR ISO format: 2025-05-04", "Both are the same"], "answer": 2, "explanation": "UNAMBIGUOUS DATE FORMAT: Write the MONTH IN FULL ('4 May 2025' or 'May 4, 2025') or use ISO 8601 format (2025-05-04). Numeric-only dates (04/05/2025) are ambiguous across varieties. In international business and legal documents, always spell out the month or use ISO format."}, {"type": "fill", "q": "BrE: 'travelling' (double l). AmE spelling: '________'", "answer": "traveling", "hint": "AmE doesn't double the consonant in unstressed syllables...", "explanation": "AmE: 'TRAVELING' (single l). BrE doubles the final consonant before suffixes when the syllable is unstressed: 'travelling, cancelled, modelled, labelled.' AmE keeps the single consonant: 'traveling, canceled, modeled, labeled.' A consistent and systematic difference."}, {"type": "mcq", "q": "'The committee have decided to postpone the event.' This use of plural verb with a collective noun is characteristic of:", "options": ["American English", "BRITISH ENGLISH — BrE often uses plural verbs with collective nouns (committee, team, government, staff). AmE consistently uses singular: 'The committee HAS decided.' BrE: 'England ARE playing tonight' (sports especially)", "Both equally", "Neither — it's an error"], "answer": 1, "explanation": "PLURAL COLLECTIVE NOUNS in BrE: 'The committee HAVE decided', 'England ARE playing', 'The government ARE considering.' AmE: 'The committee HAS decided', 'England IS playing.' This is one of the most reliable grammatical markers of BrE vs AmE in sports reporting and political writing."}, {"type": "mcq", "q": "AmE places punctuation INSIDE quotation marks. BrE places it:", "options": ["Also always inside", "OUTSIDE (for punctuation not part of the quotation) — BrE: She said \"hello\". (period outside). AmE: She said \"hello.\" (period inside). This is a consistent and important difference in formal writing.", "Both styles are the same", "BrE has no quotation convention"], "answer": 1, "explanation": "PUNCTUATION PLACEMENT: AmE = INSIDE quotes: 'She said, \"hello.\"' BrE = OUTSIDE (for non-quoted punctuation): 'She said \"hello\".' This difference appears in academic papers, journalism, and formal writing. The American 'inside' rule applies consistently to commas and periods; BrE places them outside unless they are part of the quotation."}, {"type": "mcq", "q": "'Gotten' as a past participle of 'get' is used in:", "options": ["British English only", "AMERICAN ENGLISH — 'He has gotten better.' BrE uses 'got': 'He has got better.' 'Gotten' is an older form preserved in AmE but dropped from modern BrE. It is one of the clearest vocabulary/grammar markers of AmE.", "Both varieties equally", "Neither — 'gotten' is incorrect"], "answer": 1, "explanation": "'GOTTEN': distinctively AmE past participle. BrE: 'He has GOT better.' AmE: 'He has GOTTEN better.' 'Gotten' was used in older British English (hence its preservation in AmE). In modern BrE, 'gotten' sounds distinctly American and is not used."}, {"type": "mcq", "q": "'Should you require further assistance...' uses an inverted conditional that is characteristic of:", "options": ["Informal conversation", "FORMAL BRITISH ENGLISH — 'should you require' (inverted first conditional) = 'if you should require.' This formal inversion is standard in BrE business letters and official communications. AmE would more typically use 'If you need further assistance...'", "Casual spoken AmE", "Academic writing only"], "answer": 1, "explanation": "FORMAL BrE INVERSION: 'SHOULD YOU REQUIRE' is characteristically formal BrE. Standard in: business letters, terms and conditions, official notices. The inverted conditional ('should you + base verb') is a formal BrE alternative to 'if you should + base verb.' AmE formal writing prefers the non-inverted 'if' form."}, {"type": "mcq", "q": "BrE 'autumn term' vs AmE 'fall semester' — how many differences are in this pair?", "options": ["One", "Two", "Three", "Four"], "answer": 1, "explanation": "TWO DIFFERENCES: (1) VOCABULARY: 'autumn' (BrE) vs 'fall' (AmE) for the season; (2) VOCABULARY: 'term' (BrE school division) vs 'semester' (AmE longer academic period). British schools have 'terms'; American colleges typically have 'semesters.' Two distinct vocabulary differences in one short phrase."}, {"type": "tf", "q": "Both BrE and AmE use 'OK' and 'okay' — some AmE vocabulary has been adopted globally including into BrE.", "answer": true, "explanation": "True. GLOBAL AMERICANISMS: Many AmE words are now used in BrE and worldwide: 'OK', 'okay', 'teenager', 'movie' (increasingly alongside 'film'), 'apartment' (alongside 'flat'). American cultural influence through media has introduced many AmE terms into global English. BrE and AmE are not static — they continuously influence each other."}, {"type": "mcq", "q": "'She suggested that he take a break.' The subjunctive 'take' (not 'takes') is more characteristic of:", "options": ["British English formal style only", "AMERICAN ENGLISH — AmE strongly prefers the bare subjunctive after suggest, recommend, demand, insist: 'she suggested that he TAKE.' BrE traditionally preferred 'should take' or indicative 'takes,' though the American subjunctive is increasingly used in formal BrE.", "Both equally", "Neither — 'take' is wrong"], "answer": 1, "explanation": "BARE SUBJUNCTIVE: AmE strongly favours 'she suggested that he TAKE' (bare subjunctive, no -s). BrE: 'she suggested that he SHOULD take' (modal + base verb) or 'she suggested that he TAKES' (indicative). The American subjunctive is spreading into British formal writing through globalisation."}, {"type": "mcq", "q": "In BrE, 'Dr Smith' is written without a period. In AmE, it is written 'Dr. Smith' with a period. Why does BrE omit the period?", "options": ["BrE omits all punctuation", "BrE RULE: abbreviations that END WITH THE SAME LETTER as the full word don't need a period (Dr = Doctor — ends in 'r'; Mr = Mister — ends in 'r'). Abbreviations that don't end with the final letter DO take a period in BrE (Prof. = Professor — ends in 'f' not 'r').", "No specific rule — random convention", "AmE rule applies everywhere"], "answer": 1, "explanation": "BrE ABBREVIATION RULE: No period when the abbreviation ends in the same letter as the full word: DR (doctor), MR (mister), MRS (from 'mistress'), ST (saint). Period used when the abbreviation doesn't include the final letter: PROF. (professor), FEB. (February), DEPT. (department). AmE uses periods consistently after abbreviations."}, {"type": "mcq", "q": "A learner uses 'colour' in one paragraph and 'color' in the next of the same essay. What should they be told?", "options": ["Both are correct — no problem", "While both spellings are correct in their respective varieties, MIXING them in a single text is INCONSISTENT. Choose ONE variety (BrE or AmE) and maintain it throughout. Consistency within a text is more important than which variety is chosen.", "'Color' is always wrong", "'Colour' is always wrong"], "answer": 1, "explanation": "CONSISTENCY RULE: The fundamental rule for learners is: CHOOSE ONE VARIETY AND MAINTAIN IT. Mixing 'colour' and 'color', 'travelling' and 'traveling', 'analyse' and 'analyze' in the same text signals inconsistency and lack of control. Both varieties are equally correct — but mixing them is the error to avoid."}, {"type": "mcq", "q": "Which of these pairs represents a GRAMMATICAL difference (not spelling or vocabulary) between BrE and AmE?", "options": ["Colour/color", "Autumn/fall", "'At the weekend' (BrE) vs 'on the weekend' (AmE)", "Theatre/theater"], "answer": 2, "explanation": "'AT THE WEEKEND' (BrE) vs 'ON THE WEEKEND' (AmE) = PREPOSITION DIFFERENCE (grammatical). 'Colour/color' = spelling; 'autumn/fall' = vocabulary; 'theatre/theater' = spelling. Preposition differences are a grammatical feature: BrE 'at Christmas', 'in hospital', 'different from/to' vs AmE 'on Christmas', 'in the hospital', 'different from/than'."}, {"type": "mcq", "q": "What is the most important piece of advice for English learners regarding BrE and AmE differences?", "options": ["Always use AmE because it is more widely spoken", "Always use BrE because it is the original variety", "UNDERSTAND BOTH, CHOOSE ONE, BE CONSISTENT — neither variety is superior; awareness of differences prevents confusion and inconsistency; choosing one variety and maintaining it throughout a text demonstrates language control", "Ignore the differences — they don't matter"], "answer": 2, "explanation": "FINAL ADVICE: (1) UNDERSTAND BOTH for global communication and comprehension; (2) CHOOSE ONE for consistency in writing and exams; (3) BE CONSISTENT within any single text; (4) NEITHER IS SUPERIOR — both are complete, prestigious, globally used varieties of English. This is the informed, linguistically sound position on BrE/AmE variation."}];
var SKEY="m12_assessment",NEXT="../index.html",HUB="../index.html";
var cur=0,cor=0,answered=false,st=Date.now(),ac=null,dotStates=[];
function gAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function gD(){try{return JSON.parse(localStorage.getItem('grammar_app')||'{}');}catch(e){return{};}}
function sD(d){try{localStorage.setItem('grammar_app',JSON.stringify(d));}catch(e){}}
function tM(){var d=gD();d.muted=!d.muted;sD(d);var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function pT(t){var d=gD();if(d.muted)return;try{var c=gAC();if(c.state==='suspended')c.resume();if(t==='c')pC(c);else if(t==='w')pW(c);else pF(c);}catch(e){}}
function pC(c){[[523,0],[659,.1],[784,.2]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}
function pW(c){[[240,0],[200,.1]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sawtooth';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);});}
function pF(c){[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(function(a){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=a[0];o.type='sine';var t=c.currentTime+a[1];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.start(t);o.stop(t+.5);});}
function updProgress(){var pct=Math.round(cur/Q.length*100);document.getElementById('mob-bar').style.width=pct+'%';document.getElementById('sb-bar').style.width=pct+'%';document.getElementById('mob-count').textContent='Q '+(cur+1)+' of '+Q.length;document.getElementById('sb-count').textContent=cur+' / '+Q.length;var sp=cur>0?Math.round(cor/cur*100):0;document.getElementById('sb-score').textContent=cur>0?sp+'%':'—';updDots();}
function updDots(){var grid=document.getElementById('sb-dots-grid');if(!grid)return;var html='';for(var i=0;i<Q.length;i++){var cls='sb-dot '+(i===cur?'active':(dotStates[i]||''));html+='<div class="'+cls+'">'+(i+1)+'</div>';}grid.innerHTML=html;}
function rQ(){updProgress();var q=Q[cur];answered=false;var labels={mcq:'Multiple Choice',tf:'True or False',fill:'Fill in the Blank'};var lbl=labels[q.type]||'Question';var opts='';
if(q.type==='mcq'){opts='<div class="opt-list">'+q.options.map(function(o,i){return '<button class="opt-btn" onclick="selOpt('+i+')" data-i="'+i+'"><div class="opt-key">'+String.fromCharCode(65+i)+'</div><div class="opt-text">'+o+'</div><div class="opt-icon">'+(i===q.answer?'✓':'✗')+'</div></button>';}).join('')+'</div>';}
else if(q.type==='tf'){opts='<div class="tf-grid"><button class="opt-btn" onclick="selTF(true)" data-v="true"><div class="opt-key">T</div><div class="opt-text">True</div><div class="opt-icon">'+(q.answer?'✓':'✗')+'</div></button><button class="opt-btn" onclick="selTF(false)" data-v="false"><div class="opt-key">F</div><div class="opt-text">False</div><div class="opt-icon">'+(!q.answer?'✓':'✗')+'</div></button></div>';}
else{opts='<div class="fill-wrap"><input class="fill-input" id="fi" type="text" placeholder="Type your answer..." autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.keyCode===13)subFill()">'+(q.hint?'<div class="fill-hint">💡 '+q.hint+'</div>':'')+'<button class="fill-submit" id="fsb" onclick="subFill()">Check Answer</button></div>';}
document.getElementById('qa').innerHTML='<div class="q-wrap" style="animation:fadeUp .3s ease"><div class="q-type-badge">'+lbl+'</div><div class="q-text">'+q.q+'</div></div>'+opts+'<div class="expl-box" id="eb"></div><button class="next-btn" id="nb" onclick="nextQ()">'+(cur+1<Q.length?'Next Question →':'See Results 🎯')+'</button>';
if(q.type==='fill'){setTimeout(function(){var e=document.getElementById('fi');if(e)e.focus();},150);}
var d=gD();var ic=d.muted?'🔇':'🔊';document.getElementById('mb').textContent=ic;document.getElementById('mb2').textContent=ic;}
function selOpt(i){if(answered)return;answered=true;var q=Q[cur];var ok=i===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b,j){if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok){b.classList.add('wrong');b.classList.add('shake');}else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function selTF(v){if(answered)return;answered=true;var q=Q[cur];var ok=v===q.answer;if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';document.querySelectorAll('.opt-btn').forEach(function(b){var bv=b.dataset.v==='true';if(bv===q.answer)b.classList.add('correct');else if(bv===v&&!ok)b.classList.add('wrong');else b.classList.add('dimmed');b.disabled=true;});showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function subFill(){if(answered)return;var inp=document.getElementById('fi');if(!inp||!inp.value.trim())return;answered=true;var q=Q[cur];var v=inp.value.trim().toLowerCase();var ans=(q.answer||'').toLowerCase().split('|');var ok=ans.some(function(a){return v===a.trim();});if(ok)cor++;pT(ok?'c':'w');dotStates[cur]=ok?'done-ok':'done-no';inp.classList.add(ok?'correct':'wrong');inp.disabled=true;document.getElementById('fsb').disabled=true;if(!ok){var cd=document.createElement('div');cd.style.cssText='font-size:.82em;color:var(--ok);margin-top:8px;font-weight:600;';cd.textContent='✓ Answer: '+q.answer;inp.parentNode.insertBefore(cd,document.getElementById('fsb'));inp.classList.add('shake');}showExpl(ok,q.explanation);document.getElementById('nb').classList.add('show');updDots();}
function showExpl(ok,text){var b=document.getElementById('eb');b.className='expl-box '+(ok?'correct-box':'wrong-box');b.innerHTML='<div class="expl-label '+(ok?'correct':'wrong')+'">'+(ok?'✓ Correct!':'✗ Incorrect')+'</div><div>'+text+'</div>';b.classList.add('show');setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'nearest'});},120);}
function nextQ(){cur++;if(cur>=Q.length)showResults();else{rQ();window.scrollTo({top:0,behavior:'smooth'});var m=document.querySelector('.quiz-main');if(m)m.scrollTo({top:0,behavior:'smooth'});}}
function showResults(){pT('complete');document.getElementById('qa').style.display='none';document.getElementById('mob-count').textContent='Complete!';document.getElementById('sb-count').textContent='20 / 20';document.getElementById('sb-bar').style.width='100%';document.getElementById('mob-bar').style.width='100%';
var tot=Q.length,pct=Math.round(cor/tot*100),tt=Math.round((Date.now()-st)/1000);document.getElementById('sb-score').textContent=pct+'%';dotStates=dotStates.map(function(d){return d||'done-ok';});updDots();
var d=gD();if(!d.progress)d.progress={};var prev=d.progress[SKEY];d.progress[SKEY]=Math.max(pct,prev||0);if(!d.badges)d.badges=[];var nb2=[];
if(prev===undefined&&!d.badges.includes('first_quiz')){d.badges.push('first_quiz');nb2.push('⭐ First Step');}
if(pct===100&&!d.badges.includes('perfect_score')){d.badges.push('perfect_score');nb2.push('💯 Perfect Score!');}
if(prev!==undefined&&pct>prev&&!d.badges.includes('comeback')){d.badges.push('comeback');nb2.push('💪 Comeback!');}
if(tt<120&&!d.badges.includes('speed_demon')){d.badges.push('speed_demon');nb2.push('⚡ Speed Run!');}
sD(d);
var trophy=pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'📚';var msg=pct>=90?'Outstanding work!':pct>=70?'Great job!':pct>=50?'Good effort!':'Keep practising!';
var bH=nb2.map(function(n){return '<div class="res-badge-wrap"><span style="font-size:1.8em">'+n.split(' ')[0]+'</span><div><div style="font-size:.82em;font-weight:700;color:#b45309">Badge Unlocked!</div><div style="font-size:.75em;color:#6b7280">'+n.split(' ').slice(1).join(' ')+'</div></div></div>';}).join('');
var sc=document.getElementById('rs');
sc.innerHTML='<div class="res-trophy">'+trophy+'</div><div class="res-score">'+pct+'%</div><div class="res-msg">'+msg+' — '+cor+'/'+tot+' correct</div>'+bH+'<div class="res-stats"><div class="res-stat-row"><span>Correct</span><span class="res-correct">✓ '+cor+'</span></div><div class="res-stat-row"><span>Incorrect</span><span class="res-wrong">✗ '+(tot-cor)+'</span></div><div class="res-stat-row"><span>Score</span><span class="res-mono">'+pct+'%</span></div><div class="res-stat-row"><span>Time</span><span class="res-mono">'+Math.floor(tt/60)+'m '+tt%60+'s</span></div></div><div class="res-actions"><a class="res-primary" href="'+NEXT+'">Back to Dashboard</a><button class="res-secondary" onclick="retryQuiz()">↺ Retry this quiz</button><a class="res-secondary" href="'+HUB+'">← Back to Dashboard</a></div>';
sc.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
function retryQuiz(){cur=0;cor=0;answered=false;st=Date.now();dotStates=[];document.getElementById('rs').classList.remove('show');document.getElementById('qa').style.display='';rQ();window.scrollTo({top:0,behavior:'smooth'});}
updDots();rQ();
</script>
